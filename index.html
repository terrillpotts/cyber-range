      "<div class='step'>Correlate &amp; alert<br><span style='color:var(--text-faint)'>analyst</span></div>" +
    "</div>" +
    "<p>Syslog remains the workhorse transport for network gear and *nix systems; Windows environments typically forward Event Log data via an agent (WEF, Beats, a SIEM-native forwarder). Whatever the transport, the collector's job is to normalize inconsistent source formats into a common schema so a search for 'failed logins' returns results whether the source was a Linux box or a Windows domain controller.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Retention matters as much as collection. A perfectly-tuned detection is worthless if the underlying logs were only kept for 24 hours and the incident wasn't spotted for a week.</p></div>" +
    "<h3>Infrastructure concepts that change your job</h3>" +
    "<p>Modern environments aren't just racks of static servers. You'll be asked to reason about:</p>" +
    "<ul><li><b>Virtualization</b> — one physical host running many logical ones; a compromised hypervisor can mean every guest is suspect.</li>" +
    "<li><b>Containerization</b> — workloads that may live for seconds. If logs aren't shipped off-host immediately, the evidence disappears with the container.</li>" +
    "<li><b>Serverless / cloud-native</b> — no persistent host to log into at all; visibility depends entirely on the cloud provider's own audit and activity logs.</li></ul>" +
    "<h3>Network architecture &amp; identity</h3>" +
    "<p>Segmentation limits blast radius: a flat network means one foothold reaches everything, while VLANs, firewall zones, and microsegmentation force an attacker to work for lateral movement. Zero Trust takes this further — instead of trusting anything already 'inside the perimeter,' every request is authenticated, authorized, and evaluated on context (device posture, identity, location) continuously, not just at initial login.</p>" +
    "<p>Identity and access management (IAM) — least privilege, role-based access, MFA — is the control plane that makes segmentation and Zero Trust actually enforceable. As an analyst, IAM logs (who authenticated, from where, with what privilege) are often your highest-signal data source.</p>"
},
indicators: {
  title:"Reading the Signals: Indicators of Compromise",
  html:
    "<p>An indicator is a data point that <i>might</i> mean something bad happened. Most, individually, are ambiguous — the skill is pattern recognition across categories, not single-signal panic.</p>" +
    "<h3>Network-related indicators</h3>" +
    "<ul><li>Unusual bandwidth spikes, especially outbound, off-hours</li><li>Beaconing — connections at suspiciously regular intervals to the same external host</li><li>Irregular peer-to-peer traffic on a network that shouldn't have any</li><li>Rogue devices appearing on the network (new unrecognized MACs)</li><li>Scan/sweep patterns — sequential port or host probing</li></ul>" +
    "<h3>Host-related indicators</h3>" +
    "<ul><li>Sudden CPU/memory/disk consumption with no explanation</li><li>Unauthorized processes, services, or scheduled tasks</li><li>Unauthorized changes to system files, registry keys, or configurations</li><li>New local admin or service accounts nobody provisioned</li></ul>" +
    "<h3>Application-related indicators</h3>" +
    "<ul><li>Anomalous activity within an application's own logs (bulk exports, off-hours admin actions)</li><li>Unexpected outbound connections initiated by an application process</li><li>Unexplained service interruptions or crashes</li></ul>" +
    "<p>Severity classification helps route your response — a scan probe from the internet is routine noise; the same probe followed by a successful authentication is a different conversation entirely:</p>" +
    "<div class='pill-row'><span class='sev-pill sev-critical'>Critical</span><span class='sev-pill sev-high'>High</span><span class='sev-pill sev-medium'>Medium</span><span class='sev-pill sev-low'>Low</span><span class='sev-pill sev-info'>Info</span></div>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>'Living off the land' (LOTL) activity — attackers using PowerShell, WMI, or other built-in admin tools instead of custom malware — is specifically designed to look like one of these indicators, but blend into legitimate admin noise. Context (who, when, from where) is what separates it from routine activity.</p></div>" +
    "<h3>Other indicators</h3>" +
    "<p>Not everything shows up in a log. Social engineering — a helpdesk call requesting a password reset that skips normal verification, an employee reporting a convincing phishing attempt — is a legitimate indicator category and often the true root cause behind indicators you see elsewhere in the stack.</p>"
},
toolkit: {
  title:"The Analyst Toolkit: SIEM, Packet Capture &amp; Log Analysis",
  html:
    "<p>Different questions call for different tools. Knowing which one answers which question is half the job.</p>" +
    "<h3>Core categories</h3>" +
    "<ul>" +
    "<li><b>SIEM</b> — aggregates and correlates log data across the environment; where most triage starts.</li>" +
    "<li><b>Packet capture</b> (Wireshark, tcpdump) — ground truth for what actually crossed the wire, down to payload bytes.</li>" +
    "<li><b>Endpoint security / EDR</b> — process trees, file/registry activity, and the ability to isolate a host remotely.</li>" +
    "<li><b>DNS / IP reputation</b> — quick triage of whether an indicator is known-bad, known-good, or unknown.</li>" +
    "<li><b>Malware analysis / sandboxing</b> — detonate a suspicious file in isolation to observe behavior without risking production.</li>" +
    "<li><b>SOAR</b> — orchestrates and automates the response actions a SIEM's detections trigger, so playbooks run consistently instead of being improvised each time.</li>" +
    "<li><b>Scripting</b> — even basic Python/PowerShell/Bash lets you pull data via API, parse logs at scale, and stitch tools together that don't natively talk to each other.</li>" +
    "</ul>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>SIEM vs. SOAR is a common point of confusion: SIEM answers <i>\"did something happen?\"</i> SOAR answers <i>\"now that something happened, what do we automatically do about it?\"</i> Many platforms bundle both, but they are conceptually distinct.</p></div>" +
    "<h3>A typical triage flow</h3>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>SIEM alert fires</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Check reputation of indicators</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Pivot to raw logs / PCAP</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>EDR isolate if confirmed</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>SOAR playbook / ticket</div>" +
    "</div>" +
    "<p>You'll practice exactly this kind of pivot in the hands-on lab that follows this lesson — reading a raw auth log and following the evidence to a conclusion, the same way you would in a real SIEM's search bar.</p>"
},
threatintel: {
  title:"Threat Intelligence &amp; Threat Hunting",
  html:
    "<p>Detection tells you what already happened. Intelligence and hunting are how you get ahead of what hasn't happened yet.</p>" +
    "<h3>Sources and confidence</h3>" +
    "<p>Threat intel comes from open-source feeds (OSINT), commercial/closed-source vendors, and sector-specific ISACs where peer organizations share what they're seeing. Not all intel is equally trustworthy — a mature program tracks source reliability and confidence level, not just the indicator itself.</p>" +
    "<h3>Open source vs. closed source collection</h3>" +
    "<p><b>Open-source</b> collection pulls from publicly accessible material: social media, blogs/forums, government bulletins, CERT/CSIRT advisories, and the deep/dark web. <b>Closed-source</b> collection comes from paid vendor feeds, information-sharing organizations (like ISACs), and internal sources — an organization's own incident history and telemetry. Neither category is automatically more trustworthy; that's what confidence-level scoring is for.</p>" +
    "<h3>Confidence level: timeliness, relevancy, accuracy</h3>" +
    "<p>Every piece of intelligence gets weighed on three factors before it drives a decision: <b>timeliness</b> (is this indicator still current, or has the attacker already rotated past it?), <b>relevancy</b> (does this actually apply to your industry, tech stack, and threat model?), and <b>accuracy</b> (has it been corroborated, or is it a single unverified report?). A hunt or block action built on stale, irrelevant, or unverified intel wastes effort at best and misses real threats at worst.</p>" +
    "<h3>Threat actor types</h3>" +
    "<p>Not every adversary looks the same, and the category shapes how you respond: <b>APTs</b> (advanced persistent threats) are well-resourced, patient, and targeted; <b>hacktivists</b> act on ideology; <b>organized crime</b> is profit-driven; <b>nation-state</b> actors serve government interests; <b>script kiddies</b> use existing tools with limited sophistication; <b>insider threats</b> split into <i>intentional</i> (deliberate harm) and <i>unintentional</i> (carelessness); and <b>supply chain</b> actors compromise a trusted vendor or dependency to reach the real target indirectly.</p>" +
    "<h3>The Pyramid of Pain</h3>" +
    "<p>Not all indicators cost an attacker the same to change. Hash values and IP addresses are cheap to rotate; changing TTPs (Tactics, Techniques, and Procedures) means retooling an entire operation. This is why mature defenses weight TTP-based detection over pure IOC blocklists — it's harder for an attacker to route around.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step' style='color:var(--text-faint)'>Hash values (trivial to change)</div><div class='arrow'>&#8594;</div>" +
      "<div class='step' style='color:var(--text-faint)'>IP addresses</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Domain names</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Network/host artifacts</div><div class='arrow'>&#8594;</div>" +
      "<div class='step' style='color:var(--accent)'>TTPs (hardest to change)</div>" +
    "</div>" +
    "<h3>Threat hunting</h3>" +
    "<p>Hunting is proactive and hypothesis-driven: instead of waiting for an alert, an analyst starts from a theory grounded in attacker behavior — <i>\"if an adversary had persistence here, they'd likely use a scheduled task or cron entry\"</i> — and goes looking for evidence, whether or not anything has fired yet. The MITRE ATT&amp;CK framework is the shared vocabulary most hunts and detections are mapped against, so findings are comparable across tools and teams. Good hunts often focus on specific high-value areas: known configuration/misconfiguration weak points, isolated networks that get less routine scrutiny, and business-critical assets and processes where a miss would hurt most.</p>" +
    "<h3>Active defense and honeypots</h3>" +
    "<p>Most of this platform is about detecting and responding to what an attacker does. <b>Active defense</b> flips part of that — deliberately shaping the environment to detect or delay an attacker, rather than passively waiting. A <b>honeypot</b> is the clearest example: a decoy system with no legitimate business purpose, so any interaction with it is inherently suspicious. It buys early warning and a low-risk window to observe attacker behavior before real assets are ever touched.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Every lab in this platform maps its findings back to an ATT&amp;CK technique ID for exactly this reason — it's the language you'll use to communicate findings in a real SOC.</p></div>"
},
vulnScanningLesson: {
  title:"Scanning the Estate: Methods, Scope &amp; Special Cases",
  html:
    "<p>You can't secure what you don't know exists. Before a single scan runs, vulnerability management starts with an accurate asset inventory — otherwise 'scope' is just a guess.</p>" +
    "<h3>Active vs. passive</h3>" +
    "<p>Active scanning probes hosts directly — sending crafted requests and observing responses. It's thorough but intrusive: on fragile legacy or industrial control (ICS/OT) systems, that traffic can crash a device that was never built to handle it. Passive scanning instead observes traffic that's already flowing, trading some depth for zero risk of disruption — the right call for environments where uptime is non-negotiable.</p>" +
    "<h3>Credentialed vs. non-credentialed, agent vs. agentless</h3>" +
    "<p>A non-credentialed scan sees a host the way an outside attacker would — open ports, banners, whatever's exposed. A credentialed scan authenticates to the host itself and can see missing patches, local misconfigurations, and installed software versions directly. Agent-based scanning takes this further by installing lightweight software on the endpoint, so laptops, remote workers, and segmented hosts still report in even when a network scanner can't reach them.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Non-credentialed<br><span style='color:var(--text-faint)'>outside view</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Credentialed<br><span style='color:var(--text-faint)'>authenticated, deep</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Agent-based<br><span style='color:var(--text-faint)'>reachability-independent</span></div>" +
    "</div>" +
    "<h3>Scoping a scan</h3>" +
    "<p>Scan criteria aren't one-size-fits-all: risk tolerance, regulatory requirements, technical constraints (bandwidth, business hours, IPS/IDS interference triggering false alarms), and scanning frequency all shape how a program is built. Special considerations complicate this further — segmented networks may need a scanner appliance inside each zone, cloud/container workloads need image and API-level scanning rather than a traditional network sweep, and RF/wireless or ICS/OT environments often call for passive-only approaches.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>A scan that crashes a production PLC on a hospital or manufacturing floor is a bigger incident than almost any vulnerability it could have found. Knowing when *not* to actively scan is as important as knowing how.</p></div>"
},
vulnScanOutLesson: {
  title:"Reading Scanner Output: CVSS &amp; Validating Findings",
  html:
    "<p>A scan report is a list of claims, not a list of facts. Reading it well means understanding how CVSS is built, and treating every finding as something to validate before you trust it.</p>" +
    "<h3>Inside a CVSS base score</h3>" +
    "<p>The CVSS base score is built from several independent metrics, not one number pulled from nowhere:</p>" +
    "<ul><li><b>Attack Vector</b> — how close an attacker must be: Network, Adjacent, Local, or Physical.</li>" +
    "<li><b>Attack Complexity</b> — how much extra effort or luck the exploit requires.</li>" +
    "<li><b>Privileges Required</b> — whether the attacker needs to already be authenticated, and at what level.</li>" +
    "<li><b>User Interaction</b> — whether a victim has to click or do something for it to work.</li>" +
    "<li><b>Scope, plus Confidentiality/Integrity/Availability impact</b> — what breaks, and whether the damage spreads beyond the vulnerable component.</li></ul>" +
    "<p>Base score is the vendor-agnostic worst case. Temporal and environmental scores adjust that baseline for real-world exploit maturity and your specific environment — which is part of why raw base-score-only prioritization misses so much (more on that in the next lesson).</p>" +
    "<h3>Validate before you trust it</h3>" +
    "<div class='pill-row'><span class='sev-pill sev-critical'>True Positive</span><span class='sev-pill sev-high'>False Positive</span><span class='sev-pill sev-medium'>False Negative</span><span class='sev-pill sev-info'>True Negative</span></div>" +
    "<p>Scanners frequently infer vulnerability from a banner or version string, which is often wrong — a patched host that never updated its service banner will still get flagged (a false positive). Far more dangerous is the false negative: a real vulnerability the scan simply never surfaced, leaving a gap nobody is tracking. Validating findings — manually confirming a sample, especially anything that would trigger urgent action — is a core analyst skill, not busywork.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Treat an unvalidated critical finding the way you'd treat an unverified SIEM alert: high-value signal, but not yet a confirmed fact.</p></div>"
},
vulnPreviewLesson: {
  title:"Prioritizing Beyond CVSS: EPSS, Asset Criticality &amp; Exposure",
  html:
    "<p>CVSS tells you how bad a vulnerability could theoretically be. It says nothing about how likely it is to actually be exploited, or how much it matters if it is. Real prioritization layers in more than the base score.</p>" +
    "<h3>Three inputs beyond CVSS</h3>" +
    "<ul><li><b>EPSS (Exploit Prediction Scoring System)</b> — a probability estimate of near-term real-world exploitation, refreshed daily against observed exploit activity.</li>" +
    "<li><b>Asset criticality</b> — a CVE on the domain controller is not the same risk as the same CVE on a decommission-pending test box.</li>" +
    "<li><b>Exposure</b> — internet-facing vs. internal-only changes the realistic attack surface dramatically.</li></ul>" +
    "<p>A mature vulnerability management program combines these into a single risk score, rather than patching in raw CVSS order — which is how a 7.1 with high EPSS and internet exposure can legitimately outrank an isolated 9.8. You'll apply exactly this reasoning in the lab that follows — a scan report where the highest CVSS score in the room is deliberately <i>not</i> the right answer.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Risk tolerance matters too. Two organizations can look at the identical finding and land on different remediation timelines — one isn't wrong, they're weighing exposure and business impact differently.</p></div>"
},
vulnControlsLesson: {
  title:"Controls That Actually Mitigate: Compensating Controls &amp; Secure Design",
  html:
    "<p>\"Patch it\" is the default answer, but not always an available one. Remediation is a menu, and knowing the other options is what separates a scanner operator from a vulnerability management program.</p>" +
    "<h3>The remediation menu</h3>" +
    "<ul><li><b>Patching</b> — the direct fix, ideally tested in a staging ring before a production maintenance window, then verified with a rescan.</li>" +
    "<li><b>Compensating controls</b> — a WAF rule, an IPS signature, or added network segmentation that reduces real-world exploitability while a permanent fix is pending.</li>" +
    "<li><b>Risk transfer</b> — shifting financial exposure (e.g., cyber insurance) without changing the technical risk itself.</li>" +
    "<li><b>Risk acceptance / exception</b> — a formally documented, time-bound decision not to remediate right now, with a named owner and a review trigger — never a silent shrug.</li></ul>" +
    "<h3>Designing risk out, not just patching it out</h3>" +
    "<p>Secure design principles — least privilege, defense in depth, fail securely, input validation and secure coding practices at the application layer — prevent entire classes of vulnerability from being introduced in the first place, rather than reacting to them one CVE at a time.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Identify</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Test in staging</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Deploy in maintenance window</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Verify (rescan)</div>" +
    "</div>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>An exception without a review date isn't risk management — it's a vulnerability that got a better excuse. You'll see exactly this distinction in the capstone that follows.</p></div>"
},
irFrameworksLesson: {
  title:"Attack Methodology Frameworks: Kill Chain, Diamond Model &amp; ATT&amp;CK",
  html:
    "<p>Before you can respond to an incident, it helps to have a shared language for describing one. Three frameworks dominate that vocabulary, and each answers a different question.</p>" +
    "<h3>The Cyber Kill Chain: telling one attack's story</h3>" +
    "<p>Lockheed Martin's model breaks a single intrusion into seven linear stages:</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Recon</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Weaponization</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Delivery</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Exploitation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Installation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>C2</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Actions on Objectives</div>" +
    "</div>" +
    "<p>The defensive value is simple: breaking the chain at <i>any</i> stage stops the whole attack, and the earlier you break it, the cheaper the stop. A phishing email blocked at Delivery never costs you an Actions-on-Objectives incident.</p>" +
    "<h3>The Diamond Model: pivoting across activity</h3>" +
    "<p>Where the Kill Chain narrates one timeline, the Diamond Model connects four core features of a single event — <b>Adversary</b>, <b>Infrastructure</b>, <b>Capability</b>, and <b>Victim</b> — linked by social-political and technology meta-features. Its real power is pivoting: if you know the infrastructure (an IP or domain) from one event, you can pivot across your history to find every other victim or capability tied to that same adversary.</p>" +
    "<h3>MITRE ATT&amp;CK: the shared vocabulary</h3>" +
    "<p>ATT&amp;CK isn't a timeline at all — it's a living, community-maintained matrix of <i>tactics</i> (the attacker's goal, like Persistence or Exfiltration) crossed with <i>techniques</i> (the specific how, like a scheduled task or DNS tunneling). You've already been using it throughout this platform to tag lab findings — that's exactly its purpose: a common reference so a detection, a hunt, and an incident report can all point at the same technique ID.</p>" +
    "<h3>Testing methodologies: OSSTMM and the OWASP Testing Guide</h3>" +
    "<p>The three frameworks above describe and analyze attacker behavior after the fact. Two more named references serve a different purpose — they're methodologies for actually <i>conducting</i> a security test: <b>OSSTMM</b> (Open Source Security Testing Methodology Manual) is a general-purpose framework for structuring a security assessment, and the <b>OWASP Testing Guide</b> does the same specifically for web applications, walking through what to test and how.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Reach for the Kill Chain to explain one attack's story to a stakeholder, the Diamond Model to pivot across related activity, ATT&amp;CK to map your detection coverage, and OSSTMM/OWASP Testing Guide when you're the one planning the test rather than analyzing someone else's intrusion.</p></div>"
},
irPreviewLesson: {
  title:"The Incident Response Lifecycle",
  html:
    "<p>Incident response isn't improvisation — it's a repeatable lifecycle, most commonly framed around NIST SP 800-61: Preparation, Detection &amp; Analysis, Containment/Eradication/Recovery, and Post-Incident Activity.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Preparation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Detection &amp; Analysis</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Containment / Eradication / Recovery</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Lessons Learned</div>" +
    "</div>" +
    "<p>Preparation happens long before any alert — playbooks, contact trees, tooling access, and tested backups. Containment buys time and limits damage without necessarily removing the attacker yet (a rushed eradication can tip off an adversary and destroy evidence). Recovery restores normal operations with confidence the root cause is closed, and lessons learned feeds every gap found back into preparation for next time.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>This is the skeleton. The next lessons dig into containment/eradication/recovery decision-making and the preparation/post-incident phases in real depth.</p></div>"
},
irContainmentLesson: {
  title:"Containment, Eradication &amp; Recovery: Making the Call Under Pressure",
  html:
    "<p>Once an incident is confirmed, the instinct is to rip the malware out immediately. That instinct is often wrong — the order of operations matters as much as the actions themselves.</p>" +
    "<h3>Short-term vs. long-term containment</h3>" +
    "<p><b>Short-term containment</b> buys time without necessarily removing the attacker yet — isolating a host from the network, disabling a compromised account, or blocking an IP at the firewall. It stops the bleeding while you figure out how far the compromise actually spread. <b>Long-term containment</b> goes further: rebuilding systems from known-good images, rotating broadly-compromised credentials, and closing the vulnerability that enabled entry.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Rushing straight to eradication before you've scoped the incident risks two things: tipping off an attacker who then destroys evidence or accelerates, and missing a second foothold you haven't found yet.</p></div>" +
    "<h3>Eradication</h3>" +
    "<p>Eradication is the actual removal — deleting malware, closing the exploited vulnerability, revoking every credential the attacker touched. It should happen once you have enough scope confidence that you're not just removing the piece you can see. Where surgical cleanup isn't reliable enough, <b>re-imaging</b> — wiping the host back to a known-good baseline image rather than removing malware file by file — is often the faster, more complete option.</p>" +
    "<h3>Recovery</h3>" +
    "<p>Recovery restores normal operations, but 'restore' doesn't mean 'flip it back on.' A disciplined recovery validates the fix held — rescanning, closely monitoring for signs of reinfection, and often staging systems back online in phases rather than all at once.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Short-term containment</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Full scope confirmed</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Eradication</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Recovery + monitoring</div>" +
    "</div>" +
    "<p>You'll make exactly this containment-before-eradication call in the lab that follows — an active spread in progress, where the tempting move (nuke the malware immediately) isn't the right first step.</p>"
},
irPrepPostLesson: {
  title:"Preparation &amp; Post-Incident: Playbooks, Tabletop Exercises &amp; Root Cause Analysis",
  html:
    "<p>The best incident response happens mostly before the incident starts, and the value of an incident doesn't end when the systems come back online.</p>" +
    "<h3>Preparation artifacts</h3>" +
    "<ul><li><b>IR plan</b> — roles, responsibilities, escalation paths, and communication templates, decided calmly in advance.</li>" +
    "<li><b>Playbooks / runbooks</b> — step-by-step tactical response for a specific incident type (a ransomware playbook looks different from a phishing playbook).</li>" +
    "<li><b>Pre-arranged tooling access</b> — EDR isolation rights, forensic imaging tools, and log access, so nobody is requesting permissions mid-incident.</li>" +
    "<li><b>Tabletop exercises</b> — walking the team through a simulated scenario without touching real systems, specifically to find gaps in the plan before a real incident does.</li>" +
    "<li><b>Business continuity (BC) / disaster recovery (DR) plans</b> — how the organization keeps critical operations running through a major disruption (BC) and restores systems and data afterward (DR), worked out calmly in advance rather than improvised mid-incident.</li></ul>" +
    "<h3>Post-incident activity</h3>" +
    "<p><b>Root cause analysis</b> looks past the immediate trigger to the underlying condition that allowed it — not \"a user clicked a link\" but \"the mail gateway wasn't sandboxing macro-enabled attachments.\" <b>Lessons learned</b> reviews are blameless by design, focused on process and tooling gaps rather than who made a mistake. <b>Metrics</b> like MTTD (mean time to detect) and MTTR (mean time to respond) turn \"we're improving\" into something you can actually track over time. <b>Evidence retention and chain of custody</b> — documented, unbroken handling of logs and images — is what keeps evidence usable for legal, regulatory, or insurance purposes later.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>An incident with no lessons-learned output is a wasted incident — you paid the cost of the compromise without collecting the one thing that makes it less likely to happen again.</p></div>"
},
reportPreviewLesson: {
  title:"Writing Findings People Actually Read",
  html:
    "<p>A finding nobody understands is a finding nobody acts on. Reporting is where technical work either creates change or dies in an inbox.</p>" +
    "<h3>Know your audience</h3>" +
    "<p>An executive needs business impact and risk in plain language up front. A remediation engineer needs the technical specifics — affected systems, exact misconfiguration, reproduction steps. The same incident, told to both audiences, should share a timeline but lead with different altitudes of detail.</p>" +
    "<h3>Root cause, not just symptom</h3>" +
    "<p>\"The account was compromised\" is a symptom. \"MFA was not enforced on externally-facing VPN accounts\" is a root cause — the version that actually prevents a repeat.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>This is the mindset. The next lessons get concrete: what a vulnerability report and an incident report actually need to contain, and the disclosure discipline that keeps a well-meant update from becoming its own incident.</p></div>"
},
reportVulnLesson: {
  title:"Writing the Vulnerability Report: Structure, Metrics &amp; Action Plans",
  html:
    "<p>A vulnerability report earns its keep when someone can read it and know exactly what to do next. That means more than a CVE and a score.</p>" +
    "<h3>What belongs in the report</h3>" +
    "<ul><li>What was found, and on which specific affected hosts</li>" +
    "<li>The risk score, plus <i>why</i> — the exposure and asset-criticality reasoning from the prioritization lesson, not just a bare number</li>" +
    "<li>Business impact in plain language</li>" +
    "<li>A recommended action</li></ul>" +
    "<h3>The action plan menu</h3>" +
    "<p>Every finding resolves into one of a small set of documented outcomes — the same remediation menu from earlier in this platform, but now it's what actually gets written down: <b>Remediate</b> (patch it), <b>Mitigate</b> (compensating control), <b>Accept</b> (a documented decision with a named owner and review date — never a silent shrug), <b>Transfer</b> (insurance or contractual risk shift), or <b>False Positive</b> (with the validation evidence that proves it).</p>" +
    "<h3>Compliance reports are a different animal</h3>" +
    "<p>A report built to satisfy an auditor or a specific framework (PCI-DSS, for example) is narrower and more checklist-driven than a general technical report — it exists to prove due diligence against required fields, not to explain a finding to a colleague.</p>" +
    "<h3>Inhibitors to remediation</h3>" +
    "<p>Not every finding gets fixed on the ideal timeline, and a good report says why rather than leaving a silent gap. Named inhibitors include: an <b>SLA</b> or <b>MOU</b> that restricts when changes can happen, <b>organizational governance</b> requiring change-board approval, <b>business process interruption</b> risk (the fix would break something revenue-critical), <b>degrading functionality</b> (the fix reduces a feature users depend on), and <b>legacy or proprietary systems</b> with no supported patch path at all. None of these make a finding go away — they just explain why it's Mitigate or Accept instead of Remediate this cycle.</p>" +
    "<h3>Metrics that make a program defensible</h3>" +
    "<p>A single snapshot ('47 open criticals today') doesn't tell you if things are improving. Trend it: Mean Time to Remediate, percentage of the estate actually scanned, aging of open critical findings, a 'top 10 riskiest' list. Numbers over time are what turn a report into evidence of a program actually working.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>You'll practice exactly this kind of audience-routing in the lab that follows — the same finding doesn't always go to the same place.</p></div>"
},
reportIRLesson: {
  title:"Writing the Incident Report: Timeline, RCA &amp; Legal Considerations",
  html:
    "<p>An incident summary report is the durable record of what happened — and often the document with the most legal weight of anything the SOC produces.</p>" +
    "<h3>Core sections</h3>" +
    "<ul><li><b>Timeline</b> — what happened, in sequence, with timestamps</li>" +
    "<li><b>Root cause</b> — the underlying condition, distinct from the trigger event that set things off</li>" +
    "<li><b>Impact</b> — systems, data, and business affected</li>" +
    "<li><b>Response actions taken</b> — what containment, eradication, and recovery actually happened</li>" +
    "<li><b>Recommendations</b> — what should change so this doesn't repeat</li></ul>" +
    "<h3>Trigger vs. root cause, precisely</h3>" +
    "<p>\"A user clicked a phishing link\" is the trigger. \"Email attachments weren't being sandboxed, and the compromised account didn't have MFA\" is the root cause — the version that tells you what to actually fix.</p>" +
    "<h3>Declaration, escalation &amp; who gets looped in</h3>" +
    "<p><b>Incident declaration</b> — formally classifying an event as an actual incident — is a deliberate gate, not an assumption. Declaring triggers the IR plan: escalation to the right stakeholders, resourcing, and the notification clock. From there, <b>communications</b> route to different channels depending on what happened: <b>legal</b> for privilege and liability questions, <b>public relations</b> for customer- and media-facing messaging, <b>regulatory reporting</b> where a statutory obligation exists, and <b>law enforcement</b> specifically when criminal activity (extortion, theft of funds) is involved — usually a decision made together with legal counsel, not a reflexive first call.</p>" +
    "<h3>Legal considerations</h3>" +
    "<p>A report prepared at counsel's direction may carry attorney-client privilege — which changes who can see drafts and how casually they're forwarded, since mishandling can waive that protection. Separately, regulatory disclosure deadlines are often measured in days (sometimes hours) and vary by jurisdiction and data type — the reporting timeline itself becomes a compliance requirement, not a courtesy.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Every claim in the report should trace back to preserved evidence with an intact chain of custody — that's what makes findings hold up under later scrutiny, whether from an auditor, a regulator, or opposing counsel.</p></div>"
},
reportDisclosureLesson: {
  title:"Disclosure Discipline: What NOT to Say, and to Whom",
  html:
    "<p>A technically accurate update, said in the wrong place or before the facts are confirmed, can become its own incident.</p>" +
    "<h3>Don't speculate before you know</h3>" +
    "<p>An early \"we believe no customer data was affected\" that later turns out wrong causes more damage than a delayed, accurate statement. Facts first, statement second — even under pressure to say something.</p>" +
    "<h3>Watch where technical detail leaks</h3>" +
    "<p>A public-facing support ticket or status page update written by a well-meaning engineer can inadvertently release scope, internal hostnames, or root cause details before legal and PR have coordinated the official message. Anything customer-facing about an active incident should route through that coordination first, not straight from whoever is on-call.</p>" +
    "<h3>Disclosure is often a legal requirement, not a judgment call</h3>" +
    "<p>Who gets notified, and within what window, is frequently dictated by jurisdiction- and data-type-specific regulation — not company preference. Missing a mandated notification window creates legal exposure separate from the incident itself.</p>" +
    "<h3>Need-to-know applies internally too</h3>" +
    "<p>Being a coworker isn't the same as being on the distribution list. Curiosity from someone outside the identified response team gets redirected to the official channel, not a private answer.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>The capstone that follows puts you in exactly this position — a draft public statement, written in good faith, that's about to go out before anyone checked it against the facts.</p></div>"
},
phishing: {
  title:"Email Security &amp; Phishing Analysis: Headers, SPF/DKIM/DMARC",
  html:
    "<p>Phishing remains the most common initial access vector in real incidents — including two you've already investigated on this platform. Knowing how to actually read a message's headers, not just its display text, is what separates spotting a spoofed email from getting fooled by one.</p>" +
    "<h3>The three-part authentication stack</h3>" +
    "<p>No single check proves an email is legitimate on its own — SPF, DKIM, and DMARC each answer a different question, and mature defenses rely on all three together:</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>SPF<br><span style='color:var(--text-faint)'>is this IP allowed to send?</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>DKIM<br><span style='color:var(--text-faint)'>was the message altered?</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>DMARC<br><span style='color:var(--text-faint)'>what to do if either fails?</span></div>" +
    "</div>" +
    "<p><b>SPF</b> (Sender Policy Framework) publishes a DNS record listing which mail servers are authorized to send on a domain's behalf — a fail means the sending IP isn't on that list. <b>DKIM</b> (DomainKeys Identified Mail) adds a cryptographic signature so the receiving server can verify the message content and key headers weren't tampered with in transit. <b>DMARC</b> ties the two together and tells receiving servers what to actually do about a failure — deliver it anyway, quarantine it to spam, or reject it outright — plus gives the domain owner visibility via aggregate reports.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>A domain with no DMARC policy (or a policy of 'none') is still vulnerable to spoofing even with SPF and DKIM configured — 'none' just means monitor and report, not enforce.</p></div>" +
    "<h3>Reading headers like an analyst, not a user</h3>" +
    "<p>A user sees a friendly display name and a subject line. An analyst pulls the full header block and checks whether the 'From' display name, the actual sending domain, and the Reply-To/return-path address all agree — attackers routinely spoof the parts a casual glance sees while quietly routing replies somewhere else entirely.</p>" +
    "<h3>Domain impersonation tricks</h3>" +
    "<ul><li><b>Typosquatting</b> — a domain one character off from the real one (<code>paypa1-support.com</code>, <code>micros0ft-verify.net</code>)</li>" +
    "<li><b>Homograph attacks</b> — visually similar characters, sometimes from other alphabets, that render nearly identically to the trusted domain</li>" +
    "<li><b>Lookalike subdomains</b> — burying the real domain deep in a subdomain string (<code>secure-login.paypal.com.verify-account.net</code>) so the trusted name appears first, even though it isn't the actual domain</li></ul>" +
    "<p>Attachments and links deserve the same scrutiny as the headers themselves — a suspicious attachment gets detonated in a sandbox, never opened directly, using exactly the same isolation principle covered earlier for general malware analysis.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>You'll put all of this together in the lab that follows — a real header block to pull apart, not just a screenshot of an inbox.</p></div>"
},
cloudvuln: {
  title:"Cloud &amp; Container Vulnerability Considerations",
  html:
    "<p>Vulnerability management doesn't stop being relevant in the cloud — it just changes shape. A CVE and a misconfiguration are different categories of risk, and cloud environments generate both constantly.</p>" +
    "<h3>The shared responsibility model</h3>" +
    "<p>Cloud providers secure 'of the cloud' — physical data centers, the hypervisor, the underlying network fabric. Customers remain responsible for 'in the cloud' — IAM policy, data classification, workload configuration, and how their own resources are set up. Misreading this split is one of the most common root causes behind cloud breaches: the provider was never going to stop a customer from configuring a public bucket.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Provider secures<br><span style='color:var(--text-faint)'>infrastructure, hypervisor</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Customer secures<br><span style='color:var(--text-faint)'>IAM, data, workload config</span></div>" +
    "</div>" +
    "<h3>Misconfiguration vs. CVE</h3>" +
    "<p>A CVE is a flaw in the software itself, fixed by a patch. A misconfiguration is a control that exists and works correctly, but was set incorrectly by whoever provisioned it — a public storage bucket, an overly-permissive security group, an IAM role granted far more access than it uses. No vendor patch fixes a policy setting; only correcting the configuration does. In cloud environments, misconfigurations are consistently the leading cause of data exposure, not exploited CVEs.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Least privilege applies to machine identities just as much as human ones — a service account with admin rights it never uses is exactly as risky as an over-permissioned human account, and often gets far less scrutiny.</p></div>" +
    "<h3>Scanning shifts left</h3>" +
    "<p><b>Container image scanning</b> checks the OS packages and dependencies baked into an image for known vulnerabilities before it's ever deployed — and because many containers share a common base image, one flawed base can propagate the same vulnerability across everything built from it, making base-image hygiene high-leverage. <b>IaC (Infrastructure as Code) scanning</b> goes a step earlier still, reviewing Terraform/CloudFormation-style templates for insecure settings before the infrastructure they describe is ever provisioned.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>IaC scan<br><span style='color:var(--text-faint)'>before provisioning</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Image scan<br><span style='color:var(--text-faint)'>before deployment</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Runtime monitoring<br><span style='color:var(--text-faint)'>after deployment</span></div>" +
    "</div>" +
    "<p>You'll triage exactly this mix — a public bucket, an over-permissive role, and a vulnerable container image — in the lab that follows, and have to decide which one actually matters most.</p>"
},
forensics: {
  title:"Digital Forensics Fundamentals: Evidence Handling &amp; Chain of Custody",
  html:
    "<p>An incident report is only as strong as the evidence behind it. Forensic discipline — how evidence is collected, preserved, and documented — is what makes findings hold up under later scrutiny, whether from an auditor, a regulator, or opposing counsel.</p>" +
    "<h3>Order of volatility</h3>" +
    "<p>Not all evidence has the same shelf life. Some disappears the moment a system loses power; other evidence persists indefinitely. Collection should always move from most to least volatile:</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>RAM / active connections<br><span style='color:var(--text-faint)'>gone on reboot</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Running processes / cache</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Disk contents</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Backups / archived logs<br><span style='color:var(--text-faint)'>persist longest</span></div>" +
    "</div>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Powering off a compromised system to 'be safe' before capturing RAM is one of the most common evidence-destroying mistakes an under-trained first responder can make.</p></div>" +
    "<h3>Acquisition integrity</h3>" +
    "<p>A <b>write blocker</b> physically or electronically prevents any write operation to the original evidence drive during imaging — without one, even the act of examining a drive can alter timestamps or data on it. Once an image is acquired, a cryptographic hash (typically SHA-256) is calculated immediately and recorded as the integrity baseline; matching that hash at any later point proves the image is still bit-for-bit identical to what was originally collected.</p>" +
    "<h3>Chain of custody</h3>" +
    "<p>Chain of custody is the unbroken, documented record of who handled a piece of evidence, when, and what was done to it — from seizure through analysis through storage. It's not a formality: a gap in that record, even with a technically sound forensic image, can be enough to make evidence unusable in a legal, regulatory, or disciplinary proceeding later.</p>" +
    "<h3>Legal holds</h3>" +
    "<p>Once litigation or a formal investigation is reasonably anticipated, a <b>legal hold</b> overrides routine data retention and deletion schedules — including normal automated log rotation — for anything potentially relevant. Deleting held data, even accidentally via a routine process nobody thought to pause, can create serious legal exposure independent of the underlying incident.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>The lab that follows hands you a custody form with a real gap in it — the kind of documentation lapse that's easy to miss until it matters.</p></div>"
},
metrics: {
  title:"Metrics That Matter: KPIs, KRIs &amp; Communicating Risk to Leadership",
  html:
    "<p>A security program that can't measure itself can't prove it's improving — and can't get leadership buy-in for what it needs next. Choosing the right metrics, and framing them for a non-technical audience, is its own skill.</p>" +
    "<h3>KPI vs. KRI</h3>" +
    "<p>These get used interchangeably but answer different questions. A <b>KPI (Key Performance Indicator)</b> measures how well a process is performing — MTTR trending down, scan coverage trending up. A <b>KRI (Key Risk Indicator)</b> is a leading signal that risk is building before anything has actually gone wrong — a rising count of unpatched internet-facing critical assets, or shrinking MFA coverage across privileged accounts.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>KPI<br><span style='color:var(--text-faint)'>how well are we performing?</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>KRI<br><span style='color:var(--text-faint)'>is risk building up?</span></div>" +
    "</div>" +
    "<h3>Why a raw count isn't a metric</h3>" +
    "<p>\"312 open vulnerabilities\" tells a leader almost nothing on its own — is that trending down from 500, or up from 50? Are they low-severity internal findings or critical internet-facing ones? A defensible metrics program pairs counts with trend lines, severity breakdowns, and coverage — 'percentage of the estate actually scanned' matters as much as the count itself, since an impressively low number means little if most of the environment was never looked at.</p>" +
    "<h3>MTTD and MTTR together</h3>" +
    "<p>Mean Time to Detect and Mean Time to Respond aren't interchangeable — total exposure time is the sum of both. A fast MTTR doesn't help much if MTTD is measured in weeks; the damage accumulated long before response even began. Trending both over time is what turns 'we think we're getting better' into something a leadership team can actually see. <b>Alert volume</b> is worth tracking alongside them — a rising volume with flat headcount is often a leading signal of analyst fatigue and missed detections, predicting a future MTTD/MTTR problem before it shows up in those numbers directly.</p>" +
    "<h3>SLOs and the Top 10</h3>" +
    "<p>An <b>SLO (service-level objective)</b> is an internal target a team holds itself to — \"criticals remediated within 15 days\" — distinct from an <b>SLA</b>, which is typically an external, often contractual commitment owed to someone else. And when a backlog runs into the hundreds, a prioritized <b>Top 10</b> list turns an overwhelming count into something a stakeholder can actually act on this week, rather than an undifferentiated wall of findings.</p>" +
    "<h3>The risk register</h3>" +
    "<p>A risk register entry needs more than a description — a likelihood/impact assessment, a named owner, and a current treatment status (remediate/mitigate/accept/transfer), the same disciplined categories used for individual findings, now applied at the whole-program level.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>The lab that follows hands you raw technical numbers and asks you to decide what actually belongs in front of an executive — and, just as important, what to leave out.</p></div>"
},
archFundamentals: {
  title:"System &amp; Network Architecture Fundamentals",
  html:
    "<p>Everything else in this platform — indicators, tools, hunting, response — sits on top of a foundation of architecture concepts. This lesson covers the building blocks CS0-003 expects you to know cold.</p>" +
    "<h3>Log ingestion basics</h3>" +
    "<p>Two easy-to-overlook settings quietly determine whether your logs are even useful: <b>time synchronization</b> (NTP) keeps every host's clock aligned so multi-system events can be correlated into one trustworthy timeline, and <b>logging levels</b> (debug/info/warning/error/critical) control how much detail actually reaches the SIEM — set too low and you miss signal, too high and you drown in noise.</p>" +
    "<h3>OS concepts worth knowing</h3>" +
    "<ul><li><b>Windows Registry</b> — the hierarchical config database; a favorite persistence target (Run keys) and a common host-investigation artifact.</li>" +
    "<li><b>System hardening</b> — shrinking the attack surface: disabling unused services, removing default accounts, enforcing secure baselines.</li>" +
    "<li><b>File structure / configuration file locations</b> — knowing where a given OS keeps its config (e.g., <code>/etc/</code> on Linux) is what makes investigating a misconfiguration fast instead of a scavenger hunt.</li>" +
    "<li><b>System processes</b> and <b>hardware architecture</b> — understanding what should normally be running, and the underlying CPU/memory model, is the baseline you compare abnormal activity against.</li></ul>" +
    "<h3>Network architecture models</h3>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>On-premises<br><span style='color:var(--text-faint)'>fully owned/controlled</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Hybrid<br><span style='color:var(--text-faint)'>mixed</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Cloud<br><span style='color:var(--text-faint)'>third-party infrastructure</span></div>" +
    "</div>" +
    "<p>Each model shifts where the security responsibility boundary sits. Two newer architectural patterns show up specifically on the exam: <b>SASE</b> (Secure Access Secure Edge) converges networking and security functions — SWG, CASB, ZTNA — into a cloud-delivered edge service instead of backhauling all traffic through a central appliance stack; <b>SDN</b> (software-defined network) decouples the control plane (routing/policy decisions) from the data plane (packet forwarding), enabling centralized, programmatic network management at scale.</p>" +
    "<h3>Identity and access management (IAM)</h3>" +
    "<p>Beyond basic MFA, know the distinctions: <b>SSO</b> lets one login cover multiple apps inside a single trust boundary; <b>federation</b> extends that same trust relationship across separate organizations; <b>PAM</b> (privileged access management) specifically controls and monitors elevated accounts; <b>passwordless</b> authentication removes the password as an attack surface entirely (biometrics, hardware keys); and a <b>CASB</b> sits between users and cloud providers, giving security teams visibility and policy enforcement (like DLP) over cloud app usage IT doesn't directly host.</p>" +
    "<h3>Encryption and sensitive data protection</h3>" +
    "<p><b>PKI</b> (public key infrastructure) underpins trust for certificates and encrypted communication; <b>SSL/TLS inspection</b> decrypts traffic at the edge so security tools can actually see what's moving through an otherwise-opaque encrypted tunnel. On the data side, <b>DLP</b> (data loss prevention) enforces policy over sensitive categories like <b>PII</b> (personally identifiable information — anything that identifies a person) and <b>CHD</b> (cardholder data — payment card information specifically governed by PCI DSS).</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>None of these concepts live in isolation on the real exam — a scenario question might describe a SASE rollout and then ask what CASB visibility it restores, or describe a Registry change and ask you to classify it as a host-related indicator. Know the vocabulary, not just the definitions.</p></div>"
},
toolsScripting: {
  title:"SOC Toolkit: Named Tools, Scripting &amp; Automation",
  html:
    "<p>The earlier toolkit lesson covered tool <i>categories</i> (SIEM, EDR, sandboxing). CS0-003 also expects you to recognize specific named tools and the scripting/automation skills that tie them together — this lesson fills that in.</p>" +
    "<h3>Named tools by function</h3>" +
    "<ul><li><b>DNS/IP reputation</b> — <b>WHOIS</b> (domain/IP registration details) and <b>AbuseIPDB</b> (community-sourced IP abuse reports).</li>" +
    "<li><b>File analysis</b> — <b>Strings</b> (extracts readable text from a binary without executing it) and <b>VirusTotal</b> (checks a file hash against dozens of AV engines and prior detections at once).</li>" +
    "<li><b>Sandboxing</b> — <b>Joe Sandbox</b> and <b>Cuckoo Sandbox</b>, both named dynamic-analysis platforms that detonate suspicious files in isolation.</li></ul>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>You don't need to be an expert operator of every tool here — the exam tests recognition: given a scenario, which named tool fits the task.</p></div>" +
    "<h3>Scripting and structured data</h3>" +
    "<p>You don't need to be a software engineer, but fluency with a few formats and languages compounds fast: <b>JSON</b> and <b>XML</b> are the structured formats most APIs, logs, and threat feeds use — reading them directly beats waiting on a dashboard to render. <b>Python</b>, <b>PowerShell</b>, and <b>shell script</b> let you automate repetitive pulls and log parsing instead of doing it by hand every time. <b>Regular expressions (regex)</b> let you define a precise search pattern once and apply it across huge log volumes — a skill that pays off regardless of which specific tool wraps it.</p>" +
    "<h3>Automation and orchestration (efficiency at the process level)</h3>" +
    "<p>Not every task is worth automating — the right candidates are <i>repeatable</i> and <i>don't require human judgment</i> to execute. Once identified, <b>SOAR</b> platforms orchestrate the actual playbook execution, and <b>threat intelligence orchestration</b> — data enrichment plus combining multiple feeds — turns disconnected raw indicators into fewer, higher-confidence alerts worth an analyst's attention.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Identify repeatable task</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Integrate via API/webhook/plugin</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Orchestrate (SOAR)</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Single pane of glass</div>" +
    "</div>" +
    "<p>Tool integration — via <b>API</b>, <b>webhooks</b>, and <b>plugins</b> — is what makes that automation possible in the first place; without it, every handoff between tools needs a human. The end goal many SOCs aim for is a <b>single pane of glass</b>: consolidated visibility across tools instead of constant context-switching between separate consoles.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Efficiency work isn't about replacing analysts — it's about routing human judgment to the decisions that actually need it, and letting automation handle everything that's purely repetitive.</p></div>"
},
vulnTypes: {
  title:"Web Application &amp; Software Vulnerability Types",
  html:
    "<p>Everything covered in Vulnerability Management so far is about <i>process</i> — scanning, scoring, prioritizing, remediating. This lesson is about the actual vulnerability <i>categories</i> a scan or a pentest turns up, so a finding's name means something the moment you read it.</p>" +
    "<h3>Injection and query manipulation</h3>" +
    "<p><b>Injection flaws</b> happen when untrusted input gets concatenated directly into a command or query interpreter — SQL injection is the classic example, where attacker input alters a database query's logic to read, modify, or destroy data it was never meant to touch. The fix (parameterized queries) is covered in the next lesson.</p>" +
    "<h3>Cross-site scripting (XSS)</h3>" +
    "<p><b>Reflected XSS</b> rides on a single crafted link or request — the payload executes once and isn't stored anywhere. <b>Persistent (stored) XSS</b> is far more dangerous: the payload is saved server-side (a comment field, a profile bio) and fires automatically for every user who later views that content.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Reflected XSS<br><span style='color:var(--text-faint)'>one-shot, via a link</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Persistent XSS<br><span style='color:var(--text-faint)'>stored, fires for every viewer</span></div>" +
    "</div>" +
    "<h3>Request forgery: CSRF vs. SSRF</h3>" +
    "<p>These sound similar but attack different victims. <b>CSRF</b> (cross-site request forgery) tricks a logged-in <i>user's browser</i> into firing a state-changing request the user never intended, riding on their existing session. <b>SSRF</b> (server-side request forgery) tricks the <i>server itself</i> into making an unintended request — often reaching internal-only resources (like a cloud metadata endpoint) the attacker could never reach directly from outside.</p>" +
    "<h3>Path and file abuse: directory traversal, LFI/RFI</h3>" +
    "<p><b>Directory traversal</b> uses relative-path sequences (<code>../../../</code>) to escape an application's intended directory and read files it was never meant to expose. When an application dynamically <i>includes and executes</i> a file based on unvalidated input, that's <b>LFI</b> (local file inclusion) if it's restricted to files already on the server, or <b>RFI</b> (remote file inclusion) if the attacker can point it at a file they host remotely.</p>" +
    "<h3>Memory corruption: overflow vulnerabilities</h3>" +
    "<p>A <b>buffer overflow</b> happens when input exceeds the memory space allocated for it and spills into adjacent memory — potentially corrupting data or hijacking program execution. The same root idea shows up in more specific forms: <b>stack</b> and <b>heap</b> overflows (named for which memory region gets corrupted) and <b>integer overflows</b> (a numeric value exceeds what its data type can hold and wraps around unexpectedly, sometimes bypassing a size check entirely).</p>" +
    "<h3>Access, authentication, and identity failures</h3>" +
    "<p><b>Broken access control</b> means the application fails to properly enforce what an authenticated user is actually allowed to see or do — often as simple as changing an ID in a URL with no server-side authorization check. <b>Identification and authentication failures</b> cover weaknesses in verifying identity itself: missing account lockouts, weak password policy, broken session handling. Successfully exploiting either can lead to <b>privilege escalation</b> — ending up with more access than intended.</p>" +
    "<h3>Design, configuration, and lifecycle risk</h3>" +
    "<p><b>Insecure design</b> is a root-cause category, not a coding bug — a system architected without the relevant threat model in mind (like trusting client-side validation alone) can't be patched into secure; it has to be redesigned. <b>Security misconfiguration</b> covers default credentials, unnecessary enabled services, and overly verbose error output — a deployment issue, not a code flaw. <b>End-of-life (EOL) / outdated components</b> stop receiving vendor patches, so every future flaw discovered in them stays open permanently until replaced.</p>" +
    "<h3>Cryptographic failures and data poisoning</h3>" +
    "<p><b>Cryptographic failures</b> cover weak, misused, or absent cryptography — plaintext password storage, broken hashing algorithms, or encryption implemented so poorly it provides false confidence. <b>Data poisoning</b> is a newer, distinct category: an attacker feeds corrupted or malicious data into a system's training set or trusted input feed (a machine learning model, a shared threat intel feed) to quietly skew its future output.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p><b>Remote code execution (RCE)</b> is often the worst-case outcome several of these categories can chain into — an injection flaw or overflow that ultimately lets an attacker run arbitrary commands of their choosing on the target. The lab that follows has you sort real findings into these categories — the next lesson covers the specific controls that stop each one.</p></div>"
},
vulnTools: {
  title:"Vulnerability Scanning Tools &amp; Industry Frameworks",
  html:
    "<p>CS0-003 expects you to recognize specific named tools by category, not just the general concepts. This lesson is a reference pass through the tools and frameworks most likely to show up by name.</p>" +
    "<h3>Asset discovery and reconnaissance</h3>" +
    "<p>Before scanning, you need to know what's actually there: <b>map scans</b> sweep a network range to find live hosts, and <b>device fingerprinting</b> identifies what a discovered host actually is (OS, open services) from its network behavior. <b>Angry IP Scanner</b> and <b>Maltego</b> (link-analysis/OSINT mapping) are named tools in this space; <b>Nmap</b> and <b>Recon-ng</b> are multipurpose tools that do reconnaissance and scanning both.</p>" +
    "<h3>Web application scanners</h3>" +
    "<p><b>Burp Suite</b>, <b>Zed Attack Proxy (ZAP)</b>, <b>Arachni</b>, and <b>Nikto</b> are all built specifically to probe web applications for the vulnerability classes covered in the previous lesson — injection, XSS, misconfig, and more.</p>" +
    "<h3>Vulnerability scanners and multipurpose frameworks</h3>" +
    "<p><b>Nessus</b> and <b>OpenVAS</b> are the named general-purpose vulnerability scanners you'll see referenced directly. <b>Metasploit Framework (MSF)</b> goes further than scanning into actual exploitation and validation of findings. <b>Immunity Debugger</b> and <b>GDB</b> (GNU Debugger) are used for lower-level analysis — stepping through a program's execution, which is how overflow and memory-corruption vulnerabilities actually get discovered and understood.</p>" +
    "<h3>Cloud infrastructure assessment</h3>" +
    "<p>Cloud environments need their own tooling: <b>Scout Suite</b>, <b>Prowler</b>, and <b>Pacu</b> are named tools built specifically to assess cloud account configuration and posture (IAM policy, storage exposure, and the kind of misconfigurations covered in the cloud vulnerability lesson).</p>" +
    "<h3>Static vs. dynamic analysis</h3>" +
    "<p><b>Static</b> analysis examines code or a binary without running it; <b>dynamic</b> analysis observes behavior during actual execution. Two dynamic techniques worth knowing by name: <b>reverse engineering</b> (working backward from a compiled binary to understand its logic) and <b>fuzzing</b> (bombarding an application with malformed/random input to surface crashes and unexpected behavior — often exactly how overflow bugs get found).</p>" +
    "<h3>Critical infrastructure scanning</h3>" +
    "<p><b>OT</b> (operational technology), <b>ICS</b> (industrial control systems), and <b>SCADA</b> (supervisory control and data acquisition) environments run physical-world equipment that active scanning can knock offline — this is exactly why the earlier lesson on passive vs. active scanning matters most here.</p>" +
    "<h3>Industry frameworks and baselines</h3>" +
    "<p>Scanning isn't just ad hoc — mature programs anchor to published standards: <b>PCI DSS</b> (payment card data security), <b>CIS benchmarks</b> (vendor-neutral secure-configuration baselines), <b>OWASP</b> (web application security guidance), and the <b>ISO 27000 series</b> (international information security management standards). <b>Security baseline scanning</b> checks a system's actual configuration against one of these standards, rather than just looking for known CVEs.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>You won't be asked to operate every tool listed here — the exam tests recognition: given a scenario (\"assess this AWS account's IAM posture\"), which named tool category fits.</p></div>"
},
vulnControlsAdvanced: {
  title:"Controls, Attack Surface Management &amp; Secure SDLC",
  html:
    "<p>Knowing a vulnerability exists is only half the job. This lesson covers the control taxonomy, attack-surface discipline, and secure-development practices CS0-003 expects for actually managing that risk.</p>" +
    "<h3>The control-type taxonomy</h3>" +
    "<p>Controls get classified along two independent axes. By <b>category</b>: <b>managerial</b> (policy/risk decisions), <b>operational</b> (people/process, like training or physical security), and <b>technical</b> (enforced by technology). By <b>function</b>: <b>preventative</b> (stops it before it happens), <b>detective</b> (notices it happened), <b>responsive</b> (acts once detected), and <b>corrective</b> (fixes/restores after impact). A firewall rule is a technical/preventative control; a SIEM alert is technical/detective; an incident response playbook execution is operational/responsive.</p>" +
    "<h3>Patching and configuration management lifecycle</h3>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Testing</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Implementation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Validation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Rollback<br><span style='color:var(--text-faint)'>if validation fails</span></div>" +
    "</div>" +
    "<p>Patches deploy inside scheduled <b>maintenance windows</b> to limit business disruption, and every patch needs a <b>rollback</b> plan in case it breaks something worse than the vulnerability it fixed.</p>" +
    "<h3>Attack surface management</h3>" +
    "<p>You can't defend what you don't know is exposed. <b>Edge discovery</b> and <b>passive discovery</b> map what's actually reachable from outside without necessarily touching it directly. <b>Security controls testing</b>, <b>penetration testing</b>, and <b>adversary emulation</b> actively validate whether existing defenses hold up under a real attempt — adversary emulation specifically mimics a known threat actor's actual TTPs rather than generic testing. A <b>bug bounty</b> program crowdsources that same validation to external researchers. The end goal across all of it is <b>attack surface reduction</b> — actually shrinking what's exposed, not just cataloging it.</p>" +
    "<h3>Secure coding best practices</h3>" +
    "<p>These are the direct countermeasures to the vulnerability types from the previous lesson: <b>input validation</b> (reject malformed/unexpected input before it's processed — the core defense against injection and overflow), <b>output encoding</b> (neutralizes XSS by ensuring output is rendered as data, not executable code), <b>session management</b> (properly issued, expired, and protected session tokens), <b>authentication</b> controls (lockouts, MFA, strong password policy), <b>data protection</b> (encryption at rest/in transit), and <b>parameterized queries</b> (the direct fix for SQL injection — user input is passed as data, never concatenated into the query itself).</p>" +
    "<h3>SDLC and threat modeling</h3>" +
    "<p>A <b>secure SDLC (software development life cycle)</b> builds security review into every phase of development, not as a bolt-on before release. <b>Threat modeling</b> is done early in that cycle — systematically asking \"what could go wrong here, and who would want to make it go wrong\" before a single line of code is written, so insecure design gets caught at the whiteboard instead of in production.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Notice the throughline: attack surface management finds what's exposed, secure coding prevents new flaws from being introduced, and SDLC/threat modeling catch design-level risk before it ever ships. Three different points in the same lifecycle.</p></div>"
}
};
