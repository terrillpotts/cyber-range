    { q:"How does MITRE ATT&CK differ structurally from the Cyber Kill Chain?", opts:["ATT&CK is a linear 7-stage timeline just like the Kill Chain","ATT&CK is a matrix of tactics and techniques used as a shared vocabulary and coverage map, not a strict linear sequence","ATT&CK only covers nation-state actors","They are functionally identical frameworks"], correct:1,
      explain:"ATT&CK is organized as tactics (the why) crossed with techniques (the how) — built for mapping detection coverage and comparing incidents, not narrating one attack start to finish." },
    { q:"An analyst knows the infrastructure (a specific C2 domain) used in one confirmed incident and wants to find every other victim tied to that same adversary. Which framework's core strength directly supports this?", opts:["The Cyber Kill Chain","The Diamond Model, by pivoting across the Infrastructure feature to related Victim and Capability data","ATT&CK tactics alone","None of these frameworks support pivoting"], correct:1,
      explain:"The Diamond Model's four linked features (Adversary, Infrastructure, Capability, Victim) are built exactly for this kind of pivot — start from one known feature and traverse to related activity." },
    { q:"Why is 'breaking the chain early' emphasized in Kill Chain-based defensive thinking?", opts:["Later stages are always easier and cheaper to stop","Stopping an attack at an earlier stage (e.g., Delivery) is both cheaper and prevents all the damage of every stage that would have followed","The Kill Chain has no preference for when an attack is stopped","Only the final stage, Actions on Objectives, is worth defending against"], correct:1,
      explain:"A phishing email blocked at Delivery never costs you the cleanup, damage, or investigation of a full Actions-on-Objectives incident — earlier is strictly cheaper." },
    { q:"What do OSSTMM and the OWASP Testing Guide provide, as distinct from Kill Chain/Diamond Model/ATT&CK?", opts:["They are attacker-behavior frameworks for describing an intrusion after the fact","They are structured testing methodologies — OSSTMM for general security testing, the OWASP Testing Guide for web applications specifically — used to plan and execute assessments rather than analyze completed attacks", "They are incident report templates","They are compliance certification bodies"], correct:1,
      explain:"OSSTMM and the OWASP Testing Guide are methodology documents for how to conduct a security test — a different purpose than the attacker-behavior frameworks (Kill Chain, Diamond Model, ATT&CK) used to describe or analyze an intrusion." }
  ],
  irContainment: [
    { q:"Why might a responder choose short-term containment (e.g., network isolation) over immediately eradicating malware?", opts:["Short-term containment is always faster regardless of context","It buys time and limits spread while preserving evidence and situational awareness before acting further","Eradication is never appropriate during an active incident","There's no meaningful difference between the two"], correct:1,
      explain:"Isolating first stops the bleeding without tipping your hand or destroying evidence — eradication comes once you actually understand the scope." },
    { q:"What is a risk of eradicating an attacker's presence before fully scoping the incident?", opts:["It always improves recovery time","You may miss additional footholds or persistence mechanisms planted elsewhere","Eradication is risk-free once any containment has happened","It guarantees a clean recovery"], correct:1,
      explain:"An attacker who established multiple footholds will simply use the one you didn't find yet if you eradicate before you've scoped the full extent of the compromise." },
    { q:"What does the recovery phase specifically validate before an incident is declared closed?", opts:["That the ticket was filed correctly","That systems are actually clean and monitored closely for reinfection before fully returning to normal operations","That the attacker has been identified and arrested","Recovery has no validation step"], correct:1,
      explain:"Recovery isn't just 'turn it back on' — it includes confirming the fix held and watching closely for signs the attacker is still present." },
    { q:"An organization isolates a compromised host from the network but has not yet removed the malware from it. This best describes:", opts:["Eradication","Short-term containment","Recovery","Preparation"], correct:1,
      explain:"Isolating without yet removing the threat is exactly what short-term containment means — buy time and stop spread, deal with full removal next." },
    { q:"What distinguishes long-term containment from short-term containment?", opts:["Long-term containment is simply short-term containment done for a longer time period","Long-term containment takes further action like rebuilding from known-good images and rotating broadly-compromised credentials, beyond just buying time","There is no meaningful difference between the two","Long-term containment happens before short-term containment"], correct:1,
      explain:"Short-term containment stops the bleeding; long-term containment starts actively closing the gap — rebuilding systems and rotating credentials — while still short of full eradication." },
    { q:"After a system is brought back online post-recovery, what should continue to happen?", opts:["Nothing further is needed once systems are back online","Close monitoring for signs of reinfection, since a clean-looking recovery isn't a guarantee the root cause is fully closed","The incident ticket should be deleted immediately","Recovery only applies to backups, not live systems"], correct:1,
      explain:"A disciplined recovery treats 'back online' as the start of a monitoring window, not the end of the incident — reinfection after a rushed recovery is common enough to watch for deliberately." },
    { q:"A compromised workstation is wiped and rebuilt from a known-good golden image rather than having malware manually removed file by file. This recovery approach is called:", opts:["Re-imaging","Short-term containment","Preparation","Root cause analysis"], correct:0,
      explain:"Re-imaging wipes a system back to a trusted baseline rather than trying to surgically remove every trace of compromise — often faster and more reliably complete than manual cleanup." }
  ],
  irPrepPost: [
    { q:"What is the primary purpose of a tabletop exercise?", opts:["To physically test backup generators","To walk a team through a simulated incident scenario and find gaps in the IR plan before a real incident does","To replace the need for playbooks entirely","It's purely a compliance checkbox with no operational value"], correct:1,
      explain:"A tabletop exercise is a rehearsal — it's far cheaper to discover a gap in your plan on a Tuesday afternoon than during an actual incident at 2 AM." },
    { q:"How do business continuity (BC) and disaster recovery (DR) planning fit into the Preparation phase?", opts:["They belong to Post-Incident Activity, not Preparation","They're prepared in advance so the organization can keep critical operations running (BC) and restore systems/data (DR) after a major disruption, rather than improvising both during the incident", "BC/DR planning is unrelated to incident response entirely","They're only relevant for natural disasters, never cyber incidents"], correct:1,
      explain:"BC/DR plans — like playbooks and tooling access — are built calmly in advance so an organization isn't improvising how to keep the business running or restore systems while an incident is actively unfolding." },
    { q:"What distinguishes an IR playbook/runbook from the overall IR plan?", opts:["They are identical documents with different names","The playbook gives step-by-step tactical actions for a specific incident type, while the plan defines overall roles, escalation, and process","Playbooks are only used after an incident closes","Plans are optional if playbooks exist"], correct:1,
      explain:"The plan is the strategic skeleton (who does what, who to call); playbooks are the tactical muscle memory for a specific scenario like ransomware or phishing." },
    { q:"Why track metrics like MTTD (mean time to detect) and MTTR (mean time to respond)?", opts:["They're legally mandated in every jurisdiction","They give an objective, trackable signal of whether the detection and response program is actually improving over time","They replace the need for root cause analysis","They only matter for a manager's performance review"], correct:1,
      explain:"Without a number to track, 'we're getting better at IR' is just a feeling. MTTD/MTTR turn program maturity into something measurable over time." },
    { q:"Why does evidence retention and chain of custody matter during an incident?", opts:["It's just paperwork with no real consequence","Properly documented, preserved evidence may be needed for legal action, regulatory reporting, or insurance claims, and gaps can make it unusable","It only applies to physical evidence, never digital","It's solely law enforcement's responsibility, not the SOC's"], correct:1,
      explain:"A broken chain of custody can make otherwise solid evidence worthless in a legal, regulatory, or insurance context — documentation discipline during the incident is what preserves its value later." },
    { q:"What makes a lessons-learned review 'blameless' by design?", opts:["No one is allowed to attend except management","It focuses on process and tooling gaps rather than which individual made a mistake, so people report honestly instead of covering up details", "It skips discussing what actually went wrong","Blameless means no changes are ever recommended"], correct:1,
      explain:"A review focused on assigning fault teaches people to hide details next time; a blameless review focused on process gaps gets the honest information needed to actually improve." },
    { q:"An incident's root cause is identified as 'the mail gateway wasn't sandboxing macro-enabled attachments,' rather than 'a user clicked a link.' Why does this distinction matter for preparation?", opts:["It doesn't — both statements are equally actionable","The deeper root cause points to a fixable systemic gap, while the surface trigger only describes what happened this one time","User training is never worth pursuing as a fix","Root cause statements are only used for legal purposes"], correct:1,
      explain:"'A user clicked a link' will happen again regardless of training; fixing the sandboxing gap actually closes the door that let the click matter in the first place." }
  ],
  reportPreview: [
    { q:"When writing a vulnerability finding for an executive audience, what should lead the report?", opts:["Raw scanner output and CVE IDs","Business impact and risk in plain language, with technical detail available after","A full packet capture appendix only","Nothing — executives only read dashboards"], correct:1,
      explain:"Executive stakeholders need risk framed in business terms first; technical detail should support, not open, the narrative." },
    { q:"What is the goal of root cause analysis in an incident report?", opts:["To identify who to discipline","To determine the underlying condition that allowed the incident, not just the symptom","To close the report as quickly as possible","To avoid mentioning the timeline"], correct:1,
      explain:"RCA looks past the immediate trigger to the underlying gap (a missing control, a misconfiguration) so it can actually be fixed." },
    { q:"Which audience typically needs the MOST technical detail in an incident communication?", opts:["Board of directors","Legal/PR team","The engineering team performing remediation","External customers"], correct:2,
      explain:"Different stakeholders need different altitudes of the same story — remediation engineers need the technical specifics; execs and customers need impact and next steps." },
    { q:"What should lead an incident update intended for a non-technical stakeholder?", opts:["Raw log excerpts","Business impact and next steps in plain language","A full CVE list","Nothing — non-technical stakeholders get no report"], correct:1,
      explain:"Every audience gets the same underlying facts, but the altitude changes — non-technical stakeholders need impact and action, not raw technical artifacts." },
    { q:"Two reports describe the same incident — one for the board, one for the remediation team. What should stay consistent between them?", opts:["Nothing — they should tell different stories entirely","The underlying timeline and facts, even though the level of technical detail differs by audience","Only the executive summary needs to be accurate","The remediation team's report should omit the root cause"], correct:1,
      explain:"Different altitudes of detail are fine and expected; different facts are not — a board report and an engineering report about the same incident must agree on what actually happened." },
    { q:"Why is 'the account was compromised' considered a symptom rather than a root cause?", opts:["It's actually a complete root cause on its own","It describes what happened without explaining the underlying condition that allowed it — e.g., missing MFA — which is what actually needs fixing","Symptoms and root causes are interchangeable terms","Root causes are only relevant for vulnerability reports, not incidents"], correct:1,
      explain:"A symptom tells you the outcome; a root cause tells you the gap to close so it doesn't happen again. 'MFA wasn't enforced' is fixable — 'the account was compromised' just restates the incident." }
  ],
  reportVuln: [
    { q:"Which of these best describes a 'compliance report' as distinct from a standard technical vulnerability report?", opts:["It's identical to a technical report, just renamed","It's structured to satisfy a specific framework or auditor's required fields — often narrower in audience and more checklist-driven","It never includes remediation status","It's only ever used internally, never shared externally"], correct:1,
      explain:"A compliance report exists to prove due diligence to a specific auditor or framework, so its structure is dictated by that framework's required fields rather than general readability." },
    { q:"A finding is documented as 'Accepted' rather than remediated. What MUST accompany that decision for it to be legitimate risk management rather than avoidance?", opts:["Nothing — acceptance requires no documentation","A named owner and a review date or trigger","A CVSS score above 9.0","Approval from the scanner vendor"], correct:1,
      explain:"An exception without an owner and a review trigger isn't risk management — it's a vulnerability that got a better excuse, as covered back in the controls lesson." },
    { q:"Why track Mean Time to Remediate (MTTR) as a KPI rather than just the current open-vulnerability count?", opts:["MTTR is easier to calculate","A snapshot count doesn't show whether the program is actually getting faster over time — MTTR trends do","MTTR replaces the need for CVSS entirely","MTTR only matters to executives, never analysts"], correct:1,
      explain:"A single count is a snapshot; a trend line is a story. MTTR (and metrics like it) let a program prove improvement, not just report a current state." },
    { q:"What is the risk of a vulnerability report that lists only CVE IDs and CVSS scores with no business context?", opts:["Nothing — that's sufficient for any audience","Non-technical stakeholders can't act on it, and remediation prioritization stalls without exposure/asset context","It's actually the ideal format for every audience","CVEs alone always guarantee fast remediation"], correct:1,
      explain:"Without exposure, asset criticality, or business impact attached, a raw CVE list is data, not information — nobody can prioritize or act on it confidently." },
    { q:"A vulnerability report recommends 'Mitigate' rather than 'Remediate' for a specific finding. What does that mean?", opts:["The finding is being ignored entirely","A compensating control (e.g., a WAF rule or added segmentation) is reducing real-world risk while a full fix is still pending","The finding has been proven to be a false positive","Mitigate and Remediate mean exactly the same thing"], correct:1,
      explain:"Mitigate specifically means the underlying flaw isn't fixed yet, but a compensating control is actively reducing exploitability in the meantime — distinct from Remediate (patched) or Accept (documented and left as-is)." },
    { q:"Why does 'aging of open critical findings' matter as a tracked metric, beyond just the current open count?", opts:["It doesn't matter — only the current snapshot count is meaningful","A critical finding open for 90+ days signals a process breakdown that a same-day snapshot count would hide", "Aging metrics are only relevant to compliance auditors","Older findings are automatically lower risk"], correct:1,
      explain:"A snapshot count can look stable while individual findings quietly age past any reasonable SLA — aging surfaces exactly the findings a healthy program should be embarrassed are still open." },
    { q:"A critical patch can't be applied because the vendor contract's SLA guarantees a maintenance window only once per quarter. This is an example of:", opts:["A compensating control","An inhibitor to remediation (SLA-driven)","A false positive","A compliance report requirement"], correct:1,
      explain:"SLAs, MOUs, organizational governance, business process interruption risk, and legacy/proprietary system constraints are all named inhibitors — real-world reasons remediation can't just happen on the analyst's preferred timeline." },
    { q:"A finding can't be remediated because the only system running the vulnerable software is a legacy proprietary appliance the vendor no longer supports or allows to be modified. Which inhibitor category does this represent?", opts:["Degrading functionality","Legacy/proprietary systems","Business process interruption","Organizational governance"], correct:1,
      explain:"Legacy and proprietary systems are called out specifically as remediation inhibitors — sometimes there's no supported patch path at all, only compensating controls or eventual replacement." },
    { q:"Patching a specific vulnerability would break a critical, revenue-generating business process that depends on the current (vulnerable) configuration. This inhibitor is best classified as:", opts:["Business process interruption","A memorandum of understanding (MOU)","Degrading functionality","A service-level agreement (SLA)"], correct:0,
      explain:"Business process interruption is its own named inhibitor — sometimes the technically correct fix has a real, quantifiable operational cost that has to be weighed and communicated, not silently ignored." }
  ],
  reportIR: [
    { q:"What is the difference between a trigger event and a root cause in an incident report?", opts:["They're the same thing, just different words","The trigger is the immediate action that set off the incident; the root cause is the underlying condition that allowed it to succeed","Root cause only applies to insider-threat incidents","Triggers are always technical, root causes are always human error"], correct:1,
      explain:"'A user clicked a link' is the trigger. 'Email attachments weren't being sandboxed' is the root cause — the distinction is what actually gets fixed." },
    { q:"Why might regulatory breach notification deadlines matter as much as the technical response itself?", opts:["They don't — only technical response matters","Many jurisdictions impose strict, legally binding notification windows, and missing them creates separate legal exposure beyond the breach itself","Notification deadlines are always optional guidelines","Only law enforcement cares about notification timing"], correct:1,
      explain:"Missing a regulatory clock doesn't just look bad — it can trigger fines and legal consequences independent of the underlying incident." },
    { q:"Why might an incident report prepared at legal counsel's direction be handled differently (e.g., marked privileged)?", opts:["It's just a formatting preference with no real effect","It may be protected under attorney-client privilege, which affects who can access it and how casually it's shared — mishandling it can waive that protection","Privilege only ever applies to verbal conversations","All incident reports are automatically privileged regardless of preparation"], correct:1,
      explain:"Privilege is easy to waive by accident — forwarding a privileged draft outside the intended circle can strip the legal protection it was meant to have." },
    { q:"What should an incident report's evidence references include to remain defensible later?", opts:["Just a narrative summary, no references needed","Clear references to preserved evidence (logs, images) with intact chain-of-custody notes","Evidence never needs to be referenced in the written report","Only law enforcement needs evidence references"], correct:1,
      explain:"A report is only as strong as the evidence trail behind it — clear references with unbroken custody are what make findings hold up under later scrutiny." },
    { q:"An incident report is prepared at the direction of legal counsel and marked privileged. What is the practical effect of forwarding a draft to a colleague outside the response team \"just to keep them in the loop\"?", opts:["No effect — privilege can never be lost once granted","It can waive attorney-client privilege, since sharing outside the intended circle undermines the confidentiality privilege depends on","It automatically extends privilege to that colleague","Privilege only applies to verbal statements, so this has no effect"], correct:1,
      explain:"Privilege is fragile — casual forwarding outside the circle counsel intended can strip the legal protection the document was meant to have." },
    { q:"Why do regulatory breach notification windows function as compliance requirements rather than courtesies?", opts:["They are polite suggestions with no enforcement behind them","Missing a legally mandated notification deadline can trigger fines and legal consequences independent of the breach itself","Notification windows are set entirely at the company's discretion","Only law enforcement, never regulators, sets these windows"], correct:1,
      explain:"A missed statutory notification deadline is its own compliance failure — separate from, and in addition to, whatever damage the underlying incident caused." },
    { q:"What is 'incident declaration,' and why does it matter as a distinct step?", opts:["An informal, undocumented judgment call left to whoever notices something odd","The formal act of classifying an event as an actual incident, which triggers the IR plan, escalation path, and stakeholder notification — a deliberate gate, not an assumption", "A synonym for the final incident report","A step that only applies after an incident is already fully resolved"], correct:1,
      explain:"Declaring an incident is what formally starts the clock — it triggers escalation, resourcing, and notification obligations, so treating it as a deliberate decision (not an assumption) matters." },
    { q:"When is it appropriate to involve law enforcement in incident communications?", opts:["Never — law enforcement involvement is always counterproductive","When the incident involves criminal activity (e.g., extortion, theft of funds, certain data breaches) where legal counsel determines reporting is warranted or required", "Only after the incident report is fully published externally","Law enforcement must always be contacted before any internal containment action"], correct:1,
      explain:"Law enforcement involvement is a judgment call usually made with legal counsel, typically triggered by criminal activity like extortion or theft — it's one of the named communication channels alongside legal, PR, and regulators, not an automatic first step." }
  ],
  reportDisclosure: [
    { q:"Why is speculating publicly about an incident's scope before facts are confirmed risky?", opts:["Speculation is always accurate so there's no risk","An early inaccurate statement that later proves wrong is worse than a delayed accurate one, and can create legal/reputational exposure","There's no risk to early speculation","Regulators require immediate speculation before facts are known"], correct:1,
      explain:"'We believe no customer data was affected' followed by a correction is far more damaging than a delayed, accurate statement — get it right before you say it publicly." },
    { q:"Why should technical staff avoid discussing incident specifics in a public-facing support ticket or status page?", opts:["Public tickets are always fully encrypted so it doesn't matter","It can inadvertently release sensitive details before legal and PR have coordinated the official communication","Public tickets are the correct venue for incident specifics","There's no meaningful difference between public and internal channels"], correct:1,
      explain:"A well-meaning technical update posted publicly can leak scope, internal hostnames, or root cause details before anyone decided that should be public." },
    { q:"What generally determines 'who must be notified, and within what window' after a data breach?", opts:["It's entirely up to the company's preference","Jurisdiction- and data-type-specific regulatory requirements, which can be legally binding","Only the CEO decides with no external constraints","Law enforcement always makes this decision alone"], correct:1,
      explain:"Disclosure obligations are frequently dictated by law, not judgment calls — different regions and data types carry different mandatory windows." },
    { q:"An employee outside the identified incident response team asks a responder for details out of curiosity. What's the correct response?", opts:["Share full details since they're a trusted coworker","Decline and redirect them to the incident's identified communication channel or need-to-know list","Give them a summary since they technically work at the company","Ask them to sign an NDA on the spot, then share everything"], correct:1,
      explain:"Need-to-know discipline applies inside the building too — being a coworker isn't the same as being on the distribution list." },
    { q:"A support engineer, trying to be helpful, posts on a public status page that the incident was caused by \"an unpatched VPN appliance at IP 203.0.113.44 running firmware v2.1.\" What's the problem with this update?", opts:["Nothing — transparency is always the right call regardless of detail level","It leaks specific technical detail (IP, firmware version) that could help an attacker or competitor, and wasn't coordinated with legal/PR first","Status pages should never mention incidents at all, even vaguely","The engineer should have used more technical detail, not less"], correct:1,
      explain:"Specific exploitable detail on a public page is exactly the kind of leak disclosure discipline exists to prevent — customer-facing updates should route through coordinated messaging, not go out raw from whoever is on-call." },
    { q:"Which best describes the right posture when facts about an active incident are still unconfirmed but stakeholders are pressing for an update?", opts:["Say whatever sounds reassuring to buy time","Communicate what is confirmed, be explicit about what's still under investigation, and avoid speculating on unconfirmed scope","Stay completely silent until the investigation fully closes, no matter how long that takes","Let each individual responder decide what to say to whoever asks"], correct:1,
      explain:"The goal isn't silence or speculation — it's an accurate, scoped statement that says what's known, flags what isn't yet, and avoids the kind of premature claim that has to be walked back later." }
  ],
  phishing: [
    { q:"An email header shows 'spf=fail' for the sending domain. What does this indicate?", opts:["The email was successfully encrypted in transit","The sending server's IP is not authorized to send mail on behalf of the claimed domain — a strong spoofing indicator","The recipient's mailbox is full","SPF failures are purely cosmetic and carry no security meaning"], correct:1,
      explain:"SPF (Sender Policy Framework) publishes which mail servers are allowed to send for a domain. A fail means the sending IP isn't on that authorized list — classic spoofing behavior." },
    { q:"What does DKIM verify, as distinct from SPF?", opts:["That the sending IP is on an authorized list","That the message content and key headers weren't altered in transit, via a cryptographic signature tied to the sending domain","That the recipient opened the email","That the email passed antivirus scanning"], correct:1,
      explain:"DKIM (DomainKeys Identified Mail) uses a cryptographic signature to prove the message wasn't tampered with and genuinely originated from a server holding the domain's private key — a different guarantee than SPF's IP allow-listing." },
    { q:"What does a DMARC policy of 'reject' instruct a receiving mail server to do with a message that fails both SPF and DKIM alignment?", opts:["Deliver it to the inbox as normal","Refuse to deliver the message at all, rather than deliver it or merely flag it","Forward it to the domain's IT team for manual review","Automatically reply to the sender asking for verification"], correct:1,
      explain:"DMARC 'reject' is the strictest enforcement level — instead of quarantining (spam folder) or taking no action, the receiving server drops messages that fail alignment entirely." },
    { q:"A phishing email is sent from 'paypa1-support.com' impersonating a legitimate brand. What technique is this?", opts:["SQL injection","Homograph/typosquatting domain spoofing","DNS cache poisoning","Cross-site scripting"], correct:1,
      explain:"Substituting a visually similar character (the digit '1' for a lowercase 'l', or a lookalike domain) to impersonate a trusted brand is a classic typosquatting/homograph technique used to defeat casual visual inspection." },
    { q:"Why is a mismatch between an email's 'From' display name and its actual 'Reply-To' or return-path address a red flag?", opts:["It's a normal artifact of most legitimate mail systems and means nothing","A legitimate-looking display name paired with a suspicious reply address is a common technique to get a reply routed somewhere the victim doesn't expect", "Display names and reply addresses are always identical by protocol design","This mismatch only matters for text messages, not email"], correct:1,
      explain:"Attackers spoof the friendly display name (what the victim sees at a glance) while routing actual replies to an attacker-controlled address — checking headers, not just the display name, catches this." },
    { q:"What is the primary purpose of sandboxing a suspicious email attachment before a user opens it?", opts:["To make the email load faster","To observe what the attachment actually does (file writes, network calls) in isolation before it can affect a real endpoint","Sandboxing attachments is not a real security practice","To automatically reply to the sender"], correct:1,
      explain:"Detonating an unknown attachment in an isolated sandbox reveals its real behavior with zero risk to production endpoints — the same principle covered earlier for general malware analysis, applied specifically to email." }
  ],
  cloudvuln: [
    { q:"Under the cloud shared responsibility model, who is typically responsible for securing IAM configuration and data access policies in an IaaS/PaaS deployment?", opts:["The cloud provider handles this entirely","The customer — providers secure the underlying infrastructure, but access control and data configuration are the customer's responsibility","No one — cloud platforms are secure by default with no configuration needed","This split doesn't exist; responsibility is always 100% the provider's"], correct:1,
      explain:"The shared responsibility model splits duties: the provider secures 'of the cloud' (physical infrastructure, hypervisor), while the customer secures 'in the cloud' (IAM policy, data classification, workload configuration)." },
    { q:"A storage bucket is discovered configured with public read access, exposing internal documents to anyone with the URL. What category of finding is this?", opts:["A CVE requiring a vendor patch","A cloud misconfiguration — a control that exists but was set incorrectly, not a software flaw needing a patch","A false positive by definition","An issue that only affects on-premises storage, not cloud"], correct:1,
      explain:"Misconfigurations (as opposed to CVEs) are usually the leading cause of cloud data exposure — the control existed, it was just set wrong, and no patch fixes a policy setting." },
    { q:"Why does an over-permissive IAM role (e.g., a service account granted full administrative access when it only needs to read one bucket) represent elevated risk?", opts:["It has no security implication as long as credentials aren't leaked","It violates least privilege — if that identity is ever compromised, the blast radius is everything the role can touch, not just what it actually uses","Overly broad roles always run faster","IAM roles cannot be scoped more narrowly than 'admin' in modern clouds"], correct:1,
      explain:"Least privilege means granting exactly what's needed — an over-scoped role turns a single compromised credential into a much larger incident than necessary." },
    { q:"What does container image scanning primarily check for?", opts:["Network latency between containers","Known vulnerabilities in the OS packages and application dependencies baked into a container image before it's deployed","Whether the container has a catchy name","CPU allocation limits"], correct:1,
      explain:"Image scanning inspects the layers of a container image for known-vulnerable packages before that image is ever run — catching risk at build time rather than in production." },
    { q:"What is Infrastructure as Code (IaC) scanning designed to catch?", opts:["Grammar errors in code comments","Insecure configurations (e.g., an open security group, an unencrypted storage resource) defined in templates before the infrastructure is ever provisioned","Only runtime performance issues","IaC scanning is identical to container image scanning"], correct:1,
      explain:"IaC scanning shifts detection left — reviewing Terraform/CloudFormation-style templates for insecure settings before the resources they describe are actually created." },
    { q:"A container image scan flags a critical CVE in a base OS package used by dozens of running containers. What does this scenario primarily illustrate about container vulnerability management?", opts:["Container vulnerabilities are isolated to a single container and never propagate","A single vulnerable base image can propagate the same flaw across every container built from it, making base-image hygiene a high-leverage control","Container scanning is unnecessary once a container is deployed","Base images cannot contain vulnerabilities by design"], correct:1,
      explain:"Because many containers commonly inherit from the same base image, a flaw there has outsized blast radius — fixing the base image fixes every descendant at once, which is why base-image hygiene matters so much." }
  ],
  forensics: [
    { q:"What does 'chain of custody' document, and why does it matter?", opts:["The technical steps of a patch deployment","An unbroken record of who handled a piece of evidence, when, and what was done to it — gaps can make evidence inadmissible or unusable later","The org chart of the incident response team","A list of tools used during detection only"], correct:1,
      explain:"Chain of custody proves evidence wasn't tampered with or mishandled between collection and use — a documented gap can be enough to get evidence thrown out or discounted later." },
    { q:"What does the 'order of volatility' guide during evidence collection?", opts:["The order in which reports should be written","Collecting the most easily-lost evidence (e.g., RAM contents, network connections) before more persistent evidence (e.g., disk images), since volatile data disappears first","The order in which stakeholders are notified","The order vendors should be contacted"], correct:1,
      explain:"RAM, active network connections, and running processes vanish the moment a system is powered off — order of volatility says grab that first, before moving to disk images and other data that persists longer." },
    { q:"Why is a cryptographic hash (e.g., SHA-256) calculated for a forensic disk image immediately after acquisition?", opts:["To compress the image for storage","To create a fingerprint that proves the image hasn't been altered since acquisition — any later hash mismatch means integrity was compromised", "Hashing is only a legal formality with no technical purpose","To encrypt the disk image"], correct:1,
      explain:"A hash taken at acquisition time becomes the baseline — matching that hash at any future point proves the image is bit-for-bit identical to what was originally collected, which is the whole basis for trusting it as evidence." },
    { q:"What is the purpose of a 'legal hold' in the context of an incident under investigation?", opts:["A hold that pauses all business operations company-wide","A directive to preserve specific data/systems and suspend routine deletion (e.g., normal log rotation) because litigation or investigation is reasonably anticipated","A technical control that encrypts evidence automatically","A synonym for chain of custody"], correct:1,
      explain:"A legal hold overrides routine retention/deletion schedules for anything potentially relevant to an investigation — deleting held data, even via a normal automated process, can create serious legal exposure." },
    { q:"Why is a write blocker used when acquiring a forensic image from a suspect drive?", opts:["To make the imaging process faster","To physically/electronically prevent any write operation to the original evidence drive during acquisition, preserving its original state","Write blockers are only needed for network evidence, not drives","To automatically encrypt the drive"], correct:1,
      explain:"A write blocker guarantees the acquisition process itself can't alter the original evidence — without one, even the act of imaging a drive could inadvertently modify timestamps or data on it." },
    { q:"An analyst images a drive but does not document who had access to it between seizure and imaging. What is the primary consequence?", opts:["No consequence — documentation is optional as long as the image itself is intact","A break in the chain of custody, which can undermine the evidence's credibility and usability in any later legal, regulatory, or disciplinary proceeding","The image file becomes corrupted automatically","This only matters for evidence involving external law enforcement"], correct:1,
      explain:"Chain of custody isn't just about the technical acquisition — it's the documented, unbroken record of handling. A gap in that record is a gap in credibility, regardless of whether the technical image itself is sound." }
  ],
  metrics: [
    { q:"What is the difference between a KPI (Key Performance Indicator) and a KRI (Key Risk Indicator)?", opts:["They are identical terms for the same measurement","A KPI measures how well a process is performing (e.g., MTTR trending down); a KRI signals rising risk exposure before it becomes an incident (e.g., number of unpatched critical assets)","KRIs are only used by auditors, never by SOC teams","KPIs measure risk, KRIs measure performance"], correct:1,
      explain:"KPIs tell you how well you're doing something; KRIs are early-warning signals that risk is building even before anything has gone wrong yet." },
    { q:"Why does MTTD (mean time to detect) matter as much as MTTR (mean time to respond)?", opts:["MTTD is a legacy metric no longer tracked by mature SOCs","The longer an attacker goes undetected, the more damage accumulates before response even begins — detection speed and response speed are both part of total exposure time","MTTD only applies to vulnerability management, never incidents","MTTR always matters more, since detection is instantaneous in practice"], correct:1,
      explain:"Total exposure time is detection time plus response time — a fast MTTR doesn't help much if MTTD is measured in weeks, since the damage was already done before response even started." },
    { q:"An executive dashboard shows a single number: '312 open vulnerabilities.' What is the main limitation of presenting risk this way?", opts:["It's a perfectly complete picture of risk on its own","A raw count carries no context on severity, exposure, trend direction, or business impact — it can't distinguish a healthy backlog from a crisis","Executives should never see numeric metrics at all","The number is always wrong if not broken down by CVE"], correct:1,
      explain:"312 could be trending down from 500 (good news) or up from 50 (bad news), and could be low-severity internal findings or critical internet-facing ones — the raw count alone tells you almost nothing actionable." },
    { q:"What belongs in a risk register entry, beyond just a description of the risk?", opts:["Only a CVE identifier","A likelihood/impact assessment, a named owner, and current treatment status (accept/mitigate/transfer/remediate)","Nothing else is needed once a risk is written down","Risk registers are exclusively for financial risks, not cyber risks"], correct:1,
      explain:"A risk register entry without an owner and a treatment decision is just a list of worries — the same discipline as a documented risk exception applies at the whole-register level." },
    { q:"Why should a metric like 'percentage of the estate actually scanned' be tracked alongside vulnerability counts?", opts:["Coverage doesn't affect how trustworthy a vulnerability count is","A low vulnerability count from a program with 40% coverage is far less reassuring than the same count from a program with 95% coverage — the count is only as good as what was actually looked at","Scan coverage is a compliance-only metric with no operational value","Coverage percentage never changes over time so it's not worth tracking"], correct:1,
      explain:"An impressively low vulnerability count means little if most of the estate was never scanned — coverage is the denominator that makes the numerator (the count) meaningful." },
    { q:"When translating a technical finding into a metric for leadership, what should generally be avoided?", opts:["Trend lines showing improvement over time","Jargon-heavy technical detail with no business framing, presented without context on trend or impact","Framing findings in terms of business risk","Comparing current metrics to a previous reporting period"], correct:1,
      explain:"Leadership needs enough context to make a decision — a wall of technical jargon with no trend or business framing forces them to either ignore it or ask someone else to translate it anyway." },
    { q:"Why does a SOC track 'alert volume' as its own metric, separate from MTTD/MTTR?", opts:["Alert volume has no operational value on its own","A rising alert volume with flat headcount is a leading signal of analyst fatigue and missed detections, even before MTTD/MTTR visibly degrade", "Alert volume only matters for billing purposes","Alert volume and MTTD measure the exact same thing"], correct:1,
      explain:"Alert volume is an early-warning capacity metric — a spike can predict a future MTTD/MTTR problem before it actually shows up in those numbers, since overwhelmed analysts start missing or delaying triage." },
    { q:"What does an SLO (service-level objective) define in a vulnerability or incident management program?", opts:["A legally binding external contract with a customer","An internal target — like 'critical vulnerabilities remediated within 15 days' — the team holds itself accountable to, distinct from an SLA owed to an external party", "A synonym for a compensating control","A one-time report generated after an incident closes"], correct:1,
      explain:"An SLO is an internal performance target a team sets for itself; an SLA is typically an external, often contractual commitment — related concepts, but SLOs are the internal accountability mechanism metrics get measured against." },
    { q:"Why do vulnerability management reports typically include a 'Top 10' list rather than just the full findings count?", opts:["A Top 10 list replaces the need for any other metric","Surfacing the highest-priority findings gives stakeholders a concrete, actionable starting point instead of an undifferentiated list of hundreds of items", "Top 10 lists are a purely cosmetic reporting convention","Only exactly 10 findings are ever worth remediating"], correct:1,
      explain:"A prioritized short list turns an overwhelming backlog into something a stakeholder can actually act on this week — the same principle behind aging metrics and trend lines: raw counts don't drive action, focused signal does." }
  ],
  archFundamentals: [
    { q:"Why does NTP-based time synchronization matter specifically for log ingestion?", opts:["It compresses log files for storage","Without a common time source, events from different systems can't be reliably correlated into one accurate timeline","NTP encrypts log data in transit","It's only relevant for billing systems, not security"], correct:1,
      explain:"If host clocks drift against each other, correlating multi-system events into a trustworthy timeline breaks down — NTP keeps every source on the same clock." },
    { q:"What is the Windows Registry, from a security-analyst perspective?", opts:["A log file format used only by Linux","A hierarchical database storing OS and application configuration, whose keys are a common target for persistence mechanisms and a common artifact in host investigations","A network routing table","A type of firewall rule set"], correct:1,
      explain:"The Registry stores configuration and startup data — attackers frequently plant Run keys or modify existing keys for persistence, making Registry changes a high-value host-related indicator." },
    { q:"What does 'system hardening' refer to?", opts:["Increasing a system's physical durability","Reducing a system's attack surface by disabling unnecessary services, enforcing secure configurations, and removing default accounts/credentials", "Adding more RAM to improve performance","Encrypting all outbound traffic"], correct:1,
      explain:"Hardening is about shrinking what an attacker can actually reach and abuse — unused services, default creds, and permissive configurations are exactly what hardening removes." },
    { q:"Which best describes the difference between on-premises, cloud, and hybrid network architecture?", opts:["They are marketing terms with no technical distinction","On-premises keeps infrastructure in owned/controlled facilities, cloud runs on a third-party provider's infrastructure, and hybrid combines both — each shifts where security responsibility sits", "Cloud architecture cannot be secured","Hybrid architecture is always less secure than either pure model"], correct:1,
      explain:"The distinction matters because it changes who controls what layer of the stack, and therefore where the analyst's visibility and responsibility boundary falls." },
    { q:"What problem does SASE (Secure Access Secure Edge) address?", opts:["It replaces the need for any authentication","It converges networking and security functions (like SWG, CASB, and ZTNA) into a single cloud-delivered service, rather than routing all traffic through a central on-prem stack", "It is a type of malware sandbox","It only applies to on-premises data centers"], correct:1,
      explain:"SASE pushes security enforcement to the edge, close to the user, rather than backhauling traffic through a central appliance stack — built for a distributed, cloud-first workforce." },
    { q:"What does an SDN (software-defined network) decouple, compared to traditional networking?", opts:["Nothing — SDN is identical to traditional networking","The control plane (routing/policy decisions) from the data plane (traffic forwarding), enabling centralized, programmatic network management","Encryption from authentication","Physical cabling from electricity"], correct:1,
      explain:"SDN centralizes decision-making in software, separate from the hardware that actually forwards packets — enabling automated, policy-driven network changes at scale." },
    { q:"What is the key difference between SSO (single sign-on) and federation?", opts:["They are identical concepts with different names","SSO lets a user authenticate once for multiple applications within one organization's control; federation extends that trust relationship across separate organizations/domains", "Federation is a synonym for MFA","SSO only works for cloud applications"], correct:1,
      explain:"SSO solves 'one login, many apps' inside a single trust boundary; federation extends that same idea across organizational boundaries via a trust relationship between identity providers." },
    { q:"What is the primary purpose of a CASB (cloud access security broker)?", opts:["To replace a firewall entirely","To sit between users and cloud service providers, enforcing visibility and security policy (like DLP) over cloud application usage the organization doesn't directly control", "To manage on-premises Active Directory only","To generate SSL certificates"], correct:1,
      explain:"A CASB gives security teams a policy enforcement and visibility point over cloud app usage — critical once data starts leaving apps IT doesn't directly host." },
    { q:"Why might an organization perform SSL/TLS inspection at the network edge?", opts:["To slow down encrypted traffic on purpose","To decrypt and inspect otherwise-opaque encrypted traffic for threats or data loss, since encryption alone can hide malicious content from security tools","SSL inspection is purely a compliance checkbox with no security value","To generate PKI certificates for internal websites only"], correct:1,
      explain:"Since so much traffic (including malicious traffic) is now encrypted, SSL/TLS inspection lets security tools see what's actually inside the tunnel instead of trusting it blindly." },
    { q:"What distinguishes PII from CHD in a data protection context?", opts:["They are the same category of data under a different name","PII (personally identifiable information) identifies an individual; CHD (cardholder data) is specifically payment card information governed by PCI DSS — both require DLP-style protection but under different regulatory regimes", "PII only applies to healthcare data","CHD has no regulatory requirements attached to it"], correct:1,
      explain:"PII is the broad category of anything that identifies a person; CHD is a narrower, PCI DSS-governed subset specific to payment card data — DLP programs typically classify and protect both, but against different compliance frameworks." }
  ],
  toolsScripting: [
    { q:"What does a WHOIS lookup provide during indicator triage?", opts:["The malware family of a file","Domain/IP registration details (registrant, registrar, creation date) useful for assessing an indicator's legitimacy or age","A live packet capture of the domain's traffic","A CVSS score for the domain"], correct:1,
      explain:"WHOIS surfaces registration metadata — a domain registered days ago with privacy-shielded ownership is a very different signal than one registered a decade ago by a known company." },
    { q:"What is AbuseIPDB used for?", opts:["Scanning for local file inclusion vulnerabilities","Checking an IP address's reported abuse history against a community-sourced reputation database","Decompiling malware binaries","Managing privileged access"], correct:1,
      explain:"AbuseIPDB aggregates community reports of malicious IP activity, giving analysts a quick reputation check during triage." },
    { q:"An analyst runs the 'strings' utility against a suspicious binary. What is the goal?", opts:["To permanently delete the file","To extract readable text sequences embedded in the binary (URLs, file paths, error messages) that can hint at its purpose without executing it", "To calculate its CVSS score","To submit it to a SIEM"], correct:1,
      explain:"Strings pulls out human-readable text from an otherwise opaque binary — often surfacing hardcoded C2 domains, file paths, or commands without needing to run the file." },
    { q:"What does submitting a file hash to VirusTotal accomplish?", opts:["It automatically removes the malware from the network","It checks the file against dozens of antivirus/security engines at once and shows community/vendor detection history for that specific file", "It encrypts the file for safe storage","It performs a live sandbox detonation only"], correct:1,
      explain:"VirusTotal aggregates detections across many AV engines and prior submissions, giving a fast multi-vendor verdict on a specific hash without an analyst needing every engine installed locally." },
    { q:"What do Joe Sandbox and Cuckoo Sandbox have in common?", opts:["They are both packet capture tools","They are both sandboxing platforms that detonate suspicious files in an isolated environment to observe real behavior (file writes, network calls, persistence)", "They are both vulnerability scanners","They are both SIEM platforms"], correct:1,
      explain:"Both are named sandboxing tools built for exactly the dynamic-analysis principle covered earlier — safely observing what a suspicious file actually does." },
    { q:"Why is basic familiarity with JSON and XML valuable for a SOC analyst?", opts:["They are programming languages used to write malware exclusively","Many APIs, logs, and threat intel feeds are structured as JSON or XML, so reading them directly speeds up triage without waiting on a dashboard to render them", "They are obsolete formats no longer used in security tooling","They only matter for web application developers"], correct:1,
      explain:"API responses, structured logs, and machine-readable threat feeds are commonly JSON or XML — being able to read the raw structure directly is faster than always waiting on a UI." },
    { q:"What is a practical SOC use case for regular expressions (regex)?", opts:["Encrypting log files","Pattern-matching specific strings (like an IP format, an email address, or a suspicious command pattern) across large volumes of log data quickly", "Replacing the need for a SIEM","Compiling PowerShell into an executable"], correct:1,
      explain:"Regex lets an analyst define a precise search pattern once and apply it across huge log volumes — a core skill for fast, accurate log triage regardless of which tool wraps it." },
    { q:"What is the primary goal of orchestrating threat intelligence data through 'data enrichment' and 'threat feed combination'?", opts:["To make dashboards more colorful","To automatically correlate and add context to raw indicators from multiple feeds, so analysts see enriched, de-duplicated intelligence instead of raw, disconnected data points", "To replace threat intelligence entirely with automation","To slow down alert triage deliberately"], correct:1,
      explain:"Enrichment and feed combination turn a firehose of disconnected raw indicators into fewer, higher-confidence, context-rich alerts an analyst can actually act on." },
    { q:"What is the benefit of integrating security tools via API, webhooks, and plugins rather than operating each tool standalone?", opts:["It has no practical benefit beyond convenience","It minimizes manual, repetitive human engagement by letting tools automatically pass data and trigger actions between each other, supporting SOAR-style automation", "It eliminates the need for any human analyst permanently","It only matters for billing integration, not security"], correct:1,
      explain:"Tool integration is what makes automation and orchestration actually possible — without APIs/webhooks/plugins tying tools together, every handoff between tools requires a human to do it manually." },
    { q:"What does a 'single pane of glass' aim to solve for a SOC?", opts:["Reducing the number of monitors an analyst needs physically","Consolidating visibility from multiple disparate tools into one unified view, so analysts aren't constantly context-switching between separate consoles", "Encrypting all dashboards","Replacing SIEM with SOAR entirely"], correct:1,
      explain:"A single pane of glass reduces tool-switching overhead by surfacing data from multiple sources in one consolidated interface — directly supporting the efficiency goals behind SOC automation." }
  ],
  vulnTypes: [
    { q:"What is the difference between reflected and persistent (stored) cross-site scripting (XSS)?", opts:["They are identical, just different names for the same attack","Reflected XSS executes immediately from a crafted request/link and isn't stored; persistent XSS is saved server-side (e.g., in a comment field) and executes for every user who later views that content", "Persistent XSS only affects the attacker's own browser","Reflected XSS requires database access, persistent XSS does not"], correct:1,
      explain:"Reflected XSS is a one-shot attack riding on a malicious link; persistent XSS is far more dangerous because the payload is stored and fires automatically for every subsequent visitor." },
    { q:"A crafted input writes past the boundary of its allocated memory buffer, corrupting adjacent memory and potentially allowing code execution. This is a:", opts:["Cross-site request forgery","Buffer overflow","Directory traversal","Broken access control issue"], correct:1,
      explain:"A buffer overflow occurs when input exceeds the space allocated for it and spills into adjacent memory — a classic path to crashes or arbitrary code execution, and the general category under which stack, heap, and integer overflows all fall." },
    { q:"An application accepts user input directly into a SQL query without sanitization, letting an attacker manipulate the query's logic. This is an example of:", opts:["An injection flaw (SQL injection)","A cryptographic failure","Server-side request forgery","Data poisoning"], correct:0,
      explain:"Injection flaws occur when untrusted input is concatenated into a command or query interpreter (SQL, OS commands, LDAP, etc.) without proper handling, letting the attacker alter what gets executed." },
    { q:"A malicious website causes a logged-in victim's browser to unknowingly submit a state-changing request (like a password change) to another site where they're authenticated, without their consent. This is:", opts:["Directory traversal","Cross-site request forgery (CSRF)","Local file inclusion","Privilege escalation"], correct:1,
      explain:"CSRF abuses the fact that a victim's browser automatically attaches their session credentials — the attacker just needs to trick the browser into firing the request, not steal the session itself." },
    { q:"An attacker manipulates a file-path parameter (e.g., changing 'file=report.txt' to 'file=../../../../etc/passwd') to read files outside the intended directory. This is:", opts:["Directory traversal","Cross-site scripting","Server-side request forgery","Cryptographic failure"], correct:0,
      explain:"Directory (path) traversal uses relative path sequences like '../' to escape the intended directory and reach files the application never meant to expose." },
    { q:"A vulnerable application lets an attacker trick the server itself into making an unintended request to an internal-only resource (like a cloud metadata endpoint) on the attacker's behalf. This is:", opts:["Server-side request forgery (SSRF)","Cross-site request forgery","Local file inclusion","Data poisoning"], correct:0,
      explain:"SSRF abuses server-side functionality that fetches a URL, tricking the server into reaching internal resources the attacker couldn't reach directly from outside." },
    { q:"A regular user discovers they can directly access another user's account data simply by changing an ID number in the URL, with no server-side check on whether they're authorized to view it. This is best classified as:", opts:["Broken access control","A cryptographic failure","An overflow vulnerability","End-of-life component risk"], correct:0,
      explain:"Broken access control means the application fails to properly enforce what an authenticated user is actually allowed to do or see — missing authorization checks are the classic root cause." },
    { q:"An attacker exploits a flaw to gain higher permissions than they were originally granted (e.g., a standard user gaining admin rights). This is:", opts:["Privilege escalation","Insecure design","Directory traversal","A compensating control"], correct:0,
      explain:"Privilege escalation is the outcome of exploiting a flaw (a bug, a misconfiguration, a logic error) to move from lower to higher privilege than intended." },
    { q:"An application includes and executes a file from a remote, attacker-controlled URL because a file-path parameter isn't validated. This is best described as:", opts:["Remote file inclusion (RFI)","Cross-site scripting","CSRF","Broken access control"], correct:0,
      explain:"RFI happens when an application dynamically includes a file based on user input and that input can point to an attacker-hosted remote file — its local-only cousin, LFI, does the same thing but restricted to files already on the server." },
    { q:"A vulnerability results directly from using outdated encryption algorithms or improperly implemented cryptography (e.g., storing passwords in plaintext, using a broken hash). This falls under:", opts:["Cryptographic failures","Data poisoning","Insecure design","Server-side request forgery"], correct:0,
      explain:"Cryptographic failures cover weak, misused, or absent cryptography — not just 'no encryption,' but also encryption implemented so poorly it provides false confidence." },
    { q:"A system is left running default credentials, verbose error messages exposing stack traces, and unnecessary services enabled — none of which are a specific coded flaw, but all of which increase risk. This is best categorized as:", opts:["Security misconfiguration","Remote code execution","An overflow vulnerability","Privilege escalation"], correct:0,
      explain:"Security misconfiguration covers insecure default settings, unnecessary features left enabled, and overly revealing error output — a deployment/configuration issue rather than a coding bug." },
    { q:"An organization continues running a server operating system that no longer receives security patches from the vendor. What category of risk does this represent?", opts:["End-of-life (EOL) / outdated components","Broken access control","CSRF","Data poisoning"], correct:0,
      explain:"EOL/outdated components stop receiving fixes for newly discovered vulnerabilities, so every future flaw in that component becomes permanent and unpatchable until it's replaced." },
    { q:"A login system fails to lock out accounts after repeated failed attempts and accepts weak, easily-guessed passwords with no additional verification. This falls under which vulnerability category?", opts:["Identification and authentication failures","Insecure design","Directory traversal","Data poisoning"], correct:0,
      explain:"Identification and authentication failures cover weaknesses in how an application verifies who a user is — missing lockouts, weak password policy, and broken session handling all fall here." },
    { q:"An attacker successfully exploits a chain of flaws to run arbitrary commands of their choosing on a target server. What is this outcome called?", opts:["Remote code execution (RCE)","A false positive","A compensating control","Attack surface reduction"], correct:0,
      explain:"RCE is often the worst-case outcome of other vulnerability classes (injection, deserialization, overflow) chained together — full arbitrary command execution on the target." },
    { q:"An attacker feeds deliberately corrupted or malicious data into a system's training set or trusted input feed (such as a machine learning model or a shared threat intel feed) to manipulate its future output. This is:", opts:["Data poisoning","Cross-site scripting","Directory traversal","A compensating control"], correct:0,
      explain:"Data poisoning corrupts the data a system learns from or trusts, so its future decisions or outputs are quietly skewed in the attacker's favor." },
    { q:"A system is architected from the ground up without considering threat scenarios — for example, an application that trusts client-side validation alone with no server-side enforcement. This root-cause category is called:", opts:["Insecure design","End-of-life components","A cryptographic failure","Attack surface reduction"], correct:0,
      explain:"Insecure design is a fundamental architecture/planning gap — no amount of clean coding fixes a system that was never designed with the relevant threat model in mind; it has to be designed in, not patched in." }
  ],
  vulnTools: [
    { q:"Which named tool is a general-purpose vulnerability scanner most directly comparable to OpenVAS?", opts:["Nessus","Maltego","GDB","Recon-ng"], correct:0,
      explain:"Nessus and OpenVAS are the two named general-purpose vulnerability scanners called out specifically in the CS0-003 objectives." },
    { q:"Which tools are purpose-built web application scanners?", opts:["Burp Suite and Zed Attack Proxy (ZAP)","Nmap and Metasploit","Scout Suite and Pacu","Immunity Debugger and GDB"], correct:0,
      explain:"Burp Suite and ZAP (along with Arachni and Nikto) are built specifically to probe web applications for flaws like injection and XSS — distinct from general network scanners." },
    { q:"An analyst needs to assess an AWS account's IAM policies and storage bucket exposure for misconfigurations. Which category of tool fits?", opts:["Cloud infrastructure assessment tools (e.g., Scout Suite, Prowler, Pacu)","Web application scanners","Debuggers","Packet capture tools"], correct:0,
      explain:"Scout Suite, Prowler, and Pacu are named cloud infrastructure assessment tools built specifically to evaluate cloud account configuration and posture." },
    { q:"What is the primary use case for Immunity Debugger or GDB (GNU Debugger)?", opts:["Sending phishing simulation emails","Stepping through a program's execution at a low level — how overflow and memory-corruption vulnerabilities actually get discovered and understood","Scanning cloud storage for public buckets","Managing patch maintenance windows"], correct:1,
      explain:"Debuggers let an analyst step through code execution instruction by instruction — essential for understanding exactly how a memory-corruption vulnerability behaves." },
    { q:"What is the key difference between static and dynamic analysis?", opts:["Static analysis examines code/a binary without executing it; dynamic analysis observes behavior during actual execution", "They are two names for the exact same technique","Static analysis only applies to network traffic","Dynamic analysis never involves running any code"], correct:0,
      explain:"Static analysis reads code or a binary at rest; dynamic analysis runs it and watches what actually happens — reverse engineering and fuzzing are both dynamic techniques." },
    { q:"Why does fuzzing a target application help uncover overflow vulnerabilities specifically?", opts:["Fuzzing only tests for weak passwords","Bombarding an application with malformed and random input is exactly the kind of unexpected data that triggers boundary-handling bugs like overflows to surface as crashes", "Fuzzing exclusively targets cloud storage configuration","Fuzzing replaces the need for a vulnerability scanner entirely"], correct:1,
      explain:"Overflow bugs are fundamentally about mishandled unexpected input — fuzzing's whole premise is throwing exactly that kind of input at a target until something breaks in a revealing way." },
    { q:"Why is active scanning particularly risky against OT/ICS/SCADA environments?", opts:["These systems run physical-world equipment and are often fragile legacy technology that active scan traffic can crash or disrupt, unlike typical IT scanning", "OT/ICS/SCADA systems cannot be scanned under any method","Active scanning is always safe regardless of target","SCADA systems are immune to network-based interaction"], correct:0,
      explain:"Operational technology often runs on legacy, fragile systems controlling physical processes — a crash isn't just downtime, it can be a safety incident, which is why passive-only approaches are often preferred there." },
    { q:"What does 'security baseline scanning' check, that a standard vulnerability scan does not?", opts:["A system's actual configuration against a published standard (like CIS benchmarks), rather than just checking for known CVEs", "It only checks for expired SSL certificates","It exclusively scans for phishing emails","It replaces the need for any other scan type"], correct:0,
      explain:"Baseline scanning compares configuration against a standard like CIS benchmarks or PCI DSS — catching insecure settings that a CVE-focused scan would never flag, since they aren't a 'vulnerability' in the traditional sense." }
  ],
  vulnControlsAdvanced: [
    { q:"A SIEM alert firing when suspicious activity occurs is an example of which control function?", opts:["Preventative","Detective","Corrective","Managerial"], correct:1,
      explain:"Detective controls notice that something happened — a SIEM alert doesn't stop the activity, it surfaces it for investigation, which is the defining trait of a detective control." },
    { q:"A written acceptable-use policy requiring manager sign-off before provisioning admin access is an example of which control category?", opts:["Technical","Operational","Managerial","Corrective"], correct:2,
      explain:"Managerial controls are policy- and risk-decision-based — a written policy and approval requirement is a governance mechanism, not something enforced directly by technology or day-to-day process." },
    { q:"Restoring a compromised system from a known-good backup after an incident is an example of which control function?", opts:["Preventative","Detective","Corrective","Responsive"], correct:2,
      explain:"Corrective controls repair or restore after impact has already occurred — restoring from backup fixes the damage rather than preventing or merely detecting it." },
    { q:"Why does every patch deployment need a documented rollback plan?", opts:["Rollback plans are only a compliance formality with no real use","If validation reveals the patch broke something worse than the vulnerability it fixed, the team needs a tested way to revert quickly", "Patches never fail once tested, so rollback is theoretical only","Rollback plans replace the need for a maintenance window"], correct:1,
      explain:"Testing reduces risk but doesn't eliminate it — a rollback plan is the safety net for the cases where a patch causes an unexpected production issue after deployment." },
    { q:"What distinguishes adversary emulation from generic penetration testing?", opts:["Adversary emulation specifically mimics the actual TTPs of a known threat actor, rather than testing generically for any exploitable weakness", "Adversary emulation never involves any actual testing activity","Generic pentesting is illegal while adversary emulation is not","They are identical activities with different names"], correct:0,
      explain:"Adversary emulation deliberately recreates a specific real-world threat actor's playbook, testing whether defenses hold up against that actual pattern of behavior — not just 'any' vulnerability." },
    { q:"What is the direct secure-coding countermeasure for SQL injection specifically?", opts:["Output encoding","Parameterized queries — user input is passed as data, never concatenated directly into the query itself", "Session management","Attack surface reduction"], correct:1,
      explain:"Parameterized queries keep user input strictly separated from query logic at the database driver level, which is what actually closes the injection vector — not just filtering or escaping input." },
    { q:"Why is threat modeling performed early in the SDLC rather than after development is complete?", opts:["It's cheaper and far more effective to catch insecure design decisions at the whiteboard stage than to redesign a shipped, deployed application", "Threat modeling can only be performed after a product ships","Threat modeling is purely a documentation exercise with no design impact","Timing in the SDLC makes no practical difference"], correct:0,
      explain:"Insecure design is an architecture-level problem — the earlier a threat model surfaces a bad assumption, the cheaper it is to fix, since redesigning shipped software costs far more than redesigning a diagram." },
    { q:"An organization runs a program paying external researchers to find and responsibly report vulnerabilities in its products. This is:", opts:["A bug bounty program","Attack surface reduction","Edge discovery","Security baseline scanning"], correct:0,
      explain:"Bug bounty programs crowdsource vulnerability discovery to external researchers, incentivized by payment for valid, responsibly-disclosed findings." }
  ]
};
