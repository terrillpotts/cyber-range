  title:"SOC Toolkit: Named Tools, Scripting &amp; Automation",
  html:
    "<p>The earlier toolkit lesson covered tool <i>categories</i> (SIEM, EDR, sandboxing). CS0-003 also expects you to recognize specific named tools and the scripting/automation skills that tie them together — this lesson fills that in.</p>" +
    "<h3>Named tools by function</h3>" +
    "<ul><li><b>DNS/IP reputation</b> — <b>WHOIS</b> (domain/IP registration details) and <b>AbuseIPDB</b> (community-sourced IP abuse reports).</li>" +
    "<li><b>File analysis</b> — <b>Strings</b> (extracts readable text from a binary without executing it) and <b>VirusTotal</b> (checks a file hash against dozens of AV engines and prior detections at once).</li>" +
    "<li><b>Sandboxing</b> — <b>Joe Sandbox</b> and <b>Cuckoo Sandbox</b>, both named dynamic-analysis platforms that detonate suspicious files in isolation.</li></ul>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>You don't need to be an expert operator of every tool here — the exam tests recognition: given a scenario, which named tool fits the task.</p></div>" +
    "<h3>Scripting and structured data</h3>" +
    "<p>You don't need to be a software engineer, but fluency with a few formats and languages compounds fast: <b>JSON</b> and <b>XML</b> are the structured formats most APIs, logs, and threat feeds use — reading them directly beats waiting on a dashboard to render. <b>Python</b>, <b>PowerShell</b>, and <b>shell script</b> let you automate repetitive pulls and log parsing instead of doing it by hand every time. <b>Regular expressions (regex)</b> let you define a precise search pattern once and apply it across huge log volumes — a skill that pays off regardless of which specific tool wraps it.</p>" +
    "<h3>Automation and orchestration (efficiency at the process level)</h3>" +
    "<p>Not every task is worth automating — the right candidates are <i>repeatable</i> and <i>don't require human judgment</i> to execute. Once identified, <b>SOAR</b> platforms orchestrate the actual playbook execution, and <b>threat intelligence orchestration</b> — data enrichment plus combining multiple feeds — turns disconnected raw indicators into fewer, higher-confidence alerts worth an analyst's attention.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Identify repeatable task</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Integrate via API/webhook/plugin</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Orchestrate (SOAR)</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Single pane of glass</div>" +
    "</div>" +
    "<p>Tool integration — via <b>API</b>, <b>webhooks</b>, and <b>plugins</b> — is what makes that automation possible in the first place; without it, every handoff between tools needs a human. The end goal many SOCs aim for is a <b>single pane of glass</b>: consolidated visibility across tools instead of constant context-switching between separate consoles.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Efficiency work isn't about replacing analysts — it's about routing human judgment to the decisions that actually need it, and letting automation handle everything that's purely repetitive.</p></div>"
},
vulnTypes: {
  title:"Web Application &amp; Software Vulnerability Types",
  html:
    "<p>Everything covered in Vulnerability Management so far is about <i>process</i> — scanning, scoring, prioritizing, remediating. This lesson is about the actual vulnerability <i>categories</i> a scan or a pentest turns up, so a finding's name means something the moment you read it.</p>" +
    "<h3>Injection and query manipulation</h3>" +
    "<p><b>Injection flaws</b> happen when untrusted input gets concatenated directly into a command or query interpreter — SQL injection is the classic example, where attacker input alters a database query's logic to read, modify, or destroy data it was never meant to touch. The fix (parameterized queries) is covered in the next lesson.</p>" +
    "<h3>Cross-site scripting (XSS)</h3>" +
    "<p><b>Reflected XSS</b> rides on a single crafted link or request — the payload executes once and isn't stored anywhere. <b>Persistent (stored) XSS</b> is far more dangerous: the payload is saved server-side (a comment field, a profile bio) and fires automatically for every user who later views that content.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Reflected XSS<br><span style='color:var(--text-faint)'>one-shot, via a link</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Persistent XSS<br><span style='color:var(--text-faint)'>stored, fires for every viewer</span></div>" +
    "</div>" +
    "<h3>Request forgery: CSRF vs. SSRF</h3>" +
    "<p>These sound similar but attack different victims. <b>CSRF</b> (cross-site request forgery) tricks a logged-in <i>user's browser</i> into firing a state-changing request the user never intended, riding on their existing session. <b>SSRF</b> (server-side request forgery) tricks the <i>server itself</i> into making an unintended request — often reaching internal-only resources (like a cloud metadata endpoint) the attacker could never reach directly from outside.</p>" +
    "<h3>Path and file abuse: directory traversal, LFI/RFI</h3>" +
    "<p><b>Directory traversal</b> uses relative-path sequences (<code>../../../</code>) to escape an application's intended directory and read files it was never meant to expose. When an application dynamically <i>includes and executes</i> a file based on unvalidated input, that's <b>LFI</b> (local file inclusion) if it's restricted to files already on the server, or <b>RFI</b> (remote file inclusion) if the attacker can point it at a file they host remotely.</p>" +
    "<h3>Memory corruption: overflow vulnerabilities</h3>" +
    "<p>A <b>buffer overflow</b> happens when input exceeds the memory space allocated for it and spills into adjacent memory — potentially corrupting data or hijacking program execution. The same root idea shows up in more specific forms: <b>stack</b> and <b>heap</b> overflows (named for which memory region gets corrupted) and <b>integer overflows</b> (a numeric value exceeds what its data type can hold and wraps around unexpectedly, sometimes bypassing a size check entirely).</p>" +
    "<h3>Access, authentication, and identity failures</h3>" +
    "<p><b>Broken access control</b> means the application fails to properly enforce what an authenticated user is actually allowed to see or do — often as simple as changing an ID in a URL with no server-side authorization check. <b>Identification and authentication failures</b> cover weaknesses in verifying identity itself: missing account lockouts, weak password policy, broken session handling. Successfully exploiting either can lead to <b>privilege escalation</b> — ending up with more access than intended.</p>" +
    "<h3>Design, configuration, and lifecycle risk</h3>" +
    "<p><b>Insecure design</b> is a root-cause category, not a coding bug — a system architected without the relevant threat model in mind (like trusting client-side validation alone) can't be patched into secure; it has to be redesigned. <b>Security misconfiguration</b> covers default credentials, unnecessary enabled services, and overly verbose error output — a deployment issue, not a code flaw. <b>End-of-life (EOL) / outdated components</b> stop receiving vendor patches, so every future flaw discovered in them stays open permanently until replaced.</p>" +
    "<h3>Cryptographic failures and data poisoning</h3>" +
    "<p><b>Cryptographic failures</b> cover weak, misused, or absent cryptography — plaintext password storage, broken hashing algorithms, or encryption implemented so poorly it provides false confidence. <b>Data poisoning</b> is a newer, distinct category: an attacker feeds corrupted or malicious data into a system's training set or trusted input feed (a machine learning model, a shared threat intel feed) to quietly skew its future output.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p><b>Remote code execution (RCE)</b> is often the worst-case outcome several of these categories can chain into — an injection flaw or overflow that ultimately lets an attacker run arbitrary commands of their choosing on the target. The lab that follows has you sort real findings into these categories — the next lesson covers the specific controls that stop each one.</p></div>"
},
vulnTools: {
  title:"Vulnerability Scanning Tools &amp; Industry Frameworks",
  html:
    "<p>CS0-003 expects you to recognize specific named tools by category, not just the general concepts. This lesson is a reference pass through the tools and frameworks most likely to show up by name.</p>" +
    "<h3>Asset discovery and reconnaissance</h3>" +
    "<p>Before scanning, you need to know what's actually there: <b>map scans</b> sweep a network range to find live hosts, and <b>device fingerprinting</b> identifies what a discovered host actually is (OS, open services) from its network behavior. <b>Angry IP Scanner</b> and <b>Maltego</b> (link-analysis/OSINT mapping) are named tools in this space; <b>Nmap</b> and <b>Recon-ng</b> are multipurpose tools that do reconnaissance and scanning both.</p>" +
    "<h3>Web application scanners</h3>" +
    "<p><b>Burp Suite</b>, <b>Zed Attack Proxy (ZAP)</b>, <b>Arachni</b>, and <b>Nikto</b> are all built specifically to probe web applications for the vulnerability classes covered in the previous lesson — injection, XSS, misconfig, and more.</p>" +
    "<h3>Vulnerability scanners and multipurpose frameworks</h3>" +
    "<p><b>Nessus</b> and <b>OpenVAS</b> are the named general-purpose vulnerability scanners you'll see referenced directly. <b>Metasploit Framework (MSF)</b> goes further than scanning into actual exploitation and validation of findings. <b>Immunity Debugger</b> and <b>GDB</b> (GNU Debugger) are used for lower-level analysis — stepping through a program's execution, which is how overflow and memory-corruption vulnerabilities actually get discovered and understood.</p>" +
    "<h3>Cloud infrastructure assessment</h3>" +
    "<p>Cloud environments need their own tooling: <b>Scout Suite</b>, <b>Prowler</b>, and <b>Pacu</b> are named tools built specifically to assess cloud account configuration and posture (IAM policy, storage exposure, and the kind of misconfigurations covered in the cloud vulnerability lesson).</p>" +
    "<h3>Static vs. dynamic analysis</h3>" +
    "<p><b>Static</b> analysis examines code or a binary without running it; <b>dynamic</b> analysis observes behavior during actual execution. Two dynamic techniques worth knowing by name: <b>reverse engineering</b> (working backward from a compiled binary to understand its logic) and <b>fuzzing</b> (bombarding an application with malformed/random input to surface crashes and unexpected behavior — often exactly how overflow bugs get found).</p>" +
    "<h3>Critical infrastructure scanning</h3>" +
    "<p><b>OT</b> (operational technology), <b>ICS</b> (industrial control systems), and <b>SCADA</b> (supervisory control and data acquisition) environments run physical-world equipment that active scanning can knock offline — this is exactly why the earlier lesson on passive vs. active scanning matters most here.</p>" +
    "<h3>Industry frameworks and baselines</h3>" +
    "<p>Scanning isn't just ad hoc — mature programs anchor to published standards: <b>PCI DSS</b> (payment card data security), <b>CIS benchmarks</b> (vendor-neutral secure-configuration baselines), <b>OWASP</b> (web application security guidance), and the <b>ISO 27000 series</b> (international information security management standards). <b>Security baseline scanning</b> checks a system's actual configuration against one of these standards, rather than just looking for known CVEs.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>You won't be asked to operate every tool listed here — the exam tests recognition: given a scenario (\"assess this AWS account's IAM posture\"), which named tool category fits.</p></div>"
},
vulnControlsAdvanced: {
  title:"Controls, Attack Surface Management &amp; Secure SDLC",
  html:
    "<p>Knowing a vulnerability exists is only half the job. This lesson covers the control taxonomy, attack-surface discipline, and secure-development practices CS0-003 expects for actually managing that risk.</p>" +
    "<h3>The control-type taxonomy</h3>" +
    "<p>Controls get classified along two independent axes. By <b>category</b>: <b>managerial</b> (policy/risk decisions), <b>operational</b> (people/process, like training or physical security), and <b>technical</b> (enforced by technology). By <b>function</b>: <b>preventative</b> (stops it before it happens), <b>detective</b> (notices it happened), <b>responsive</b> (acts once detected), and <b>corrective</b> (fixes/restores after impact). A firewall rule is a technical/preventative control; a SIEM alert is technical/detective; an incident response playbook execution is operational/responsive.</p>" +
    "<h3>Patching and configuration management lifecycle</h3>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Testing</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Implementation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Validation</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Rollback<br><span style='color:var(--text-faint)'>if validation fails</span></div>" +
    "</div>" +
    "<p>Patches deploy inside scheduled <b>maintenance windows</b> to limit business disruption, and every patch needs a <b>rollback</b> plan in case it breaks something worse than the vulnerability it fixed.</p>" +
    "<h3>Attack surface management</h3>" +
    "<p>You can't defend what you don't know is exposed. <b>Edge discovery</b> and <b>passive discovery</b> map what's actually reachable from outside without necessarily touching it directly. <b>Security controls testing</b>, <b>penetration testing</b>, and <b>adversary emulation</b> actively validate whether existing defenses hold up under a real attempt — adversary emulation specifically mimics a known threat actor's actual TTPs rather than generic testing. A <b>bug bounty</b> program crowdsources that same validation to external researchers. The end goal across all of it is <b>attack surface reduction</b> — actually shrinking what's exposed, not just cataloging it.</p>" +
    "<h3>Secure coding best practices</h3>" +
    "<p>These are the direct countermeasures to the vulnerability types from the previous lesson: <b>input validation</b> (reject malformed/unexpected input before it's processed — the core defense against injection and overflow), <b>output encoding</b> (neutralizes XSS by ensuring output is rendered as data, not executable code), <b>session management</b> (properly issued, expired, and protected session tokens), <b>authentication</b> controls (lockouts, MFA, strong password policy), <b>data protection</b> (encryption at rest/in transit), and <b>parameterized queries</b> (the direct fix for SQL injection — user input is passed as data, never concatenated into the query itself).</p>" +
    "<h3>SDLC and threat modeling</h3>" +
    "<p>A <b>secure SDLC (software development life cycle)</b> builds security review into every phase of development, not as a bolt-on before release. <b>Threat modeling</b> is done early in that cycle — systematically asking \"what could go wrong here, and who would want to make it go wrong\" before a single line of code is written, so insecure design gets caught at the whiteboard instead of in production.</p>" +
    "<div class='callout'><span class='uc'>Analyst note</span><p>Notice the throughline: attack surface management finds what's exposed, secure coding prevents new flaws from being introduced, and SDLC/threat modeling catch design-level risk before it ever ships. Three different points in the same lifecycle.</p></div>"
},
cloudComputing: {
  title:"Cloud Computing Fundamentals &amp; the Shared Responsibility Model",
  html:
    "<p>Every AZ-900 topic that follows — every service, every diagram, every acronym — sits on top of a small set of ideas about what \"the cloud\" actually is and who is responsible for what inside it. Get this lesson solid and the rest of the exam is mostly vocabulary.</p>" +
    "<h3>What cloud computing actually means</h3>" +
    "<p>Cloud computing is the delivery of computing services — compute, storage, databases, networking, analytics, software — over the internet, from a provider that owns and operates the underlying hardware. Instead of buying, racking, and maintaining physical servers, an organization rents capacity from a provider like Microsoft, typically billed by usage rather than a fixed upfront cost.</p>" +
    "<h3>The shared responsibility model</h3>" +
    "<p>Moving to the cloud does not mean security and operations become \"someone else's problem.\" The shared responsibility model draws a line between what Microsoft manages and what the customer manages — and that line moves depending on which service type you use (covered in depth in the Service Types lesson later in this domain).</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>On-premises<br><span style='color:var(--text-faint)'>you manage everything</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>IaaS<br><span style='color:var(--text-faint)'>provider: hardware, host</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>PaaS<br><span style='color:var(--text-faint)'>+ OS, runtime</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>SaaS<br><span style='color:var(--text-faint)'>provider manages nearly all of it</span></div>" +
    "</div>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>One line never moves, no matter the service type: <b>data, devices, accounts, and identities are always the customer's responsibility.</b> Microsoft can secure the datacenter and patch the hypervisor, but it cannot decide who on your team is allowed to see a given file.</p></div>" +
    "<h3>Deployment models: public, private, and hybrid</h3>" +
    "<p><b>Public cloud</b> — resources are owned and operated by the provider and shared (multi-tenant) across customers over the internet; no hardware to maintain, consumption-based pricing, fastest to provision. <b>Private cloud</b> — dedicated, single-tenant infrastructure, often on-premises or hosted, used when regulatory, data-residency, or legacy-system requirements rule out multi-tenancy. <b>Hybrid cloud</b> — a deliberate mix of both, connecting on-premises systems with public cloud resources so workloads can move between them (e.g., bursting extra capacity into the cloud during a demand spike while core systems stay on-premises).</p>" +
    "<h3>Consumption-based pricing: CapEx vs. OpEx</h3>" +
    "<p>Traditional infrastructure is <b>capital expenditure (CapEx)</b> — a large upfront purchase of hardware that then depreciates over years, whether you fully use it or not. Cloud consumption-based pricing shifts that to <b>operating expenditure (OpEx)</b> — you pay only for what you actually use, when you use it, with no large upfront purchase. This is also why Azure offers multiple pricing models: pay-as-you-go for flexibility, and Reservations or Savings Plans that trade a usage commitment for a lower rate — covered in depth in the Cost Management lesson later in this platform.</p>" +
    "<h3>Serverless</h3>" +
    "<p>\"Serverless\" doesn't mean there are no servers — it means the customer never has to think about them. The provider handles provisioning, patching, and automatically scaling the underlying compute, and billing is typically per-execution rather than per reserved capacity. Azure Functions is the canonical example: you deploy a small piece of code that runs in response to a trigger (an HTTP request, a file upload, a timer) and pay only for the time it actually executes.</p>"
},
cloudBenefits: {
  title:"The Benefits of Cloud Services",
  html:
    "<p>Why do organizations actually move to the cloud? AZ-900 groups the answer into four benefit categories — high availability &amp; scalability, reliability &amp; predictability, security &amp; governance, and manageability. Each one maps to a specific set of Azure capabilities you'll meet by name later in this platform.</p>" +
    "<h3>High availability and scalability</h3>" +
    "<p><b>High availability</b> means an application stays up and reachable even when individual components fail — achieved through redundancy, load balancing, and spreading resources across failure domains (availability zones, region pairs). <b>Scalability</b> is the ability to add or remove capacity to match demand, and it comes in two flavors:</p>" +
    "<ul><li><b>Scaling up (vertical)</b> — make an existing resource bigger: more CPU, more RAM, a larger VM size.</li>" +
    "<li><b>Scaling out (horizontal)</b> — add more instances of a resource to share the load, and remove them again when demand drops.</li></ul>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Scaling out is generally preferred in the cloud for handling variable demand, because it can happen automatically (autoscale) without any downtime — scaling up a single VM usually requires resizing or a reboot.</p></div>" +
    "<h3>Reliability and predictability</h3>" +
    "<p><b>Reliability</b> is a system's ability to recover from failures and keep functioning — backed by redundancy options (covered in the Storage lesson) and disaster recovery planning. <b>Predictability</b> has two sides: <i>performance predictability</i> (an application behaves consistently under load, backed by a published Service Level Agreement — SLA) and <i>cost predictability</i> (you can forecast spend from usage patterns, budgets, and alerts, rather than being surprised by a bill).</p>" +
    "<h3>Security and governance</h3>" +
    "<p>The cloud provider invests in physical and platform-level security (datacenter access control, DDoS protection, encryption capabilities) at a scale almost no individual organization could match on its own. Governance tools — Azure Policy, RBAC, resource locks, Microsoft Purview — let an organization enforce its own rules on top of that foundation. Both are covered in full in the Identity, Access &amp; Security lesson and the Management &amp; Governance domain.</p>" +
    "<h3>Manageability</h3>" +
    "<p>Cloud platforms centralize configuration, monitoring, and automation into tools like the Azure portal, CLI, PowerShell, and Resource Manager templates. Provisioning that used to take weeks of procurement and physical racking can happen in minutes, and the same centralized tooling makes it possible to monitor, patch, and scale hundreds of resources without touching each one by hand.</p>"
},
serviceTypes: {
  title:"Cloud Service Types: IaaS, PaaS &amp; SaaS",
  html:
    "<p>The shared responsibility line from the first lesson in this domain moves depending on which of these three service types you use. Recognizing which one a scenario describes — and knowing who manages what in each — is one of the most heavily tested ideas on the exam.</p>" +
    "<h3>Infrastructure as a Service (IaaS)</h3>" +
    "<p>The provider supplies the raw building blocks — virtual machines, storage, networking — and manages the physical hardware, virtualization layer, and datacenter. The customer manages everything from the OS upward: patching, installed software, configuration, and the application itself. IaaS most closely resembles running your own on-premises servers, just without owning the hardware. It offers the most control and the most management responsibility of the three.</p>" +
    "<h3>Platform as a Service (PaaS)</h3>" +
    "<p>The provider adds management of the OS, runtime, and middleware on top of IaaS. The customer deploys and manages only the application and its data. Azure App Service (web apps) and Azure SQL Database are classic PaaS examples — a developer pushes code or data, and Microsoft handles patching the OS, scaling the runtime, and keeping the database engine available.</p>" +
    "<h3>Software as a Service (SaaS)</h3>" +
    "<p>The provider manages essentially the entire stack, delivering a complete, ready-to-use application over the internet. The customer just uses it — configuring settings and managing their own data and users, nothing more. Microsoft 365 (Outlook, Teams, Word) is the textbook SaaS example.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>IaaS<br><span style='color:var(--text-faint)'>most customer control</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>PaaS<br><span style='color:var(--text-faint)'>balance of both</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>SaaS<br><span style='color:var(--text-faint)'>most provider-managed</span></div>" +
    "</div>" +
    "<h3>Matching use cases to the right model</h3>" +
    "<ul><li>Need to run legacy, custom, or unusual software with full OS control? &#8594; <b>IaaS</b></li>" +
    "<li>Building a web app and don't want to manage servers or patching? &#8594; <b>PaaS</b></li>" +
    "<li>Just need email and office productivity tools, no development involved? &#8594; <b>SaaS</b></li></ul>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Exam scenarios rarely say \"this is PaaS\" outright — they describe a need (\"the team doesn't want to manage the OS or patch anything, just deploy code\") and expect you to recognize which model that maps to. Practice reading for the responsibility split, not the product name.</p></div>"
},
coreArch: {
  title:"Core Architectural Components of Azure",
  html:
    "<p>Before touching a single service, you need Azure's basic vocabulary for <i>where</i> things live physically and <i>how</i> they're organized administratively. This lesson covers both halves.</p>" +
    "<h3>Physical geography: regions, region pairs &amp; datacenters</h3>" +
    "<p>A <b>region</b> is a geographic area containing a set of Microsoft-operated <b>datacenters</b>, connected by a dedicated low-latency network — it's the basic unit you pick when deploying a resource (e.g., \"East US\" or \"West Europe\"). Most regions are organized into <b>region pairs</b> — two regions in the same broader geography, typically 300+ miles apart, that Microsoft pairs deliberately: platform updates are rolled out to one region in a pair at a time, and in a rare broad outage, recovery of at least one region in the pair is prioritized. Services like geo-redundant storage replicate specifically between paired regions.</p>" +
    "<p><b>Sovereign (national) clouds</b>, like Azure Government, are physically and logically separate instances of Azure operated to meet specific regulatory, compliance, or national-security requirements — distinct from simply picking a region within standard public Azure.</p>" +
    "<h3>Availability zones</h3>" +
    "<p>An <b>availability zone</b> is a physically separate location within a region — its own building, with independent power, cooling, and networking. Deploying resources across multiple availability zones protects against a single datacenter-level failure inside a region, which is a smaller-blast-radius concern than the regional disaster that region pairs address.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Availability zone<br><span style='color:var(--text-faint)'>protects vs. datacenter failure</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Region<br><span style='color:var(--text-faint)'>set of datacenters</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Region pair<br><span style='color:var(--text-faint)'>protects vs. regional disaster</span></div>" +
    "</div>" +
    "<h3>Organizational hierarchy: management groups, subscriptions &amp; resource groups</h3>" +
    "<p>Every resource in Azure sits inside this hierarchy, broadest to narrowest:</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Management group</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Subscription</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Resource group</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Resource</div>" +
    "</div>" +
    "<ul><li><b>Management groups</b> — sit above subscriptions, letting an enterprise apply governance (policy, RBAC) across many subscriptions at once, e.g., all subscriptions belonging to one business unit.</li>" +
    "<li><b>Subscriptions</b> — the billing and access-management boundary; each subscription is tied to an Azure account and has its own usage limits and quotas.</li>" +
    "<li><b>Resource groups</b> — logical containers for related resources within a subscription (e.g., every resource for one application), managed, permissioned, and deleted together as a unit.</li>" +
    "<li><b>Resources</b> — the actual deployed services: a VM, a storage account, a database.</li></ul>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Governance settings (like Azure Policy) applied at a higher level in this hierarchy automatically flow down to everything beneath it — a policy on a management group applies to every subscription, resource group, and resource inside it, unless explicitly overridden lower down.</p></div>"
},
computeNetworking: {
  title:"Azure Compute &amp; Networking Services",
  html:
    "<p>Compute is where your workload actually runs; networking is how it talks to everything else. This lesson covers both, since AZ-900 groups them into one skill area.</p>" +
    "<h3>Compute types</h3>" +
    "<p><b>Virtual machines</b> virtualize an entire OS instance on top of shared hardware — most flexible, most management overhead. <b>Containers</b> package an application with its dependencies and share the host OS kernel, making them far lighter weight and faster to start than a VM — ideal for microservices and portable, consistent deployments. <b>Functions</b> (serverless) run small pieces of event-triggered code with no server management at all, billed per execution.</p>" +
    "<h3>Virtual machine options</h3>" +
    "<ul><li><b>Azure Virtual Machines</b> — a single, standalone VM.</li>" +
    "<li><b>Virtual Machine Scale Sets</b> — automatically deploy and manage a group of identical, load-balanced VMs that scale out or in based on demand.</li>" +
    "<li><b>Availability sets</b> — spread a group of VMs across multiple <i>fault domains</i> (separate racks/power/network hardware) and <i>update domains</i> (separate host-patching groups) within one datacenter, so a single hardware failure or maintenance event doesn't take every instance down at once.</li>" +
    "<li><b>Azure Virtual Desktop</b> — delivers a full virtualized Windows desktop and application experience to end users from the cloud, rather than running a workload of your own.</li></ul>" +
    "<p>Any VM needs a few core resources: a virtual hard disk (OS + data disks), a virtual network interface, and typically a public or private IP address plus a network security group controlling traffic to it.</p>" +
    "<h3>Application hosting options</h3>" +
    "<p>Three common ways to host an application, trading control for management overhead: <b>Azure App Service (Web Apps)</b> is managed PaaS — deploy code, Microsoft handles the OS and runtime. <b>Containers</b> (via Azure Container Instances, Azure Kubernetes Service, or App Service's container support) offer more portability and runtime control than a plain Web App. <b>Virtual machines</b> offer the most control of all three, at the cost of managing everything yourself.</p>" +
    "<h3>Virtual networking</h3>" +
    "<p>An <b>Azure virtual network (VNet)</b> is an isolated, private network in Azure — the foundation for private communication between resources. <b>Subnets</b> divide a VNet into smaller segments for organization and security boundaries. <b>VNet peering</b> connects two or more VNets so resources in each can talk directly over private IPs, without crossing the public internet. <b>Azure DNS</b> hosts DNS domains and resolves names to IPs within Azure.</p>" +
    "<p>To connect back to an on-premises network, Azure offers two options with a real tradeoff: <b>VPN Gateway</b> creates an encrypted tunnel over the public internet — cheaper, simpler, but subject to internet variability. <b>ExpressRoute</b> establishes a private, dedicated connection through a connectivity provider that never touches the public internet — more consistent latency and throughput, at higher cost and setup complexity.</p>" +
    "<h3>Public vs. private endpoints</h3>" +
    "<p>A <b>public endpoint</b> exposes a service over the internet via a public IP or DNS name. A <b>private endpoint</b> gives the service a private IP address inside your own VNet instead, so traffic never traverses the public internet at all — a meaningfully stronger network security posture for resources like storage accounts or databases that don't need to be internet-facing.</p>"
},
storageServices: {
  title:"Azure Storage Services",
  html:
    "<p>Compute needs somewhere to keep data. This lesson covers what Azure Storage offers, how to control its cost and durability, and how to actually get data into it.</p>" +
    "<h3>Comparing Azure Storage services</h3>" +
    "<ul><li><b>Blob Storage</b> — object storage for unstructured data (images, video, backups, log files), accessed over REST/HTTP. The workhorse for most general-purpose cloud storage needs.</li>" +
    "<li><b>Azure Files</b> — fully managed file shares accessible over SMB (and NFS), so multiple clients can mount the same share concurrently — a direct cloud replacement for an on-premises file server.</li>" +
    "<li><b>Queue Storage</b> — a simple messaging queue for communicating between application components asynchronously.</li>" +
    "<li><b>Disk Storage</b> — persistent, durable disks attached to virtual machines (OS and data disks).</li></ul>" +
    "<h3>Storage tiers</h3>" +
    "<p>Blob storage's access tiers balance storage cost against access cost, based on how often data is actually read: <b>Hot</b> (frequent access, higher storage cost, cheapest to read), <b>Cool</b> and <b>Cold</b> (infrequent access, lower storage cost, somewhat costlier to read), and <b>Archive</b> (rarely accessed, lowest possible storage cost, but the highest retrieval cost and latency — data may take hours to rehydrate before it's readable).</p>" +
    "<h3>Redundancy options</h3>" +
    "<p>Redundancy controls how many copies of your data exist and where:</p>" +
    "<ul><li><b>LRS (Locally Redundant Storage)</b> — three synchronous copies within a single datacenter. Protects against disk/node failure, not a datacenter-level disaster.</li>" +
    "<li><b>ZRS (Zone-Redundant Storage)</b> — copies spread synchronously across multiple availability zones in one region. Protects against a datacenter failure within the region.</li>" +
    "<li><b>GRS (Geo-Redundant Storage)</b> — LRS in the primary region, plus an asynchronous copy replicated to a paired secondary region. Protects against a regional disaster.</li>" +
    "<li><b>RA-GRS (Read-Access Geo-Redundant Storage)</b> — GRS, plus the ability to read directly from the secondary region even when the primary is healthy.</li></ul>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Higher redundancy always costs more — the exam expects you to match the redundancy level to the actual business requirement (\"must survive a regional outage\" &#8594; GRS/RA-GRS; \"just needs to survive a disk failure\" &#8594; LRS is enough) rather than assuming more redundancy is always the right answer.</p></div>" +
    "<h3>Moving data into Azure</h3>" +
    "<p><b>AzCopy</b> — a command-line tool optimized for fast, scriptable copying into and out of Blob/File storage. <b>Azure Storage Explorer</b> — a graphical application (and portal feature) for browsing and managing storage data visually. <b>Azure File Sync</b> — keeps an on-premises Windows file server in sync with an Azure file share, caching frequently used files locally while tiering the rest to the cloud.</p>" +
    "<h3>Larger migrations</h3>" +
    "<p><b>Azure Migrate</b> is a centralized hub of tools to discover, assess (sizing and cost), and migrate on-premises servers, databases, and workloads into Azure. <b>Azure Data Box</b> is a physical, ruggedized storage appliance Microsoft ships to you — you fill it locally and ship it back — for offline transfer of very large datasets where the network bandwidth simply isn't there to do it online in a reasonable time.</p>"
},
identitySecurity: {
  title:"Azure Identity, Access &amp; Security",
  html:
    "<p>Recall from the Cloud Concepts domain: no matter which service model you use, identity and data access are always the customer's responsibility. This lesson covers the tools Azure gives you to actually meet that responsibility.</p>" +
    "<h3>Directory services</h3>" +
    "<p><b>Microsoft Entra ID</b> (formerly Azure Active Directory) is Azure's cloud-based identity and access management service — the directory behind sign-in, user and group management, and access control for Azure and Microsoft 365 alike. <b>Microsoft Entra Domain Services</b> provides managed, classic AD-style capabilities — domain join, group policy, LDAP, Kerberos/NTLM — as a service, useful for legacy applications that depend on traditional Active Directory features Entra ID alone doesn't provide, without you having to stand up and patch your own domain controllers.</p>" +
    "<h3>Authentication methods</h3>" +
    "<ul><li><b>Single sign-on (SSO)</b> — authenticate once, gain access to multiple applications without re-entering credentials for each.</li>" +
    "<li><b>Multifactor authentication (MFA)</b> — requires at least two independent verification factors (something you know, have, or are), so a stolen password alone isn't enough to compromise an account.</li>" +
    "<li><b>Passwordless</b> — replaces the password entirely with a stronger factor: biometrics, a FIDO2 security key, Windows Hello, or the Microsoft Authenticator app.</li></ul>" +
    "<h3>External identities</h3>" +
    "<p><b>Microsoft Entra External ID / B2B collaboration</b> lets an organization securely invite external users — partners, vendors, contractors — to access shared resources using their own existing identity, instead of provisioning and managing a brand-new account for every outside collaborator.</p>" +
    "<h3>Conditional Access</h3>" +
    "<p><b>Microsoft Entra Conditional Access</b> enforces automated if-then access policies evaluated at sign-in time, based on real-time signals — user, location, device compliance state, and calculated risk. A typical policy: \"if this sign-in comes from outside a trusted location, require MFA before granting access.\" It's how access decisions become dynamic and context-aware rather than static.</p>" +
    "<h3>Role-based access control (RBAC)</h3>" +
    "<p><b>Azure RBAC</b> grants access by assigning <i>roles</i> — bundles of allowed actions — to a user, group, or application at a chosen <i>scope</i> (management group, subscription, resource group, or individual resource), following the principle of least privilege: give exactly the access needed, at the narrowest scope that still gets the job done.</p>" +
    "<h3>Zero Trust and defense-in-depth</h3>" +
    "<p><b>Zero Trust</b> replaces implicit trust based on network location with continuous verification — \"never trust, always verify\" — every request is authenticated, authorized, and evaluated on context, every time, whether it originates inside or outside the traditional network perimeter. <b>Defense-in-depth</b> is the architectural expression of that same caution: layering independent controls across physical, identity &amp; access, perimeter, network, compute, application, and data layers, so that if one layer is bypassed, others still stand between an attacker and the target.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Physical</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Identity &amp; access</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Perimeter</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Network</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Compute</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Application</div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Data</div>" +
    "</div>" +
    "<h3>Microsoft Defender for Cloud</h3>" +
    "<p><b>Microsoft Defender for Cloud</b> continuously evaluates security posture across Azure, hybrid, and multi-cloud resources, scoring it as a <b>secure score</b> and surfacing actionable hardening recommendations, plus active threat protection for the workloads it covers.</p>"
},
costManagement: {
  title:"Cost Management in Azure",
  html:
    "<p>Consumption-based pricing means costs can move if nobody is watching them. This lesson covers what actually drives Azure cost and the tools built to keep it predictable and visible.</p>" +
    "<h3>Factors that affect cost</h3>" +
    "<p>Azure pricing is driven by a combination of: the <b>resource type and size/tier</b> chosen, the <b>region</b> deployed to (prices vary by region due to local infrastructure and operating costs), the <b>consumption volume</b> actually used, and any <b>licensing</b> costs layered on top (e.g., bringing your own Windows Server license vs. paying for one included).</p>" +
    "<h3>The pricing calculator</h3>" +
    "<p>The <b>Azure pricing calculator</b> lets you model a hypothetical deployment — configuring services, tiers, region, and expected usage — to estimate its monthly cost <i>before</i> provisioning anything, so cost surprises get caught at the planning stage rather than the invoice.</p>" +
    "<h3>Cost management capabilities</h3>" +
    "<p><b>Azure Cost Management</b> provides reporting, forecasting, and controls over spend. A <b>budget</b> defines a spending threshold over a period (monthly, quarterly); a <b>cost alert</b> is the notification mechanism tied to that budget, automatically warning stakeholders when actual or forecasted spend approaches or exceeds the threshold — before it becomes a surprise on the bill.</p>" +
    "<p>Two pricing-model levers also affect cost directly: <b>Azure Reservations</b> trade a 1- or 3-year usage commitment for a significant discount versus pay-as-you-go, ideal for steady, predictable workloads; pay-as-you-go itself stays maximally flexible for unpredictable or short-term workloads at a higher per-unit rate.</p>" +
    "<h3>Tags</h3>" +
    "<p><b>Tags</b> are customizable name/value metadata pairs applied to resources (e.g., <code>Department:Finance</code>, <code>Environment:Production</code>). They let an organization organize, report on, and automate against resources by a logical dimension of its own choosing — completely independent of where a resource sits in the subscription/resource-group hierarchy. Tagging is the standard way to answer \"how much is each department/project/environment actually spending?\" when resources from many teams share the same subscription.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>A resource's location in the resource-group hierarchy controls management and access; tags control reporting and cross-cutting organization. They solve different problems and are frequently used together, not interchangeably.</p></div>"
},
governanceCompliance: {
  title:"Governance &amp; Compliance Tools in Azure",
  html:
    "<p>Cost management keeps spend visible; governance keeps configuration and data itself under control. This lesson covers the three tools AZ-900 names specifically for that job.</p>" +
    "<h3>Microsoft Purview</h3>" +
    "<p><b>Microsoft Purview</b> is a unified data governance solution: it discovers, classifies, and catalogs sensitive data across an organization's estate — on-premises, multi-cloud, and SaaS — and helps manage regulatory compliance and data risk on top of that visibility. You can't protect or govern data you don't know exists; Purview's job starts there.</p>" +
    "<h3>Azure Policy</h3>" +
    "<p><b>Azure Policy</b> evaluates resources against defined business rules and can <b>audit</b> (flag non-compliant resources without blocking them), <b>deny</b> (block deployment of a non-compliant configuration outright), or actively <b>remediate</b> existing non-compliant resources. A typical policy: \"deny creation of any storage account that doesn't enforce encryption\" or \"only allow resource deployment in approved regions.\"</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Policy and RBAC solve different problems and the exam likes to test the distinction directly: <b>RBAC</b> controls <i>who</i> can perform <i>which actions</i> (identity-based access). <b>Policy</b> controls <i>what configuration state</i> a resource is allowed to have, regardless of who created it. A user can have full RBAC permission to create a resource and still get blocked by Policy if the resulting configuration violates a rule.</p></div>" +
    "<h3>Resource locks</h3>" +
    "<p>A <b>resource lock</b> prevents accidental deletion or modification of a critical resource — and unlike Policy or RBAC, it overrides even a user's own normal permissions. Two levels: <b>CanNotDelete</b> blocks deletion but still allows configuration changes; <b>ReadOnly</b> blocks both deletion and any modification at all. Locks are a safety net against a human mistake (someone with full delete permission accidentally deleting a production database), not an access-control mechanism.</p>" +
    "<h3>Putting it together</h3>" +
    "<p>These three tools work at different points in the same governance story: Purview finds and classifies what data exists and how sensitive it is; Policy enforces the configuration rules resources must follow going forward; resource locks add a last-line safety net against accidental changes to the resources that matter most, no matter who's making the change.</p>"
},
managingDeploying: {
  title:"Tools for Managing &amp; Deploying Azure Resources",
  html:
    "<p>Every Azure resource in this platform so far could be created by hand, one click at a time — but that doesn't scale, and it isn't repeatable. This lesson covers the tools Azure provides to manage and deploy resources at any scale, from a single VM to an entire enterprise landing zone.</p>" +
    "<h3>The Azure portal</h3>" +
    "<p>The <b>Azure portal</b> is the primary web-based, graphical console for creating, configuring, and monitoring the full range of Azure resources — the natural starting point for exploring a service or making a one-off change.</p>" +
    "<h3>Command-line tools</h3>" +
    "<p><b>Azure Cloud Shell</b> is a browser-based, pre-authenticated shell (choose Bash or PowerShell) accessible directly from the portal, with nothing to install locally. <b>Azure CLI</b> and <b>Azure PowerShell</b> are both cross-platform command-line tools for managing Azure resources — functionally comparable, differing mainly in syntax style: CLI uses a flat, cross-platform command structure, PowerShell uses verb-noun cmdlets consistent with the rest of the PowerShell ecosystem. Either one can be installed locally or used inside Cloud Shell.</p>" +
    "<h3>Azure Arc</h3>" +
    "<p><b>Azure Arc</b> extends Azure's management plane — policy, monitoring, RBAC — to resources running <i>outside</i> Azure: on-premises servers, other public clouds, and edge devices. Arc projects those non-Azure resources into Azure Resource Manager so they can be governed and monitored using the exact same tools as native Azure resources, closing a major hybrid/multi-cloud management gap.</p>" +
    "<h3>Infrastructure as code (IaC)</h3>" +
    "<p><b>Infrastructure as code</b> defines and provisions infrastructure through machine-readable definition files instead of manual, one-off configuration through a UI. The benefit isn't just convenience — it's <b>consistency</b> (the same template redeploys an identical environment every time), <b>auditability</b> (the template can be checked into source control, so every change has a history), and reduced configuration drift between environments like dev, test, and production.</p>" +
    "<h3>ARM templates</h3>" +
    "<p>An <b>Azure Resource Manager (ARM) template</b> is Azure's native declarative IaC format — a JSON file (commonly authored in the more readable <b>Bicep</b> language and compiled down to ARM JSON) describing exactly which resources should exist, how they're configured, and how they depend on each other. Resource Manager reads the template and deploys it idempotently — running the same template twice converges on the same end state rather than creating duplicates.</p>"
},
monitoringTools: {
  title:"Monitoring Tools in Azure",
  html:
    "<p>Deployed and governed resources still need watching. This closing lesson of the Management &amp; Governance domain covers the four monitoring tools named specifically on the AZ-900 exam.</p>" +
    "<h3>Azure Advisor</h3>" +
    "<p><b>Azure Advisor</b> continuously analyzes your actual resource configuration and usage, then surfaces personalized, actionable recommendations across five pillars: <b>cost</b>, <b>security</b>, <b>reliability</b>, <b>operational excellence</b>, and <b>performance</b>. Think of it as an automated best-practices review running against your specific environment, not generic documentation.</p>" +
    "<h3>Azure Service Health</h3>" +
    "<p><b>Azure Service Health</b> tracks the health of the Azure <i>platform itself</i> — active service issues, planned maintenance, and health advisories — filtered specifically to the subscriptions, resources, and regions you actually use, rather than a generic global status page.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Don't confuse the two: Advisor recommends changes to <i>your</i> configuration; Service Health reports on the health of the underlying <i>Azure platform</i>.</p></div>" +
    "<h3>Azure Monitor</h3>" +
    "<p><b>Azure Monitor</b> is the umbrella platform for collecting, analyzing, and acting on telemetry — both metrics and logs — from Azure and hybrid resources. Everything else in this lesson is built on top of it.</p>" +
    "<ul><li><b>Log Analytics</b> — Azure Monitor's log query engine, using <b>Kusto Query Language (KQL)</b> to search, correlate, and analyze collected log data for investigation, custom reporting, and powering alerts.</li>" +
    "<li><b>Azure Monitor alerts</b> — automated notifications or actions, proactively triggered when a defined condition is met against collected metrics or logs (e.g., CPU above 90% for five minutes), so issues surface without a human watching a dashboard.</li>" +
    "<li><b>Application Insights</b> — Azure Monitor's Application Performance Management (APM) feature, instrumenting application code itself to reveal request rates, response times, dependency calls, and exceptions at the application layer, not just infrastructure-level metrics.</li></ul>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Notice the layering across this whole domain: Policy and locks govern configuration, Cost Management governs spend, and Advisor/Service Health/Monitor together govern operational visibility — three different governance questions, three different tool families.</p></div>"
},
awsValueProp: {
  title:"The AWS Cloud &amp; Its Value Proposition",
  html:
    "<p>Every AWS service and every exam question ultimately traces back to one question: why move to the cloud at all? This lesson covers what the AWS Cloud actually is and the economic case for using it.</p>" +
    "<h3>What the AWS Cloud is</h3>" +
    "<p>The AWS Cloud is Amazon's on-demand delivery platform for IT resources — compute, storage, databases, networking, and dozens of higher-level services — delivered over the internet with pay-as-you-go pricing. Instead of buying and operating physical servers, a customer rents exactly the capacity needed, when it's needed, from AWS's global infrastructure.</p>" +
    "<h3>The six advantages of cloud computing</h3>" +
    "<p>AWS frames the business case for cloud adoption around six concrete advantages:</p>" +
    "<ul><li><b>Trade capital expense for variable expense</b> — instead of investing heavily in data centers before knowing how much you'll actually use, pay only for the compute you consume.</li>" +
    "<li><b>Benefit from massive economies of scale</b> — AWS aggregates usage from hundreds of thousands of customers, achieving lower costs than any single company could negotiate alone, and passes some of that savings on through lower pay-as-you-go prices.</li>" +
    "<li><b>Stop guessing capacity</b> — scale up or down automatically to match actual demand, instead of provisioning for a guess that's usually wrong in one direction or the other.</li>" +
    "<li><b>Increase speed and agility</b> — new resources are a few clicks or an API call away, not a weeks-long procurement cycle.</li>" +
    "<li><b>Stop spending money running and maintaining data centers</b> — the undifferentiated heavy lifting of racking, stacking, powering, and cooling physical servers shifts to AWS.</li>" +
    "<li><b>Go global in minutes</b> — deploy an application into new AWS Regions around the world to get closer to end users and reduce latency, without building new physical infrastructure yourself.</li></ul>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>CapEx<br><span style='color:var(--text-faint)'>buy hardware upfront</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>OpEx<br><span style='color:var(--text-faint)'>pay for what you use</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Elasticity<br><span style='color:var(--text-faint)'>scale to match demand</span></div>" +
    "</div>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>These six advantages show up constantly as the 'why' behind AWS scenario questions — a scenario describing a company avoiding a large upfront hardware purchase is testing the CapEx-to-OpEx advantage specifically, not cloud benefits in general.</p></div>"
},
awsWellArchitected: {
  title:"The AWS Well-Architected Framework",
  html:
    "<p>Knowing individual AWS services is only half of cloud fluency — the other half is judging whether an architecture built from those services is actually well designed. The Well-Architected Framework gives a consistent vocabulary for that judgment.</p>" +
    "<h3>The six pillars</h3>" +
    "<ul><li><b>Operational excellence</b> — the ability to run and monitor systems to deliver business value, and to continually improve supporting processes.</li>" +
    "<li><b>Security</b> — protecting information, systems, and assets through risk assessments and mitigation strategies.</li>" +
    "<li><b>Reliability</b> — the ability to recover from infrastructure or service disruptions, dynamically acquire computing resources to meet demand, and mitigate issues like misconfigurations or transient network problems.</li>" +
    "<li><b>Performance efficiency</b> — using computing resources efficiently to meet requirements, and maintaining that efficiency as demand and technology evolve.</li>" +
    "<li><b>Cost optimization</b> — avoiding unnecessary costs and understanding where money is being spent.</li>" +
    "<li><b>Sustainability</b> — minimizing the environmental impact of running cloud workloads — the newest of the six pillars.</li></ul>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>The exam tends to describe a scenario and ask which pillar it best maps to — \"a team wants automated rollback if a deployment fails\" is operational excellence; \"a company wants to right-size instances to cut unnecessary spend\" is cost optimization. Practice matching the scenario to the pillar, not memorizing the list in isolation.</p></div>" +
    "<h3>Why this matters beyond the exam</h3>" +
    "<p>The six pillars aren't independent — they trade off against each other constantly. Maximizing reliability (more redundancy, more standby capacity) usually costs more, working against cost optimization. A well-architected system doesn't maximize every pillar; it makes a deliberate, documented tradeoff appropriate to the workload's actual requirements.</p>"
},
awsSharedResponsibility: {
  title:"The AWS Shared Responsibility Model",
  html:
    "<p>Moving to AWS doesn't mean security becomes AWS's problem alone. The shared responsibility model draws a clear line between what AWS secures and what the customer must secure — and, just like in Azure, that line moves depending on which service you use.</p>" +
    "<h3>Security OF the cloud vs. security IN the cloud</h3>" +
    "<p><b>AWS is responsible for security OF the cloud</b> — the physical infrastructure, hardware, software, networking, and facilities that run AWS services. <b>The customer is responsible for security IN the cloud</b> — their own data, identity and access management configuration, and (depending on the service) guest operating system, network, and firewall configuration.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>AWS<br><span style='color:var(--text-faint)'>security OF the cloud</span></div><div class='arrow'>&#8596;</div>" +
      "<div class='step'>Customer<br><span style='color:var(--text-faint)'>security IN the cloud</span></div>" +
    "</div>" +
    "<h3>The line moves by service type</h3>" +
    "<p>For an <b>EC2 instance</b> (infrastructure-level), AWS manages the physical host and hypervisor, but the customer owns everything from the guest OS upward — including patching it. For a <b>fully managed service like Amazon S3</b>, AWS takes on more of the stack — there's no guest OS for the customer to patch at all — leaving the customer responsible mainly for data classification, bucket/access policies, and client-side encryption choices.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>One line never moves regardless of service type: the customer's own data, identity configuration, and access management are always the customer's responsibility. A misconfigured S3 bucket policy that exposes data publicly is a customer failure under the shared responsibility model, no matter how secure AWS's underlying infrastructure is.</p></div>" +
    "<h3>Compliance documentation</h3>" +
    "<p><b>AWS Artifact</b> is the self-service portal where customers can access AWS's compliance reports and audit documentation on demand — useful evidence when a customer needs to demonstrate their own compliance posture to an auditor or regulator.</p>"
},
awsIAM: {
  title:"AWS Identity &amp; Access Management (IAM)",
  html:
    "<p>The shared responsibility model makes identity and access management the customer's job, always. IAM is AWS's service for controlling exactly who — and what — can do what, inside an AWS account.</p>" +
    "<h3>The root user</h3>" +
    "<p>Every AWS account starts with a <b>root user</b>, created automatically and holding unrestricted access to every resource and to billing itself. Its power makes it a dangerous daily driver — best practice is to secure it immediately with MFA, avoid using it for day-to-day work, and delegate actual tasks to IAM users and roles instead.</p>" +
    "<h3>Users, groups, and roles</h3>" +
    "<ul><li><b>IAM users</b> — long-term identities (a person or an application) with permanent credentials.</li>" +
    "<li><b>IAM groups</b> — collections of users that let administrators attach a shared permissions policy once, instead of managing each user's permissions individually.</li>" +
    "<li><b>IAM roles</b> — identities that get <i>assumed</i> temporarily (by a user, an application, or an AWS service itself) and issue short-lived credentials rather than permanent keys — reducing the risk of a long-lived secret leaking.</li></ul>" +
    "<h3>Policies and least privilege</h3>" +
    "<p>Permissions are defined in <b>IAM policies</b> — JSON documents specifying which actions are allowed or denied, against which resources, optionally under specific conditions. The guiding principle is <b>least privilege</b>: grant only the minimum permissions an identity actually needs to do its job, nothing more — limiting the blast radius if that identity is ever compromised or misused.</p>" +
    "<h3>Multi-factor authentication</h3>" +
    "<p><b>MFA</b> requires a second, independent verification factor beyond the password at sign-in, so a leaked password alone isn't enough to compromise an account. It's especially critical on the root user, given its unrestricted reach.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Users vs. roles is a favorite exam distinction: if a scenario mentions temporary access, cross-account access, or an AWS service (like an EC2 instance) needing permission to call other AWS APIs, that's a role — not a user.</p></div>"
},
awsGovernanceSecurity: {
  title:"Cloud Security, Governance &amp; Compliance Concepts",
  html:
    "<p>IAM controls access within a single account. This lesson covers the tools AWS provides for governing across many accounts, protecting infrastructure from external threats, and proving compliance.</p>" +
    "<h3>AWS Organizations &amp; Service Control Policies</h3>" +
    "<p><b>AWS Organizations</b> lets a company centrally manage and govern multiple AWS accounts — consolidated billing across all of them, plus policy-based governance applied uniformly. <b>Service Control Policies (SCPs)</b> set the maximum available permissions for accounts within an organization or organizational unit — a guardrail that even that account's own administrators cannot exceed, regardless of what their own IAM policies allow.</p>" +
    "<h3>Encryption and network protection</h3>" +
    "<ul><li><b>AWS Key Management Service (KMS)</b> — creates and controls the encryption keys used to protect data across AWS services.</li>" +
    "<li><b>AWS Shield</b> — managed protection against Distributed Denial of Service (DDoS) attacks.</li>" +
    "<li><b>AWS WAF (Web Application Firewall)</b> — monitors and controls HTTP/HTTPS requests reaching a web application, filtering out malicious patterns like SQL injection or cross-site scripting.</li></ul>" +
    "<h3>Compliance documentation</h3>" +
    "<p><b>AWS Artifact</b> is the on-demand, self-service source for AWS's independent compliance reports and audit documentation — the resource to point to when a customer needs to demonstrate their compliance posture to an auditor.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Notice the layering: SCPs govern what accounts are allowed to do at all, IAM governs what identities within an account are allowed to do, KMS/Shield/WAF protect data and traffic directly, and Artifact documents compliance after the fact. Different governance questions, different tools.</p></div>"
},
awsGlobalInfra: {
  title:"AWS Global Infrastructure",
  html:
    "<p>Before choosing a service, you need AWS's vocabulary for where things physically run. This lesson covers Regions, Availability Zones, and Edge Locations — and how to reason about choosing between them.</p>" +
    "<h3>Regions</h3>" +
    "<p>An <b>AWS Region</b> is a separate geographic area containing multiple, isolated locations called Availability Zones — the top-level unit a customer picks when deciding where to deploy resources (e.g., US East, Ohio or EU West, Ireland). Choosing a Region is a real architecture decision, driven by:</p>" +
    "<ul><li><b>Latency</b> — deploying closer to your actual users reduces round-trip time.</li>" +
    "<li><b>Compliance and data residency</b> — some data must legally stay within a specific country or region.</li>" +
    "<li><b>Cost</b> — pricing varies by Region.</li>" +
    "<li><b>Service and feature availability</b> — not every AWS service launches in every Region simultaneously.</li></ul>" +
    "<h3>Availability Zones</h3>" +
    "<p>An <b>Availability Zone (AZ)</b> is one or more discrete data centers with redundant power, networking, and connectivity, isolated from failures in other AZs within the same Region but connected via low-latency links. Deploying resources across multiple AZs protects against a datacenter-level failure — power loss, networking issues, a localized natural disaster — without losing the whole application.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>Availability Zone<br><span style='color:var(--text-faint)'>protects vs. datacenter failure</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Region<br><span style='color:var(--text-faint)'>set of AZs</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Multi-Region<br><span style='color:var(--text-faint)'>protects vs. regional disaster</span></div>" +
    "</div>" +
    "<h3>Edge Locations</h3>" +
    "<p><b>Edge Locations</b> are a separate, much larger network of caching sites used by services like Amazon CloudFront to serve content from somewhere physically closer to the end user — distinct from Regions and AZs, and far more numerous.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Same relationship as Azure's AZs vs. region pairs: spreading across AZs handles a single-facility failure; spreading across Regions is the answer when the entire Region itself could become unavailable — two different scales of resilience for two different kinds of risk.</p></div>"
},
awsDeployOps: {
  title:"Deployment &amp; Operation Methods",
  html:
    "<p>Every AWS resource in this platform so far could be created by hand, one click at a time — but production environments need something more repeatable. This lesson covers AWS's tools for managing and deploying resources at any scale.</p>" +
    "<h3>The Management Console</h3>" +
    "<p>The <b>AWS Management Console</b> is the primary web-based graphical interface for creating, configuring, and monitoring AWS resources — the natural starting point for exploring a service or making a one-off change.</p>" +
    "<h3>Programmatic access</h3>" +
    "<p>The <b>AWS Command Line Interface (CLI)</b> is a unified tool for managing AWS services from a terminal via typed commands, enabling scripting and automation across platforms. <b>AWS SDKs</b> (Software Development Kits) let developers interact with AWS services directly from application code in languages like Python, Java, or JavaScript, instead of driving everything manually through the console or CLI.</p>" +
    "<h3>Infrastructure as code</h3>" +
    "<p><b>AWS CloudFormation</b> defines and provisions infrastructure using declarative template files, so environments can be created consistently and repeatably — the same template redeploys an identical environment every time, rather than depending on someone remembering every manual click.</p>" +
    "<h3>Managed application deployment</h3>" +
    "<p><b>AWS Elastic Beanstalk</b> simplifies deploying and managing web applications without manually provisioning and configuring the underlying infrastructure (EC2, load balancing, Auto Scaling) — upload application code, and Beanstalk handles the rest as a Platform-as-a-Service layer.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>CLI/SDK and CloudFormation both automate AWS, but for different jobs: CLI/SDK issue individual commands or API calls; CloudFormation declares an entire desired end state and lets AWS figure out how to get there, repeatably.</p></div>"
},
awsCompute: {
  title:"Core AWS Compute Services",
  html:
    "<p>Compute is where a workload actually runs. AWS offers several distinct compute models, trading control for management overhead in different ways — recognizing which one fits a given scenario is a heavily tested skill.</p>" +
    "<h3>Amazon EC2</h3>" +
    "<p><b>Amazon EC2</b> provides resizable virtual servers (instances) in the cloud, giving the customer control over the operating system and installed software — AWS's core IaaS compute offering, closest to running your own on-premises server, just on AWS-managed hardware.</p>" +
    "<h3>AWS Lambda</h3>" +
    "<p><b>AWS Lambda</b> is serverless compute — code runs only in response to a trigger (an HTTP request, a file upload, a schedule), with AWS automatically managing the underlying compute and billing only for actual execution time. For short, event-driven work, Lambda avoids the overhead of keeping an EC2 instance running (or managing its scaling) just to wait for occasional triggers.</p>" +
    "<h3>Containers: ECS, EKS &amp; Fargate</h3>" +
    "<p><b>Amazon ECS</b> and <b>Amazon EKS</b> are both container orchestration services — ECS is AWS's own proprietary orchestrator, EKS runs the open-source Kubernetes standard as a managed service. Both run and scale containerized applications, but need somewhere to actually execute those containers. <b>AWS Fargate</b> is a serverless compute engine that works with either ECS or EKS, removing the need to provision or manage the underlying EC2 instances that would normally host the containers.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>EC2<br><span style='color:var(--text-faint)'>most control</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>ECS/EKS + EC2<br><span style='color:var(--text-faint)'>orchestrated, self-managed hosts</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>ECS/EKS + Fargate<br><span style='color:var(--text-faint)'>no host management</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Lambda<br><span style='color:var(--text-faint)'>no server thinking at all</span></div>" +
    "</div>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Exam scenarios describe a need (\"process a file only when it's uploaded, with zero ongoing server cost\") and expect you to map it to the right compute model — that's Lambda, not EC2, even though EC2 could technically do it less efficiently.</p></div>"
},
awsStorageDbNetwork: {
  title:"Storage, Database &amp; Networking Services",
  html:
    "<p>Compute needs somewhere to keep data and a network to talk over. This lesson is a fast tour of the AWS services named specifically on the exam for storage, databases, and networking.</p>" +
    "<h3>Storage: S3 and EBS</h3>" +
    "<p><b>Amazon S3</b> is scalable object storage for virtually any amount of unstructured data — documents, images, backups, static website content — accessed over the web. <b>S3 storage classes</b> (Standard, Infrequent Access, Glacier, and others) let customers balance storage cost against retrieval cost/speed based on how often the data is actually accessed, the same tradeoff Azure's access tiers make. <b>Amazon EBS</b> provides persistent, attachable block-level storage volumes for a single EC2 instance — the virtual-disk equivalent of a physical hard drive.</p>" +
    "<h3>Databases: RDS and DynamoDB</h3>" +
    "<p><b>Amazon RDS</b> is a managed relational (SQL) database service supporting engines like MySQL and PostgreSQL, with AWS handling patching, backups, and availability. <b>Amazon DynamoDB</b> is a fully managed NoSQL key-value/document database built for extreme scale and single-digit-millisecond latency — a fundamentally different data model, not just a relational database with a different name.</p>" +
    "<h3>Networking: VPC, Route 53 &amp; CloudFront</h3>" +
    "<p><b>Amazon VPC (Virtual Private Cloud)</b> is a logically isolated virtual network within AWS, giving the customer control over IP addressing, subnets, route tables, and gateways — the network foundation everything else runs inside. <b>Amazon Route 53</b> is a scalable DNS web service for domain registration and routing. <b>Amazon CloudFront</b> is a content delivery network (CDN) that caches content at edge locations closer to users, reducing latency for content delivery.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Route 53 and CloudFront are commonly confused: Route 53 resolves domain names to addresses (DNS); CloudFront caches and delivers the actual content faster once a request arrives. They're often used together, but they solve different problems.</p></div>"
},
awsPricing: {
  title:"AWS Pricing Models",
  html:
    "<p>Consumption-based pricing means the same workload can cost very different amounts depending on how it's purchased. This lesson covers the pricing models AWS offers and when each one actually makes sense.</p>" +
    "<h3>On-Demand</h3>" +
    "<p><b>On-Demand</b> pricing means paying for compute or database capacity by the hour or second, with no long-term commitments or upfront payments — maximum flexibility, typically at the highest per-unit rate. It's the right default for unpredictable or short-term workloads, where committing to a discount you might not fully use would cost more than it saves.</p>" +
    "<h3>Reserved Instances &amp; Savings Plans</h3>" +
    "<p><b>Reserved Instances</b> and <b>Savings Plans</b> trade a usage commitment (typically 1 or 3 years) for a significantly discounted rate versus On-Demand. This only pays off when usage is genuinely predictable — a steady, 24/7 baseline workload is exactly the pattern this pricing model is built to reward.</p>" +
    "<h3>Spot Instances</h3>" +
    "<p><b>EC2 Spot Instances</b> use spare, unused EC2 capacity at steep discounts compared to On-Demand — but AWS can reclaim that capacity with short notice. Spot fits flexible, interruption-tolerant workloads (batch processing, some CI/CD jobs), not anything requiring guaranteed uptime.</p>" +
    "<h3>Free Tier</h3>" +
    "<p>The <b>AWS Free Tier</b> offers limited free usage of certain services for a period (commonly 12 months) or always-free limits, letting new customers try services at no cost within defined limits — not unlimited free usage.</p>" +
    "<div class='diagram-flow'>" +
      "<div class='step'>On-Demand<br><span style='color:var(--text-faint)'>most flexible, highest rate</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Reserved / Savings Plans<br><span style='color:var(--text-faint)'>commit for a discount</span></div><div class='arrow'>&#8594;</div>" +
      "<div class='step'>Spot<br><span style='color:var(--text-faint)'>cheapest, can be reclaimed</span></div>" +
    "</div>"
},
awsBillingSupport: {
  title:"Billing, Cost Management &amp; Support Resources",
  html:
    "<p>Consumption-based pricing across dozens of services can get away from you without the right visibility. This closing lesson covers AWS's tools for tracking spend and the support resources available when something needs a human.</p>" +
    "<h3>Cost visibility and control</h3>" +
    "<ul><li><b>AWS Cost Explorer</b> — visualizes and analyzes cost and usage over time, including forecasting future spend.</li>" +
    "<li><b>AWS Budgets</b> — lets you set custom cost or usage thresholds and receive alerts when actual or forecasted spend approaches or exceeds them.</li>" +
    "<li><b>AWS Pricing Calculator</b> — estimates the cost of AWS services <i>before</i> deploying them, by modeling a planned architecture's configuration and expected usage.</li>" +
    "<li><b>AWS Organizations consolidated billing</b> — combines usage across every linked account into a single bill, potentially unlocking volume pricing discounts while still preserving per-account cost detail.</li></ul>" +
    "<h3>Support plans</h3>" +
    "<p>AWS offers four support tiers — <b>Basic, Developer, Business, and Enterprise</b> — differing in response times, access to Trusted Advisor checks, and (at the top tier) access to a dedicated Technical Account Manager (TAM) for proactive guidance. Higher tiers mean faster guaranteed response and more proactive support, not a different underlying set of AWS services.</p>" +
    "<h3>AWS Trusted Advisor</h3>" +
    "<p><b>Trusted Advisor</b> inspects your actual account against AWS best practices across five categories — cost optimization, performance, security, fault tolerance, and service limits — and surfaces specific, actionable recommendations, similar in spirit to Azure Advisor.</p>" +
    "<div class='callout'><span class='uc'>Exam note</span><p>Notice the parallel to the Cloud Concepts domain's economic case: Cost Explorer/Budgets/Pricing Calculator are how an organization actually operationalizes the pay-as-you-go promise, turning 'variable expense' from a slogan into something managed day to day.</p></div>"
}
};

lab4report: {
  title:"LAB: Route the Findings",
  briefHtml:"<p>A batch of items just landed in the queue. Two files: <code>findings_queue.txt</code> and <code>stakeholder_directory.txt</code>. Route each item to the right audience — not every finding goes to the same place.</p>",
