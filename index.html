<title>The Proving Grounds — SOC Training Ground</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e6eaef; --surface-3:#dbe1e8;
  --border:#cbd4dd; --text:#141b24; --text-dim:#4d5c6d; --text-faint:#7c8a9a;
  --accent:#b9740c; --accent-strong:#8f5a09; --accent-cool:#106b82; --accent-contrast:#ffffff;
  --sev-critical:#c8272f; --sev-high:#c05a12; --sev-medium:#8a6d00; --sev-low:#1d5fc0; --sev-info:#55606c;
  --shadow: 0 1px 2px rgba(20,27,36,.06), 0 8px 24px rgba(20,27,36,.06);
  --font-mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --font-sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --radius: 8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e13; --surface:#111823; --surface-2:#19222e; --surface-3:#212c3a;
    --border:#2a3644; --text:#e7edf4; --text-dim:#93a2b3; --text-faint:#5c6b7d;
    --accent:#f2a93b; --accent-strong:#ffc25c; --accent-cool:#4fb0c9; --accent-contrast:#14100a;
    --sev-critical:#f0485a; --sev-high:#f2903b; --sev-medium:#e0c23e; --sev-low:#4f8ff2; --sev-info:#8b98a8;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e13; --surface:#111823; --surface-2:#19222e; --surface-3:#212c3a;
  --border:#2a3644; --text:#e7edf4; --text-dim:#93a2b3; --text-faint:#5c6b7d;
  --accent:#f2a93b; --accent-strong:#ffc25c; --accent-cool:#4fb0c9; --accent-contrast:#14100a;
  --sev-critical:#f0485a; --sev-high:#f2903b; --sev-medium:#e0c23e; --sev-low:#4f8ff2; --sev-info:#8b98a8;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--font-sans);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

a{color:var(--accent-cool);}
h1,h2,h3,h4{font-family:var(--font-mono); text-wrap:balance; letter-spacing:.01em; margin:0 0 .5em; font-weight:700;}
p{margin:0 0 1em; max-width:66ch;}
ul,ol{margin:0 0 1em; padding-left:1.3em;}
li{margin-bottom:.35em;}
code{font-family:var(--font-mono); background:var(--surface-3); padding:.1em .4em; border-radius:4px; font-size:.9em;}
::selection{ background: color-mix(in srgb, var(--accent) 35%, transparent); }
button{font-family:inherit;}
:focus-visible{ outline:2px solid var(--accent-cool); outline-offset:2px; border-radius:4px; }

.uc{ text-transform:uppercase; letter-spacing:.08em; font-family:var(--font-mono); }

/* ---------- shell ---------- */
.app-shell{ display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
@media (max-width: 860px){ .app-shell{ grid-template-columns:1fr; } .sidebar{ position:sticky; top:0; height:auto; max-height:80vh; } }

.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:18px 14px; gap:18px;
  position:sticky; top:0; height:100vh; max-height:100vh; overflow-y:auto; z-index:20;
}
.brand{ display:flex; align-items:baseline; gap:2px; font-family:var(--font-mono); font-weight:700; font-size:1rem; letter-spacing:.03em; line-height:1.2; }
.brand .path{ color:var(--text-faint); }
.brand .name{ color:var(--accent); }
.brand .cursor{ display:inline-block; width:.55em; height:1em; background:var(--accent); margin-left:2px; vertical-align:-2px; animation:blink 1.1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.tagline{ font-size:.72rem; color:var(--text-faint); margin-top:4px; line-height:1.3; }

.nav{ display:flex; flex-direction:column; gap:4px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius);
  color:var(--text-dim); text-decoration:none; cursor:pointer; border:1px solid transparent; background:none;
  font-size:.86rem; text-align:left; width:100%;
}
.nav-item:hover{ background:var(--surface-2); color:var(--text); }
.nav-item.active{ background:var(--surface-2); border-color:var(--border); color:var(--text); }
.nav-item .dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex:none; }
.nav-item.live .dot{ background:var(--accent-cool); }
.nav-item.done .dot{ background:#3aa35a; }
.exam-nav .dot{ background:var(--accent); }
.nav-item .n-title{ flex:1; }
.nav-item .n-pct{ font-family:var(--font-mono); font-size:.7rem; color:var(--text-faint); }
.nav-item.nav-sub{ margin-left:14px; width:calc(100% - 14px); }
.nav-item.nav-sub2{ margin-left:26px; width:calc(100% - 26px); }
.nav-mini-bar{ height:3px; border-radius:2px; background:var(--surface-3); margin:2px 10px 6px; overflow:hidden; }
.nav-mini-bar.sub2{ margin-left:22px; }
.nav-mini-bar > i{ display:block; height:100%; background:var(--accent-cool); }

.sidebar-spacer{ flex:1; }

.profile-card{ border:1px solid var(--border); border-radius:var(--radius); padding:12px; background:var(--surface-2); }
.profile-row{ display:flex; align-items:center; gap:10px; }
.avatar{
  width:34px; height:34px; border-radius:6px; background:var(--accent); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; flex:none;
}
.rank-name{ font-size:.82rem; font-weight:700; }
.rank-name.certified{ color:var(--accent); }
.xp-line{ font-family:var(--font-mono); font-size:.72rem; color:var(--text-faint); }
.streak{ display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:.75rem; color:var(--text-dim); margin-top:8px; }
.streak b{ color:var(--sev-high); }
.io-row{ display:flex; gap:6px; margin-top:10px; }

.btn{
  font-family:var(--font-mono); font-size:.75rem; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); padding:7px 10px; cursor:pointer; text-transform:uppercase; letter-spacing:.04em;
}
.btn:hover{ color:var(--text); border-color:var(--text-faint); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); font-weight:700; }
.btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); color:var(--accent-contrast); }
.btn-block{ width:100%; }
.btn-sm{ padding:5px 8px; font-size:.68rem; }

.theme-toggle{ display:flex; gap:4px; }
.theme-toggle button{ flex:1; }
.theme-toggle button[aria-pressed="true"]{ background:var(--surface-3); color:var(--text); }

/* ---------- main ---------- */
.main{ min-width:0; display:flex; flex-direction:column; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:14px 26px;
  border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:10;
}
.crumb{ font-family:var(--font-mono); font-size:.78rem; color:var(--text-faint); }
.crumb b{ color:var(--text); }
.topbar-actions{ display:flex; gap:8px; align-items:center; }
.xp-pill{ font-family:var(--font-mono); font-size:.75rem; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:5px 12px; color:var(--text-dim); }
.xp-pill b{ color:var(--accent); }

.view{ padding:28px 30px 60px; max-width:980px; width:100%; margin:0 auto; }

/* ---------- dashboard ---------- */
.hero{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:26px; flex-wrap:wrap; }
.hero h1{ font-size:1.7rem; margin-bottom:.2em; }
.hero p{ color:var(--text-dim); margin:0; }
.ring-wrap{ position:relative; width:92px; height:92px; flex:none; }
.ring-wrap svg{ transform:rotate(-90deg); }
.ring-bg{ stroke:var(--surface-3); fill:none; stroke-width:8; }
.ring-fg{ stroke:var(--accent); fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .4s ease; }
.ring-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:.95rem; }

.path{ position:relative; display:flex; flex-direction:column; gap:0; }
.path::before{ content:""; position:absolute; left:27px; top:26px; bottom:26px; width:2px; background:var(--border); }
.domain-node{ position:relative; display:flex; gap:16px; padding:16px 0; cursor:pointer; }
.node-marker{
  width:54px; height:54px; border-radius:50%; background:var(--surface); border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; z-index:1; flex:none;
}
.domain-node.live .node-marker{ border-color:var(--accent-cool); color:var(--accent-cool); }
.domain-node.complete .node-marker{ border-color:#3aa35a; background:#3aa35a; color:#fff; }
.domain-node.preview .node-marker{ border-color:var(--border); color:var(--text-faint); }
.domain-card{ flex:1; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:14px 16px; transition:border-color .15s; }
.domain-node:hover .domain-card{ border-color:var(--text-faint); }
.domain-card-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.domain-title{ font-family:var(--font-mono); font-weight:700; font-size:1rem; }
.domain-tagline{ color:var(--text-dim); font-size:.85rem; margin:.3em 0 0; }
.badge{ font-family:var(--font-mono); font-size:.65rem; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:20px; border:1px solid var(--border); color:var(--text-faint); flex:none; }
.badge.weight{ color:var(--accent-cool); border-color:color-mix(in srgb, var(--accent-cool) 40%, var(--border)); }
.badge.preview{ color:var(--sev-medium); border-color:color-mix(in srgb, var(--sev-medium) 40%, var(--border)); }
.domain-progress-bar{ height:5px; border-radius:3px; background:var(--surface-3); margin-top:12px; overflow:hidden; }
.domain-progress-bar > i{ display:block; height:100%; background:var(--accent-cool); }

/* ---------- final exam ---------- */
.exam-card-wrap{ margin-top:22px; padding-top:22px; border-top:1px dashed var(--border); }
.exam-card{
  border:1px solid var(--accent); border-radius:var(--radius); background:var(--surface); padding:18px 20px;
  display:flex; justify-content:space-between; align-items:center; gap:16px; cursor:pointer;
  box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 15%, transparent);
}
.exam-card:hover{ background:var(--surface-2); }
.exam-card.locked{ cursor:not-allowed; border-color:var(--border); box-shadow:none; opacity:.7; }
.exam-card-title{ font-family:var(--font-mono); font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:8px; }
.exam-card-sub{ color:var(--text-dim); font-size:.85rem; margin:.35em 0 0; }
.exam-card-stat{ font-family:var(--font-mono); font-size:.72rem; color:var(--text-faint); margin-top:6px; }
.exam-intro{ border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:22px; }
.exam-intro ul{ margin:1em 0; }
.exam-result-banner{ border-radius:var(--radius); padding:18px 20px; margin-bottom:20px; border:1px solid; }
.exam-result-banner.pass{ background:color-mix(in srgb, #3aa35a 12%, var(--surface)); border-color:#3aa35a; }
.exam-result-banner.fail{ background:color-mix(in srgb, var(--sev-critical) 10%, var(--surface)); border-color:var(--sev-critical); }
.exam-result-banner h2{ margin-bottom:.2em; }
.exam-breakdown{ width:100%; border-collapse:collapse; font-size:.85rem; margin:14px 0 20px; }
.exam-breakdown th{ text-align:left; font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:6px 10px; border-bottom:1px solid var(--border); }
.exam-breakdown td{ padding:8px 10px; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums; }
.exam-breakdown-wrap{ overflow-x:auto; }

/* ---------- node list (domain view) ---------- */
.domain-header{ margin-bottom:22px; }
.overview-box{ border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:16px 18px; margin:18px 0; }
.overview-box h3{ font-size:.85rem; color:var(--text-faint); margin-bottom:.6em; }
.overview-box ul{ columns:2; column-gap:24px; }
@media (max-width:600px){ .overview-box ul{ columns:1; } }

.node-list{ display:flex; flex-direction:column; gap:10px; }
.node-card{
  display:flex; align-items:center; gap:14px; border:1px solid var(--border); background:var(--surface);
  border-radius:var(--radius); padding:14px 16px; cursor:pointer;
}
.node-card[data-locked="true"]{ opacity:.55; cursor:not-allowed; }
.node-card:not([data-locked="true"]):hover{ border-color:var(--accent-cool); }
.node-icon{ width:38px; height:38px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; font-family:var(--font-mono); }
.node-card.status-complete .node-icon{ background:#3aa35a; color:#fff; }
.node-card.status-lab .node-icon{ color:var(--sev-high); }
.node-main{ flex:1; min-width:0; }
.node-name{ font-weight:700; font-size:.92rem; }
.node-meta{ font-family:var(--font-mono); font-size:.7rem; color:var(--text-faint); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
.node-chev{ color:var(--text-faint); font-family:var(--font-mono); }

/* ---------- lesson ---------- */
.back-link{ background:none; border:none; color:var(--text-dim); font-family:var(--font-mono); font-size:.78rem; cursor:pointer; padding:0; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px; }
.back-link:hover{ color:var(--text); }
.lesson-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:6px; flex-wrap:wrap; }
.lesson-head h1{ font-size:1.5rem; margin-bottom:.15em; }
.callout{ border:1px solid var(--border); border-left:3px solid var(--accent-cool); background:var(--surface-2); border-radius:6px; padding:12px 14px; margin:16px 0; }
.callout .uc{ font-size:.68rem; color:var(--accent-cool); display:block; margin-bottom:.4em; }
.callout p:last-child{ margin-bottom:0; }
.diagram-flow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:18px 0; font-family:var(--font-mono); font-size:.78rem; }
.diagram-flow .step{ border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:8px 12px; }
.diagram-flow .arrow{ color:var(--text-faint); }
.pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
.sev-pill{ font-family:var(--font-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; padding:4px 10px; border-radius:20px; color:#fff; }
.sev-critical{ background:var(--sev-critical); } .sev-high{ background:var(--sev-high); }
.sev-medium{ background:var(--sev-medium); color:#191400; } .sev-low{ background:var(--sev-low); } .sev-info{ background:var(--sev-info); }

.lesson-cta{ margin-top:28px; border-top:1px solid var(--border); padding-top:22px; }

/* ---------- quiz ---------- */
.quiz-q{ border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); padding:16px 18px; margin-bottom:14px; }
.quiz-q p.qtext{ font-weight:700; max-width:none; margin-bottom:.8em; }
.quiz-opts{ display:flex; flex-direction:column; gap:8px; }
.quiz-opt{ text-align:left; border:1px solid var(--border); background:var(--surface-2); border-radius:6px; padding:9px 12px; cursor:pointer; font-size:.88rem; color:var(--text); }
.quiz-opt:hover{ border-color:var(--accent-cool); }
.quiz-opt.picked{ border-color:var(--accent-cool); background:color-mix(in srgb, var(--accent-cool) 12%, var(--surface-2)); }
.quiz-opt.correct{ border-color:#3aa35a; background:color-mix(in srgb, #3aa35a 18%, var(--surface-2)); }
.quiz-opt.wrong{ border-color:var(--sev-critical); background:color-mix(in srgb, var(--sev-critical) 15%, var(--surface-2)); }
.quiz-opt[disabled]{ cursor:default; }
.quiz-explain{ font-size:.8rem; color:var(--text-dim); margin-top:10px; border-top:1px dashed var(--border); padding-top:10px; display:none; }
.quiz-explain.show{ display:block; }
.quiz-footer{ display:flex; align-items:center; gap:14px; margin-top:18px; }
.quiz-score{ font-family:var(--font-mono); font-size:.85rem; color:var(--text-dim); }

/* ---------- lab / terminal ---------- */
.lab-layout{ display:grid; grid-template-columns:300px 1fr; gap:18px; align-items:start; }
@media (max-width:760px){ .lab-layout{ grid-template-columns:1fr; } }
.lab-brief{ border:1px solid var(--border); background:var(--surface); border-radius:var(--radius); padding:16px; position:sticky; top:78px; }
.lab-brief h3{ font-size:.8rem; color:var(--text-faint); margin-bottom:.6em; }
.obj-list{ list-style:none; padding:0; margin:0 0 14px; display:flex; flex-direction:column; gap:10px; }
.obj-item{ display:flex; gap:8px; align-items:flex-start; font-size:.82rem; }
.obj-check{ width:16px; height:16px; border-radius:4px; border:1px solid var(--border); flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center; font-size:.65rem; }
.obj-item.done .obj-check{ background:#3aa35a; border-color:#3aa35a; color:#fff; }
.obj-item.done .obj-text{ color:var(--text-faint); text-decoration:line-through; }
.answer-row{ display:flex; gap:6px; margin-top:14px; }
.answer-row select, .answer-row input{ font-family:var(--font-mono); font-size:.75rem; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; }
.answer-row select{ flex:none; width:56px; }
.answer-row input{ flex:1; min-width:0; }

.terminal{ border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:#0a0e13; box-shadow:var(--shadow); }
.term-head{ display:flex; align-items:center; gap:6px; padding:9px 12px; background:#161d27; border-bottom:1px solid #26313d; }
.term-dot{ width:10px; height:10px; border-radius:50%; background:#3a4655; }
.term-title{ font-family:var(--font-mono); font-size:.7rem; color:#8b9bab; margin-left:8px; }
.term-body{ height:420px; overflow-y:auto; padding:12px 14px; font-family:var(--font-mono); font-size:.8rem; color:#c9d4de; }
.term-body .ln{ white-space:pre-wrap; word-break:break-word; margin-bottom:2px; }
.term-body .ln.cmd{ color:#f2a93b; }
.term-body .ln.cmd::before{ content:"analyst@proving-grounds:~$ "; color:#4fb0c9; }
.term-body .ln.err{ color:#f0485a; }
.term-body .ln.ok{ color:#3ee08a; }
.term-body .ln.sys{ color:#5c6b7d; }
.term-input-row{ display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid #26313d; }
.term-prompt{ font-family:var(--font-mono); font-size:.8rem; color:#4fb0c9; flex:none; }
.term-input{ flex:1; background:none; border:none; outline:none; color:#e7edf4; font-family:var(--font-mono); font-size:.8rem; }

/* ---------- toast ---------- */
#toast-host{ position:fixed; top:16px; right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; }
.toast{ font-family:var(--font-mono); font-size:.8rem; background:var(--surface); border:1px solid var(--accent); color:var(--text); padding:10px 16px; border-radius:8px; box-shadow:var(--shadow); animation:toastin .2s ease; }
.toast b{ color:var(--accent); }
@keyframes toastin{ from{ transform:translateY(-8px); opacity:0; } to{ transform:translateY(0); opacity:1; } }

.file-io{ display:none; }
</style>

<div id="toast-host"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div>
      <div class="brand"><span class="path">THE </span><span class="name">PROVING GROUNDS</span><span class="cursor"></span></div>
      <div class="tagline">Cybersecurity · Cloud · Networking</div>
    </div>
    <nav class="nav" id="nav-list"></nav>
    <div class="sidebar-spacer"></div>
    <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
      <button class="btn btn-sm" data-theme-choice="auto">Auto</button>
      <button class="btn btn-sm" data-theme-choice="light">Day</button>
      <button class="btn btn-sm" data-theme-choice="dark">Night</button>
    </div>
    <div class="profile-card">
      <div class="profile-row">
        <div class="avatar" id="avatar-initials">SA</div>
        <div>
          <div class="rank-name" id="rank-name">Trainee Analyst</div>
          <div class="xp-line"><span id="xp-total">0</span> XP</div>
        </div>
      </div>
      <div class="streak">🔥 <b id="streak-count">0</b>&nbsp;day streak</div>
      <div class="io-row">
        <button class="btn" id="btn-export" style="flex:1">Export</button>
        <button class="btn" id="btn-import" style="flex:1">Import</button>
      </div>
      <input type="file" accept="application/json" class="file-io" id="file-import">
      <button class="btn" id="btn-reset" style="width:100%;margin-top:6px;color:var(--sev-critical)">Reset progress</button>
    </div>
  </aside>

  <div class="main">

var THEME_KEY = 'range_cysa_theme';
function applyTheme(choice){

  else if(choice === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');

  localStorage.setItem(THEME_KEY, choice);
}

});

  arch: [

    { q:"What SOC visibility challenge is created by widespread use of ephemeral containers?", opts:["Containers never generate logs at all","Containers can spin up and disappear in seconds, so logs must be shipped off-host immediately or they're lost","Containers only run on Windows","Containers eliminate the need for network monitoring"], correct:1,

    { q:"What is the primary purpose of a log collector/forwarder sitting between sources and the SIEM?", opts:["Permanently encrypt data at rest","Normalize and aggregate logs from multiple sources before ingestion","Replace the need for a SIEM entirely","Generate end-user alerts directly"], correct:1,

    { q:"Why is accurate time synchronization (e.g., via NTP) across log sources critical for a SOC?", opts:["It's a cosmetic requirement with no analytical impact","Without synchronized clocks, correlating events from different systems into one reliable timeline becomes unreliable","NTP is only needed for billing systems","SIEMs automatically correct unsynchronized timestamps with no downside"], correct:1,

    { q:"A serverless function's activity is visible only through the cloud provider's own audit/activity logs, with no host to log into directly. This illustrates:", opts:["Serverless functions cannot be monitored at all","Visibility shifting from host-based collection to provider-native logging in cloud-native architectures","A logging pipeline failure requiring immediate escalation","Serverless workloads never generate security-relevant events"], correct:1,

  indicators: [
    { q:"Which of these is a network-related indicator of potentially malicious activity?", opts:["A user updating their profile picture","Beaconing at regular intervals to an external host","A scheduled OS patch installation","Normal DNS resolution of internal hostnames"], correct:1,
      explain:"Regular-interval outbound connections ('beaconing') are a classic sign of malware checking in with command-and-control infrastructure." },
    { q:"A workstation shows an unexplained CPU/disk spike at 3 AM daily with no scheduled task configured to explain it. This is best classified as:", opts:["An application log indicator","A host-related resource-consumption anomaly","A social engineering indicator","Expected baseline behavior"], correct:1,
      explain:"Unexplained resource consumption on a host, especially outside business hours, is a textbook host-based indicator worth investigating." },
    { q:"A new local administrator account appears that nobody on the team provisioned. This is an example of:", opts:["Expected IT provisioning, no action needed","An account-related indicator warranting investigation","A false positive by definition","A network architecture concept"], correct:1,
      explain:"Unexplained privileged account creation is one of the highest-value indicators to chase — it's a common persistence mechanism." },
    { q:"Which best describes 'living off the land' activity analysts must watch for?", opts:["Attackers using built-in OS tools like PowerShell or WMI to blend in with normal admin activity","Attackers who only ever use custom malware never seen before","Attackers who physically break into the building","Attackers who exclusively use zero-day exploits"], correct:0,

    { q:"A SaaS application's audit log shows a bulk export of the entire customer records table at 2 AM by an account that normally only reads single records during business hours. This is an example of:", opts:["Expected end-of-month reporting behavior","An application-related indicator warranting investigation","A network architecture concept","A false positive by definition"], correct:1,
      explain:"A sudden bulk export far outside normal usage pattern, at an unusual hour, is exactly the kind of application-log anomaly that deserves a closer look." },
    { q:"An external scan probe hits a public-facing server, and thirty seconds later that same source IP successfully authenticates with valid credentials. How should severity be classified relative to the probe alone?", opts:["No change — probes and successful logins are unrelated events","Escalated significantly — a probe immediately followed by a successful authentication from the same source is a much stronger signal than either event alone", "Downgraded, since authentication proves the source is legitimate","Ignored, since successful logins are never suspicious"], correct:1,

    { q:"A link in a phishing email displays as 'yourbank.com/login' but the actual underlying URL points to a completely different domain. This is an example of:", opts:["A rogue device on the network","An obfuscated link — the displayed text masks the real destination to defeat casual inspection","A drive capacity consumption indicator","Expected email formatting behavior"], correct:1,

    { q:"An unfamiliar laptop with an unrecognized MAC address suddenly appears connected to an internal switch port. This is best classified as:", opts:["A rogue device on the network — a network-related indicator warranting investigation","Expected guest Wi-Fi behavior with no action needed","An application-related indicator","A host-related resource-consumption anomaly"], correct:0,

    { q:"A scheduled task is discovered on a server that nobody on the operations team created, silently running a script every night at 2 AM. This is an example of:", opts:["A network segmentation control","An unauthorized scheduled task — a host-related indicator often tied to persistence","A compliance report requirement","A properly documented maintenance window"], correct:1,

  toolkit: [
    { q:"What is the primary difference between a SIEM and a SOAR platform?", opts:["SIEM automates response playbooks; SOAR only stores logs","SIEM aggregates and correlates log data for detection, while SOAR orchestrates and automates response actions","They are the same product under different names","SOAR removes the need for logging entirely"], correct:1,

    { q:"Which tool would you reach for to capture and inspect raw packets on the wire?", opts:["Wireshark or tcpdump","A ticketing system","A password manager","A vulnerability scanner alone"], correct:0,

    { q:"Checking a suspicious domain against a threat intel feed for its reputation score is an example of:", opts:["Malware sandboxing","DNS/IP reputation analysis","Packet capture","SOAR playbook authoring"], correct:1,

    { q:"Why use a malware sandbox instead of executing a suspicious file directly on a production endpoint?", opts:["Sandboxes patch systems faster","Sandboxes provide an isolated environment to observe behavior without risking production systems","It's a compliance requirement with no technical reason","There is no meaningful difference"], correct:1,

    { q:"What is the primary advantage of basic scripting (Python/PowerShell/Bash) skills in a SOC workflow?", opts:["Scripts replace the need for a SIEM entirely","Scripts let an analyst pull data via API, parse logs at scale, and stitch together tools that don't natively integrate","Scripting is only useful for building malware","Scripting eliminates the need to understand log formats"], correct:1,

    { q:"Which capability specifically lets an analyst remotely isolate a compromised endpoint from the network mid-investigation?", opts:["DNS reputation lookup","EDR (Endpoint Detection & Response)","A vulnerability scanner","A malware sandbox"], correct:1,

  threatintel: [
    { q:"In the Pyramid of Pain, which indicator type is hardest for an attacker to change, making it most valuable to defenders?", opts:["Hash values","IP addresses","TTPs (Tactics, Techniques, and Procedures)","Domain names"], correct:2,

    { q:"What is the key difference between an IOC and a TTP?", opts:["They're identical terms for the same thing","IOCs are atomic artifacts like hashes/IPs, while TTPs describe behavioral patterns attackers use","TTPs expire faster than IOCs","IOCs only apply to insider threats"], correct:1,

    { q:"A hunt that starts with 'I believe attackers may be using scheduled tasks for persistence in our environment' is an example of:", opts:["Signature-based detection","Hypothesis-driven threat hunting","Passive log review only","Vulnerability scanning"], correct:1,

    { q:"What is the primary value of participating in an ISAC (Information Sharing and Analysis Center)?", opts:["Free antivirus licenses","Sharing sector-specific threat intelligence among trusted peer organizations","Outsourcing all incident response","Mandatory government reporting only"], correct:1,

    { q:"Why does a mature threat intel program track source reliability and confidence level, not just the indicator itself?", opts:["Confidence scoring is a purely cosmetic label","Not all intel sources are equally trustworthy, and acting on a low-confidence indicator as if it were certain wastes response effort or misses real threats","Every OSINT feed is automatically high-confidence","Confidence level only matters for commercial vendors, never open-source feeds"], correct:1,

    { q:"What distinguishes OSINT threat intelligence from commercial/closed-source intelligence?", opts:["OSINT is always more accurate than commercial feeds","OSINT is drawn from publicly available sources, while commercial intel is typically curated, vetted, and sold by a vendor with its own collection methods","Commercial intel is free by definition","There is no practical difference between the two"], correct:1,
      explain:"OSINT pulls from open, publicly accessible sources; commercial feeds add vendor-side collection, curation, and vetting — usually at a cost, but often with higher signal density." },
    { q:"An intrusion shows highly customized tooling, patient long-term access, and a clear focus on a specific high-value target over months. Which threat actor category does this best fit?", opts:["Script kiddie","Advanced Persistent Threat (APT)","Hacktivist","Unintentional insider"], correct:1,

    { q:"A well-meaning employee emails a sensitive file to their personal address to 'work on it over the weekend,' with no malicious intent. This is an example of:", opts:["An intentional insider threat","An unintentional insider threat","A supply chain attack","A nation-state actor"], correct:1,
      explain:"Insider threats split into intentional (deliberate harm) and unintentional (carelessness or policy violation without malicious intent) — this is squarely the latter, but still a real risk to track." },
    { q:"When evaluating threat intelligence, what do 'timeliness,' 'relevancy,' and 'accuracy' together determine?", opts:["The CVSS score of a vulnerability","The confidence level assigned to that piece of intelligence, which governs how much weight it should carry in a decision","The retention period for the data","The org chart for the intel team"], correct:1,

    { q:"What is a honeypot, and what is its primary purpose in an active defense strategy?", opts:["A decoy system designed to attract and detect attacker activity, providing early warning and insight into attacker techniques without risking real assets","A type of encrypted backup","A vulnerability scanner plugin","A compliance report template"], correct:0,
      explain:"A honeypot is a deliberate decoy — any interaction with it is inherently suspicious, since no legitimate user has a reason to touch it, making it a high-signal active-defense tripwire." }
  ],
  vulnPreview: [
    { q:"Why might a CVSS 9.8 vulnerability be a lower remediation priority than a CVSS 7.1 vulnerability?", opts:["CVSS scores are never wrong","Factors like exploit availability (EPSS), asset criticality, and exposure can outweigh raw severity", "Higher CVSS scores are always patched last by convention","CVSS already accounts for asset value"], correct:1,
      explain:"CVSS measures theoretical severity in isolation. Real prioritization layers in EPSS (likelihood of exploitation), asset criticality, and internet exposure." },
    { q:"What does EPSS estimate?", opts:["The exact financial cost of a breach","The probability a vulnerability will be exploited in the wild in the near term","The number of CVEs published per year","The patch installation time"], correct:1,

    { q:"An internet-facing server and an air-gapped lab machine share the same CVE. Which typically gets patched first?", opts:["The air-gapped lab machine","The internet-facing server, due to greater exposure","Whichever was patched last time","Neither — CVSS alone decides"], correct:1,

    { q:"An org with low risk tolerance finds a moderate-CVSS vulnerability with high EPSS on an internet-facing asset. What should happen?", opts:["Deprioritize it since CVSS is only moderate","Prioritize it highly — low risk tolerance plus real-world exploitation probability plus exposure compounds the risk","Ignore it since EPSS isn't a real standard","Wait for CVSS to increase before acting"], correct:1,

    { q:"Two internet-facing assets share the identical CVE and CVSS score. One is a decommission-pending test box; the other is the production payment gateway. Which prioritization input explains why they should NOT be patched in the same order?", opts:["EPSS only","Asset criticality","Attack Vector","Scan frequency"], correct:1,

    { q:"Why can EPSS change meaningfully for the same CVE from one week to the next?", opts:["EPSS is a static, one-time score assigned at CVE publication","EPSS is refreshed against observed real-world exploitation activity, so a CVE's exploitation probability can rise sharply once attackers start using it at scale","EPSS only updates once a year","EPSS scores never change once published"], correct:1,
      explain:"Unlike the largely static CVSS base score, EPSS is a living probability model — a CVE can jump from low to high EPSS practically overnight once exploitation activity picks up in the wild." },
    { q:"A vulnerability is discovered and actively exploited in the wild before the vendor has released any patch. This is a:", opts:["False positive","Zero-day","Compensating control","Compliance report finding"], correct:1,

      explain:"A theoretically exploitable flaw with no available exploit code is a very different real-world risk than one with a public, ready-to-run weaponized exploit — the gap between 'possible' and 'easy for anyone to use.'" },
    { q:"A finding exists only on a fully isolated, air-gapped lab network with no route to production or the internet. How should 'context awareness' classify this asset for prioritization purposes?", opts:["Internal","External","Isolated","Critical"], correct:2,

  ],
  vulnScanning: [
    { q:"What is the key difference between credentialed and non-credentialed scanning?", opts:["Credentialed scans just run faster","Credentialed scans authenticate to the host and can see far more (missing patches, local misconfigurations); non-credentialed only sees what's visible externally","Non-credentialed scans are more accurate","They are the same thing"], correct:1,

    { q:"Why would an analyst choose passive scanning over active scanning for an ICS/OT environment?", opts:["Passive scanning is always more accurate","Active scanning can send traffic that crashes fragile or legacy industrial systems, so passive (monitor-only) is safer","Passive scanning requires credentials","ICS/OT systems cannot be scanned at all"], correct:1,

    { q:"What must exist before a vulnerability scan can even be meaningfully scoped?", opts:["A CVSS calculator","An accurate asset inventory, so you know what's actually in scope","A SOAR platform","Nothing — scans are self-scoping"], correct:1,

    { q:"What problem does agent-based scanning primarily solve?", opts:["Faster network throughput","Visibility into hosts that are offline, remote/mobile, or on segmented networks the scanner can't directly reach","Replacing the need for credentials","Eliminating false positives entirely"], correct:1,

    { q:"Which factor should most directly influence how often a given asset is scanned?", opts:["Alphabetical order of hostname","Risk tolerance, regulatory requirements, and how frequently the asset's exposure or configuration changes","Every asset must be scanned on an identical fixed schedule regardless of context","Scanning frequency is not a configurable decision"], correct:1,
      explain:"A rarely-changing internal asset in a low-risk environment doesn't need the same cadence as an internet-facing system under a compliance mandate — frequency is a risk-driven decision, not a default." },
    { q:"Why do cloud and container workloads typically require image- and API-level scanning rather than a traditional network sweep?", opts:["Cloud workloads cannot be scanned under any circumstances","Ephemeral, API-driven infrastructure often has no fixed network surface to sweep the way a traditional server does — scanning has to shift to the image/manifest and provider API layer","Network scanning is always sufficient for cloud workloads","Cloud providers prohibit all forms of vulnerability scanning"], correct:1,

  ],
  vulnScanOut: [
    { q:"A scanner flags a host as vulnerable based on a banner-grab version string, but manual inspection shows the patch was actually applied and the banner just wasn't updated. This is:", opts:["A true positive","A false positive","A false negative","A true negative"], correct:1,

    { q:"Which CVSS base metric captures whether an attacker needs to be authenticated before exploiting a vulnerability?", opts:["Attack Vector","Privileges Required","User Interaction","Scope"], correct:1,

    { q:"Why is a false negative generally more dangerous to a SOC than a false positive?", opts:["False negatives take longer to write up","A false negative means a real vulnerability goes completely unaddressed because no one knows to look for it","False negatives always carry higher CVSS scores","There's no meaningful difference"], correct:1,

    { q:"What does the CVSS Attack Vector metric describe?", opts:["How much damage a successful exploit causes","The context or proximity an attacker must have to exploit the vulnerability (e.g., Network vs. Local vs. Physical)","Whether a patch currently exists","The asset's business criticality"], correct:1,
      explain:"Attack Vector answers 'how close does an attacker need to be' — Network-exploitable flaws are inherently riskier than ones requiring physical access." },
    { q:"What is the difference between a CVSS Base score and a Temporal or Environmental score?", opts:["They are the same number expressed differently","Base score is the vendor-agnostic worst case; Temporal and Environmental scores adjust that baseline for real-world exploit maturity and your specific environment","Environmental scores are always higher than Base scores","Temporal scores never change once assigned"], correct:1,
      explain:"Base is a static, context-free worst case; Temporal/Environmental layer in exploit maturity and the specifics of your own environment — which is part of why raw Base-score-only prioritization misses real-world context." },
    { q:"A scanner reports a finding with no available proof-of-concept exploit and no observed in-the-wild activity. Which CVSS component captures that nuance?", opts:["Base score alone","Temporal score, which accounts for exploit code maturity and remediation level over time","Environmental score only","None — CVSS has no way to express this"], correct:1,
      explain:"Temporal metrics specifically track things that change over a vulnerability's lifecycle, like whether working exploit code has actually surfaced." }
  ],
  vulnControls: [
    { q:"A critical patch can't be deployed immediately due to a vendor certification freeze. What's the correct interim step?", opts:["Ignore the vulnerability until the freeze ends","Apply a compensating control (e.g., a WAF rule or added segmentation) while formally documenting the exception","Deploy the patch anyway despite the freeze","Remove the asset from scan scope so it stops appearing"], correct:1,
      explain:"Compensating controls exist for exactly this gap — reduce real risk now, document the formal exception with a review date, and patch when the freeze lifts." },
    { q:"What is the purpose of testing a patch in a staging ring before production deployment?", opts:["To slow down the SOC on principle","To catch stability or compatibility issues before they affect production systems","Staging exists purely for compliance paperwork","Patches never need testing"], correct:1,
      explain:"An untested patch that breaks a production dependency can cause more damage than the vulnerability it was meant to fix." },
    { q:"Why does a mature remediation process include a post-patch verification (rescan) step?", opts:["To generate more tickets","To confirm the vulnerability is actually closed, not just assumed closed","Verification is optional once a patch is 'deployed'","To replace the original scan entirely"], correct:1,
      explain:"Deployment doesn't guarantee success — a rescan confirms the fix actually took, catching failed installs or incomplete rollouts." },
    { q:"Which of these is a secure design principle rather than a specific technical control?", opts:["Installing a particular antivirus signature","Defense in depth — layering independent controls so no single failure is catastrophic","A specific firewall rule number","A single CVE patch"], correct:1,

    { q:"What is 'risk transfer' as a remediation option?", opts:["Deleting the finding from the scan report","Shifting financial exposure (e.g., cyber insurance) without changing the underlying technical risk", "Patching the vulnerability immediately","Assigning the finding to another team without documentation"], correct:1,

    { q:"What is the minimum required for a documented risk acceptance to count as legitimate risk management rather than avoidance?", opts:["Nothing — silence is sufficient","A named owner and a review date or trigger","A CVSS score below 4.0","Verbal agreement in a hallway conversation"], correct:1,
      explain:"An exception without an owner and a review trigger isn't risk management — it's a vulnerability that got a better excuse." }
  ],
  irPreview: [
    { q:"Which NIST-aligned phase comes immediately after 'Detection & Analysis' in the incident response lifecycle?", opts:["Preparation","Containment, Eradication & Recovery","Lessons Learned","Threat Hunting"], correct:1,

    { q:"What is the main purpose of a Lessons Learned review after an incident?", opts:["To assign blame to the analyst on shift","To identify process/tooling gaps and improve future response","To close the ticket faster","To satisfy a purely optional formality"], correct:1,

    { q:"Why does an organization maintain incident response playbooks in advance?", opts:["To slow down responders with paperwork","To pre-define consistent, tested steps so response isn't improvised under pressure","Playbooks are only required for compliance audits","To replace the need for a SOC"], correct:1,

    { q:"Which activity happens during the Preparation phase, before any incident occurs?", opts:["Root cause analysis","Building and testing IR playbooks, contact trees, and tooling access","Eradicating malware from a host","Notifying customers of a breach"], correct:1,

    { q:"According to NIST SP 800-61, which phase directly follows Preparation?", opts:["Post-Incident Activity","Detection & Analysis","Containment, Eradication & Recovery","There is no defined next phase"], correct:1,

  irFrameworks: [
    { q:"In the Cyber Kill Chain, which stage represents the attacker establishing a persistent foothold on a compromised system?", opts:["Weaponization","Delivery","Installation","Actions on Objectives"], correct:2,
      explain:"Installation is where the attacker plants something durable — a backdoor or persistence mechanism — to survive a reboot or maintain access." },
    { q:"What is the defensive principle behind the Cyber Kill Chain model?", opts:["All seven stages must be stopped simultaneously or the model fails","Breaking the chain at any single stage stops the overall attack, and earlier stages are cheaper to stop","It only applies to nation-state attackers","It replaces the need for detection tooling"], correct:1,
      explain:"Defenders don't need to catch everything at every stage — stopping the attack at its earliest, cheapest stage is the whole point of thinking in a kill-chain model." },
    { q:"In the Diamond Model of Intrusion Analysis, which four core features are connected to describe a single event?", opts:["Reconnaissance, Weaponization, Delivery, Installation","Adversary, Infrastructure, Capability, Victim","Confidentiality, Integrity, Availability, Authenticity","Preparation, Detection, Containment, Recovery"], correct:1,
      explain:"The Diamond Model links Adversary, Infrastructure, Capability, and Victim — useful for pivoting across related indicators, not just describing one timeline." },
    { q:"How does MITRE ATT&CK differ structurally from the Cyber Kill Chain?", opts:["ATT&CK is a linear 7-stage timeline just like the Kill Chain","ATT&CK is a matrix of tactics and techniques used as a shared vocabulary and coverage map, not a strict linear sequence","ATT&CK only covers nation-state actors","They are functionally identical frameworks"], correct:1,
      explain:"ATT&CK is organized as tactics (the why) crossed with techniques (the how) — built for mapping detection coverage and comparing incidents, not narrating one attack start to finish." },
    { q:"An analyst knows the infrastructure (a specific C2 domain) used in one confirmed incident and wants to find every other victim tied to that same adversary. Which framework's core strength directly supports this?", opts:["The Cyber Kill Chain","The Diamond Model, by pivoting across the Infrastructure feature to related Victim and Capability data","ATT&CK tactics alone","None of these frameworks support pivoting"], correct:1,
      explain:"The Diamond Model's four linked features (Adversary, Infrastructure, Capability, Victim) are built exactly for this kind of pivot — start from one known feature and traverse to related activity." },
    { q:"Why is 'breaking the chain early' emphasized in Kill Chain-based defensive thinking?", opts:["Later stages are always easier and cheaper to stop","Stopping an attack at an earlier stage (e.g., Delivery) is both cheaper and prevents all the damage of every stage that would have followed","The Kill Chain has no preference for when an attack is stopped","Only the final stage, Actions on Objectives, is worth defending against"], correct:1,
      explain:"A phishing email blocked at Delivery never costs you the cleanup, damage, or investigation of a full Actions-on-Objectives incident — earlier is strictly cheaper." },
    { q:"What do OSSTMM and the OWASP Testing Guide provide, as distinct from Kill Chain/Diamond Model/ATT&CK?", opts:["They are attacker-behavior frameworks for describing an intrusion after the fact","They are structured testing methodologies — OSSTMM for general security testing, the OWASP Testing Guide for web applications specifically — used to plan and execute assessments rather than analyze completed attacks", "They are incident report templates","They are compliance certification bodies"], correct:1,
      explain:"OSSTMM and the OWASP Testing Guide are methodology documents for how to conduct a security test — a different purpose than the attacker-behavior frameworks (Kill Chain, Diamond Model, ATT&CK) used to describe or analyze an intrusion." }
  ],
  irContainment: [
    { q:"Why might a responder choose short-term containment (e.g., network isolation) over immediately eradicating malware?", opts:["Short-term containment is always faster regardless of context","It buys time and limits spread while preserving evidence and situational awareness before acting further","Eradication is never appropriate during an active incident","There's no meaningful difference between the two"], correct:1,
      explain:"Isolating first stops the bleeding without tipping your hand or destroying evidence — eradication comes once you actually understand the scope." },
    { q:"What is a risk of eradicating an attacker's presence before fully scoping the incident?", opts:["It always improves recovery time","You may miss additional footholds or persistence mechanisms planted elsewhere","Eradication is risk-free once any containment has happened","It guarantees a clean recovery"], correct:1,
      explain:"An attacker who established multiple footholds will simply use the one you didn't find yet if you eradicate before you've scoped the full extent of the compromise." },
    { q:"What does the recovery phase specifically validate before an incident is declared closed?", opts:["That the ticket was filed correctly","That systems are actually clean and monitored closely for reinfection before fully returning to normal operations","That the attacker has been identified and arrested","Recovery has no validation step"], correct:1,
      explain:"Recovery isn't just 'turn it back on' — it includes confirming the fix held and watching closely for signs the attacker is still present." },
    { q:"An organization isolates a compromised host from the network but has not yet removed the malware from it. This best describes:", opts:["Eradication","Short-term containment","Recovery","Preparation"], correct:1,
      explain:"Isolating without yet removing the threat is exactly what short-term containment means — buy time and stop spread, deal with full removal next." },
    { q:"What distinguishes long-term containment from short-term containment?", opts:["Long-term containment is simply short-term containment done for a longer time period","Long-term containment takes further action like rebuilding from known-good images and rotating broadly-compromised credentials, beyond just buying time","There is no meaningful difference between the two","Long-term containment happens before short-term containment"], correct:1,
      explain:"Short-term containment stops the bleeding; long-term containment starts actively closing the gap — rebuilding systems and rotating credentials — while still short of full eradication." },
    { q:"After a system is brought back online post-recovery, what should continue to happen?", opts:["Nothing further is needed once systems are back online","Close monitoring for signs of reinfection, since a clean-looking recovery isn't a guarantee the root cause is fully closed","The incident ticket should be deleted immediately","Recovery only applies to backups, not live systems"], correct:1,
      explain:"A disciplined recovery treats 'back online' as the start of a monitoring window, not the end of the incident — reinfection after a rushed recovery is common enough to watch for deliberately." },
    { q:"A compromised workstation is wiped and rebuilt from a known-good golden image rather than having malware manually removed file by file. This recovery approach is called:", opts:["Re-imaging","Short-term containment","Preparation","Root cause analysis"], correct:0,
      explain:"Re-imaging wipes a system back to a trusted baseline rather than trying to surgically remove every trace of compromise — often faster and more reliably complete than manual cleanup." }
  ],
  irPrepPost: [
    { q:"What is the primary purpose of a tabletop exercise?", opts:["To physically test backup generators","To walk a team through a simulated incident scenario and find gaps in the IR plan before a real incident does","To replace the need for playbooks entirely","It's purely a compliance checkbox with no operational value"], correct:1,
      explain:"A tabletop exercise is a rehearsal — it's far cheaper to discover a gap in your plan on a Tuesday afternoon than during an actual incident at 2 AM." },
    { q:"How do business continuity (BC) and disaster recovery (DR) planning fit into the Preparation phase?", opts:["They belong to Post-Incident Activity, not Preparation","They're prepared in advance so the organization can keep critical operations running (BC) and restore systems/data (DR) after a major disruption, rather than improvising both during the incident", "BC/DR planning is unrelated to incident response entirely","They're only relevant for natural disasters, never cyber incidents"], correct:1,
      explain:"BC/DR plans — like playbooks and tooling access — are built calmly in advance so an organization isn't improvising how to keep the business running or restore systems while an incident is actively unfolding." },
    { q:"What distinguishes an IR playbook/runbook from the overall IR plan?", opts:["They are identical documents with different names","The playbook gives step-by-step tactical actions for a specific incident type, while the plan defines overall roles, escalation, and process","Playbooks are only used after an incident closes","Plans are optional if playbooks exist"], correct:1,
      explain:"The plan is the strategic skeleton (who does what, who to call); playbooks are the tactical muscle memory for a specific scenario like ransomware or phishing." },
    { q:"Why track metrics like MTTD (mean time to detect) and MTTR (mean time to respond)?", opts:["They're legally mandated in every jurisdiction","They give an objective, trackable signal of whether the detection and response program is actually improving over time","They replace the need for root cause analysis","They only matter for a manager's performance review"], correct:1,
      explain:"Without a number to track, 'we're getting better at IR' is just a feeling. MTTD/MTTR turn program maturity into something measurable over time." },
    { q:"Why does evidence retention and chain of custody matter during an incident?", opts:["It's just paperwork with no real consequence","Properly documented, preserved evidence may be needed for legal action, regulatory reporting, or insurance claims, and gaps can make it unusable","It only applies to physical evidence, never digital","It's solely law enforcement's responsibility, not the SOC's"], correct:1,
      explain:"A broken chain of custody can make otherwise solid evidence worthless in a legal, regulatory, or insurance context — documentation discipline during the incident is what preserves its value later." },
    { q:"What makes a lessons-learned review 'blameless' by design?", opts:["No one is allowed to attend except management","It focuses on process and tooling gaps rather than which individual made a mistake, so people report honestly instead of covering up details", "It skips discussing what actually went wrong","Blameless means no changes are ever recommended"], correct:1,
      explain:"A review focused on assigning fault teaches people to hide details next time; a blameless review focused on process gaps gets the honest information needed to actually improve." },
    { q:"An incident's root cause is identified as 'the mail gateway wasn't sandboxing macro-enabled attachments,' rather than 'a user clicked a link.' Why does this distinction matter for preparation?", opts:["It doesn't — both statements are equally actionable","The deeper root cause points to a fixable systemic gap, while the surface trigger only describes what happened this one time","User training is never worth pursuing as a fix","Root cause statements are only used for legal purposes"], correct:1,
      explain:"'A user clicked a link' will happen again regardless of training; fixing the sandboxing gap actually closes the door that let the click matter in the first place." }
  ],
  reportPreview: [
    { q:"When writing a vulnerability finding for an executive audience, what should lead the report?", opts:["Raw scanner output and CVE IDs","Business impact and risk in plain language, with technical detail available after","A full packet capture appendix only","Nothing — executives only read dashboards"], correct:1,
      explain:"Executive stakeholders need risk framed in business terms first; technical detail should support, not open, the narrative." },
    { q:"What is the goal of root cause analysis in an incident report?", opts:["To identify who to discipline","To determine the underlying condition that allowed the incident, not just the symptom","To close the report as quickly as possible","To avoid mentioning the timeline"], correct:1,
      explain:"RCA looks past the immediate trigger to the underlying gap (a missing control, a misconfiguration) so it can actually be fixed." },
    { q:"Which audience typically needs the MOST technical detail in an incident communication?", opts:["Board of directors","Legal/PR team","The engineering team performing remediation","External customers"], correct:2,
      explain:"Different stakeholders need different altitudes of the same story — remediation engineers need the technical specifics; execs and customers need impact and next steps." },
    { q:"What should lead an incident update intended for a non-technical stakeholder?", opts:["Raw log excerpts","Business impact and next steps in plain language","A full CVE list","Nothing — non-technical stakeholders get no report"], correct:1,
      explain:"Every audience gets the same underlying facts, but the altitude changes — non-technical stakeholders need impact and action, not raw technical artifacts." },
    { q:"Two reports describe the same incident — one for the board, one for the remediation team. What should stay consistent between them?", opts:["Nothing — they should tell different stories entirely","The underlying timeline and facts, even though the level of technical detail differs by audience","Only the executive summary needs to be accurate","The remediation team's report should omit the root cause"], correct:1,
      explain:"Different altitudes of detail are fine and expected; different facts are not — a board report and an engineering report about the same incident must agree on what actually happened." },
    { q:"Why is 'the account was compromised' considered a symptom rather than a root cause?", opts:["It's actually a complete root cause on its own","It describes what happened without explaining the underlying condition that allowed it — e.g., missing MFA — which is what actually needs fixing","Symptoms and root causes are interchangeable terms","Root causes are only relevant for vulnerability reports, not incidents"], correct:1,
      explain:"A symptom tells you the outcome; a root cause tells you the gap to close so it doesn't happen again. 'MFA wasn't enforced' is fixable — 'the account was compromised' just restates the incident." }
  ],
  reportVuln: [
    { q:"Which of these best describes a 'compliance report' as distinct from a standard technical vulnerability report?", opts:["It's identical to a technical report, just renamed","It's structured to satisfy a specific framework or auditor's required fields — often narrower in audience and more checklist-driven","It never includes remediation status","It's only ever used internally, never shared externally"], correct:1,
      explain:"A compliance report exists to prove due diligence to a specific auditor or framework, so its structure is dictated by that framework's required fields rather than general readability." },
    { q:"A finding is documented as 'Accepted' rather than remediated. What MUST accompany that decision for it to be legitimate risk management rather than avoidance?", opts:["Nothing — acceptance requires no documentation","A named owner and a review date or trigger","A CVSS score above 9.0","Approval from the scanner vendor"], correct:1,
      explain:"An exception without an owner and a review trigger isn't risk management — it's a vulnerability that got a better excuse, as covered back in the controls lesson." },
    { q:"Why track Mean Time to Remediate (MTTR) as a KPI rather than just the current open-vulnerability count?", opts:["MTTR is easier to calculate","A snapshot count doesn't show whether the program is actually getting faster over time — MTTR trends do","MTTR replaces the need for CVSS entirely","MTTR only matters to executives, never analysts"], correct:1,
      explain:"A single count is a snapshot; a trend line is a story. MTTR (and metrics like it) let a program prove improvement, not just report a current state." },
    { q:"What is the risk of a vulnerability report that lists only CVE IDs and CVSS scores with no business context?", opts:["Nothing — that's sufficient for any audience","Non-technical stakeholders can't act on it, and remediation prioritization stalls without exposure/asset context","It's actually the ideal format for every audience","CVEs alone always guarantee fast remediation"], correct:1,
      explain:"Without exposure, asset criticality, or business impact attached, a raw CVE list is data, not information — nobody can prioritize or act on it confidently." },
    { q:"A vulnerability report recommends 'Mitigate' rather than 'Remediate' for a specific finding. What does that mean?", opts:["The finding is being ignored entirely","A compensating control (e.g., a WAF rule or added segmentation) is reducing real-world risk while a full fix is still pending","The finding has been proven to be a false positive","Mitigate and Remediate mean exactly the same thing"], correct:1,
      explain:"Mitigate specifically means the underlying flaw isn't fixed yet, but a compensating control is actively reducing exploitability in the meantime — distinct from Remediate (patched) or Accept (documented and left as-is)." },
    { q:"Why does 'aging of open critical findings' matter as a tracked metric, beyond just the current open count?", opts:["It doesn't matter — only the current snapshot count is meaningful","A critical finding open for 90+ days signals a process breakdown that a same-day snapshot count would hide", "Aging metrics are only relevant to compliance auditors","Older findings are automatically lower risk"], correct:1,
      explain:"A snapshot count can look stable while individual findings quietly age past any reasonable SLA — aging surfaces exactly the findings a healthy program should be embarrassed are still open." },
    { q:"A critical patch can't be applied because the vendor contract's SLA guarantees a maintenance window only once per quarter. This is an example of:", opts:["A compensating control","An inhibitor to remediation (SLA-driven)","A false positive","A compliance report requirement"], correct:1,
      explain:"SLAs, MOUs, organizational governance, business process interruption risk, and legacy/proprietary system constraints are all named inhibitors — real-world reasons remediation can't just happen on the analyst's preferred timeline." },
    { q:"A finding can't be remediated because the only system running the vulnerable software is a legacy proprietary appliance the vendor no longer supports or allows to be modified. Which inhibitor category does this represent?", opts:["Degrading functionality","Legacy/proprietary systems","Business process interruption","Organizational governance"], correct:1,
      explain:"Legacy and proprietary systems are called out specifically as remediation inhibitors — sometimes there's no supported patch path at all, only compensating controls or eventual replacement." },
    { q:"Patching a specific vulnerability would break a critical, revenue-generating business process that depends on the current (vulnerable) configuration. This inhibitor is best classified as:", opts:["Business process interruption","A memorandum of understanding (MOU)","Degrading functionality","A service-level agreement (SLA)"], correct:0,
      explain:"Business process interruption is its own named inhibitor — sometimes the technically correct fix has a real, quantifiable operational cost that has to be weighed and communicated, not silently ignored." }
  ],
  reportIR: [
    { q:"What is the difference between a trigger event and a root cause in an incident report?", opts:["They're the same thing, just different words","The trigger is the immediate action that set off the incident; the root cause is the underlying condition that allowed it to succeed","Root cause only applies to insider-threat incidents","Triggers are always technical, root causes are always human error"], correct:1,
      explain:"'A user clicked a link' is the trigger. 'Email attachments weren't being sandboxed' is the root cause — the distinction is what actually gets fixed." },
    { q:"Why might regulatory breach notification deadlines matter as much as the technical response itself?", opts:["They don't — only technical response matters","Many jurisdictions impose strict, legally binding notification windows, and missing them creates separate legal exposure beyond the breach itself","Notification deadlines are always optional guidelines","Only law enforcement cares about notification timing"], correct:1,
      explain:"Missing a regulatory clock doesn't just look bad — it can trigger fines and legal consequences independent of the underlying incident." },
    { q:"Why might an incident report prepared at legal counsel's direction be handled differently (e.g., marked privileged)?", opts:["It's just a formatting preference with no real effect","It may be protected under attorney-client privilege, which affects who can access it and how casually it's shared — mishandling it can waive that protection","Privilege only ever applies to verbal conversations","All incident reports are automatically privileged regardless of preparation"], correct:1,
      explain:"Privilege is easy to waive by accident — forwarding a privileged draft outside the intended circle can strip the legal protection it was meant to have." },
    { q:"What should an incident report's evidence references include to remain defensible later?", opts:["Just a narrative summary, no references needed","Clear references to preserved evidence (logs, images) with intact chain-of-custody notes","Evidence never needs to be referenced in the written report","Only law enforcement needs evidence references"], correct:1,
      explain:"A report is only as strong as the evidence trail behind it — clear references with unbroken custody are what make findings hold up under later scrutiny." },
    { q:"An incident report is prepared at the direction of legal counsel and marked privileged. What is the practical effect of forwarding a draft to a colleague outside the response team \"just to keep them in the loop\"?", opts:["No effect — privilege can never be lost once granted","It can waive attorney-client privilege, since sharing outside the intended circle undermines the confidentiality privilege depends on","It automatically extends privilege to that colleague","Privilege only applies to verbal statements, so this has no effect"], correct:1,
      explain:"Privilege is fragile — casual forwarding outside the circle counsel intended can strip the legal protection the document was meant to have." },
    { q:"Why do regulatory breach notification windows function as compliance requirements rather than courtesies?", opts:["They are polite suggestions with no enforcement behind them","Missing a legally mandated notification deadline can trigger fines and legal consequences independent of the breach itself","Notification windows are set entirely at the company's discretion","Only law enforcement, never regulators, sets these windows"], correct:1,
      explain:"A missed statutory notification deadline is its own compliance failure — separate from, and in addition to, whatever damage the underlying incident caused." },
    { q:"What is 'incident declaration,' and why does it matter as a distinct step?", opts:["An informal, undocumented judgment call left to whoever notices something odd","The formal act of classifying an event as an actual incident, which triggers the IR plan, escalation path, and stakeholder notification — a deliberate gate, not an assumption", "A synonym for the final incident report","A step that only applies after an incident is already fully resolved"], correct:1,
      explain:"Declaring an incident is what formally starts the clock — it triggers escalation, resourcing, and notification obligations, so treating it as a deliberate decision (not an assumption) matters." },
    { q:"When is it appropriate to involve law enforcement in incident communications?", opts:["Never — law enforcement involvement is always counterproductive","When the incident involves criminal activity (e.g., extortion, theft of funds, certain data breaches) where legal counsel determines reporting is warranted or required", "Only after the incident report is fully published externally","Law enforcement must always be contacted before any internal containment action"], correct:1,
      explain:"Law enforcement involvement is a judgment call usually made with legal counsel, typically triggered by criminal activity like extortion or theft — it's one of the named communication channels alongside legal, PR, and regulators, not an automatic first step." }
  ],
  reportDisclosure: [
    { q:"Why is speculating publicly about an incident's scope before facts are confirmed risky?", opts:["Speculation is always accurate so there's no risk","An early inaccurate statement that later proves wrong is worse than a delayed accurate one, and can create legal/reputational exposure","There's no risk to early speculation","Regulators require immediate speculation before facts are known"], correct:1,
      explain:"'We believe no customer data was affected' followed by a correction is far more damaging than a delayed, accurate statement — get it right before you say it publicly." },
    { q:"Why should technical staff avoid discussing incident specifics in a public-facing support ticket or status page?", opts:["Public tickets are always fully encrypted so it doesn't matter","It can inadvertently release sensitive details before legal and PR have coordinated the official communication","Public tickets are the correct venue for incident specifics","There's no meaningful difference between public and internal channels"], correct:1,
      explain:"A well-meaning technical update posted publicly can leak scope, internal hostnames, or root cause details before anyone decided that should be public." },
    { q:"What generally determines 'who must be notified, and within what window' after a data breach?", opts:["It's entirely up to the company's preference","Jurisdiction- and data-type-specific regulatory requirements, which can be legally binding","Only the CEO decides with no external constraints","Law enforcement always makes this decision alone"], correct:1,
      explain:"Disclosure obligations are frequently dictated by law, not judgment calls — different regions and data types carry different mandatory windows." },
    { q:"An employee outside the identified incident response team asks a responder for details out of curiosity. What's the correct response?", opts:["Share full details since they're a trusted coworker","Decline and redirect them to the incident's identified communication channel or need-to-know list","Give them a summary since they technically work at the company","Ask them to sign an NDA on the spot, then share everything"], correct:1,
      explain:"Need-to-know discipline applies inside the building too — being a coworker isn't the same as being on the distribution list." },
    { q:"A support engineer, trying to be helpful, posts on a public status page that the incident was caused by \"an unpatched VPN appliance at IP 203.0.113.44 running firmware v2.1.\" What's the problem with this update?", opts:["Nothing — transparency is always the right call regardless of detail level","It leaks specific technical detail (IP, firmware version) that could help an attacker or competitor, and wasn't coordinated with legal/PR first","Status pages should never mention incidents at all, even vaguely","The engineer should have used more technical detail, not less"], correct:1,
      explain:"Specific exploitable detail on a public page is exactly the kind of leak disclosure discipline exists to prevent — customer-facing updates should route through coordinated messaging, not go out raw from whoever is on-call." },
    { q:"Which best describes the right posture when facts about an active incident are still unconfirmed but stakeholders are pressing for an update?", opts:["Say whatever sounds reassuring to buy time","Communicate what is confirmed, be explicit about what's still under investigation, and avoid speculating on unconfirmed scope","Stay completely silent until the investigation fully closes, no matter how long that takes","Let each individual responder decide what to say to whoever asks"], correct:1,
      explain:"The goal isn't silence or speculation — it's an accurate, scoped statement that says what's known, flags what isn't yet, and avoids the kind of premature claim that has to be walked back later." }
  ],
  phishing: [
    { q:"An email header shows 'spf=fail' for the sending domain. What does this indicate?", opts:["The email was successfully encrypted in transit","The sending server's IP is not authorized to send mail on behalf of the claimed domain — a strong spoofing indicator","The recipient's mailbox is full","SPF failures are purely cosmetic and carry no security meaning"], correct:1,
      explain:"SPF (Sender Policy Framework) publishes which mail servers are allowed to send for a domain. A fail means the sending IP isn't on that authorized list — classic spoofing behavior." },
    { q:"What does DKIM verify, as distinct from SPF?", opts:["That the sending IP is on an authorized list","That the message content and key headers weren't altered in transit, via a cryptographic signature tied to the sending domain","That the recipient opened the email","That the email passed antivirus scanning"], correct:1,
      explain:"DKIM (DomainKeys Identified Mail) uses a cryptographic signature to prove the message wasn't tampered with and genuinely originated from a server holding the domain's private key — a different guarantee than SPF's IP allow-listing." },
    { q:"What does a DMARC policy of 'reject' instruct a receiving mail server to do with a message that fails both SPF and DKIM alignment?", opts:["Deliver it to the inbox as normal","Refuse to deliver the message at all, rather than deliver it or merely flag it","Forward it to the domain's IT team for manual review","Automatically reply to the sender asking for verification"], correct:1,
      explain:"DMARC 'reject' is the strictest enforcement level — instead of quarantining (spam folder) or taking no action, the receiving server drops messages that fail alignment entirely." },
    { q:"A phishing email is sent from 'paypa1-support.com' impersonating a legitimate brand. What technique is this?", opts:["SQL injection","Homograph/typosquatting domain spoofing","DNS cache poisoning","Cross-site scripting"], correct:1,
      explain:"Substituting a visually similar character (the digit '1' for a lowercase 'l', or a lookalike domain) to impersonate a trusted brand is a classic typosquatting/homograph technique used to defeat casual visual inspection." },
    { q:"Why is a mismatch between an email's 'From' display name and its actual 'Reply-To' or return-path address a red flag?", opts:["It's a normal artifact of most legitimate mail systems and means nothing","A legitimate-looking display name paired with a suspicious reply address is a common technique to get a reply routed somewhere the victim doesn't expect", "Display names and reply addresses are always identical by protocol design","This mismatch only matters for text messages, not email"], correct:1,
      explain:"Attackers spoof the friendly display name (what the victim sees at a glance) while routing actual replies to an attacker-controlled address — checking headers, not just the display name, catches this." },
    { q:"What is the primary purpose of sandboxing a suspicious email attachment before a user opens it?", opts:["To make the email load faster","To observe what the attachment actually does (file writes, network calls) in isolation before it can affect a real endpoint","Sandboxing attachments is not a real security practice","To automatically reply to the sender"], correct:1,
      explain:"Detonating an unknown attachment in an isolated sandbox reveals its real behavior with zero risk to production endpoints — the same principle covered earlier for general malware analysis, applied specifically to email." }
  ],
  cloudvuln: [
    { q:"Under the cloud shared responsibility model, who is typically responsible for securing IAM configuration and data access policies in an IaaS/PaaS deployment?", opts:["The cloud provider handles this entirely","The customer — providers secure the underlying infrastructure, but access control and data configuration are the customer's responsibility","No one — cloud platforms are secure by default with no configuration needed","This split doesn't exist; responsibility is always 100% the provider's"], correct:1,
      explain:"The shared responsibility model splits duties: the provider secures 'of the cloud' (physical infrastructure, hypervisor), while the customer secures 'in the cloud' (IAM policy, data classification, workload configuration)." },
    { q:"A storage bucket is discovered configured with public read access, exposing internal documents to anyone with the URL. What category of finding is this?", opts:["A CVE requiring a vendor patch","A cloud misconfiguration — a control that exists but was set incorrectly, not a software flaw needing a patch","A false positive by definition","An issue that only affects on-premises storage, not cloud"], correct:1,
      explain:"Misconfigurations (as opposed to CVEs) are usually the leading cause of cloud data exposure — the control existed, it was just set wrong, and no patch fixes a policy setting." },
    { q:"Why does an over-permissive IAM role (e.g., a service account granted full administrative access when it only needs to read one bucket) represent elevated risk?", opts:["It has no security implication as long as credentials aren't leaked","It violates least privilege — if that identity is ever compromised, the blast radius is everything the role can touch, not just what it actually uses","Overly broad roles always run faster","IAM roles cannot be scoped more narrowly than 'admin' in modern clouds"], correct:1,
      explain:"Least privilege means granting exactly what's needed — an over-scoped role turns a single compromised credential into a much larger incident than necessary." },
