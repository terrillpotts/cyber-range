capstone4report: {
  title:"CAPSTONE: The Breach Notification",
  briefHtml:"<p>A draft public statement is about to go out — before Legal or PR have seen it. Four files: <code>incident_facts.txt</code>, <code>regulatory_reference.txt</code>, <code>draft_statement_v1.txt</code>, <code>comms_log.txt</code>. Catch what's wrong before it's caught for you.</p>",
  files: {
"incident_facts.txt":
"Third-party vendor account (analytics-sync-svc) compromised via credential reuse; used to access a customer database export.\n"+
"Export included: customer email addresses (all ~40,000 affected customers) and PARTIAL payment card data (last 4 digits + expiration, no full PAN, no CVV) for approximately 12,000 of those customers.\n"+
"Discovered by SOC 6 days after initial access, via an anomalous export-volume alert.\n"+
"Affected customers are located in State A, State B, and the EU (GDPR-scope).\n",
"regulatory_reference.txt":
"State A: notify affected residents within 30 days of discovery.\n"+
"State B: notify affected residents within 45 days of discovery.\n"+
"EU (GDPR-scope customers): notify the supervisory authority within 72 hours of becoming aware, where feasible.\n",
"draft_statement_v1.txt":
"DRAFT (not yet reviewed) - prepared by engineering on-call, intended for the public status page:\n"+
"'We detected unusual activity on analytics-sync-svc-03.corp.internal. No payment data was affected. We are investigating and will share updates soon.'\n",
"comms_log.txt":
"14:02 | on-call engineer drafted draft_statement_v1.txt and requested access to publish it to the public status page\n"+
"14:05 | SOC lead intercepted the request before publish — draft had not been reviewed by Legal or PR\n"
  },
  objectives:[
    { id:1, prompt:"Given regulatory_reference.txt, which deadline is the MOST time-sensitive that the response team must hit?", accept:["72 hours","gdpr","eu","72hr","72-hour","72"], xp:100, hint:"cat regulatory_reference.txt — compare the three windows." },
    { id:2, prompt:"What is factually wrong or premature about draft_statement_v1.txt regarding payment data?", accept:["no payment data","claims no payment data affected","says no card data affected","incorrect claim","speculation","payment data was affected"], xp:100, hint:"Compare the draft's claim against incident_facts.txt directly." },
    { id:3, prompt:"Who should have reviewed draft_statement_v1.txt before it went anywhere near a public status page?", accept:["legal","legal and pr","legal/pr","pr","legal and marketing"], xp:100, hint:"Think back to the disclosure lesson — who coordinates official external communication?" },
    { id:4, prompt:"What disclosure risk does including the internal hostname in the draft create?", accept:["inadvertent disclosure","information leak","reveals internal infrastructure","leaks internal details","technical details exposed","hostname leak"], xp:100, hint:"That hostname was never meant for a public audience." },
    { id:5, prompt:"Approximately how many customers are affected, per incident_facts.txt?", accept:["40000","40,000","~40000","40k"], xp:100, hint:"cat incident_facts.txt" }

phishingLab: {
  title:"LAB: Phishing Header Forensics",
  briefHtml:"<p>A finance user reports a suspicious 'invoice overdue' email. You have the raw <code>headers.txt</code> and the message body <code>body.txt</code>. Pull it apart and decide if this is real.</p>",
  files: {
"headers.txt":
"From: Billing Dept <billing@paypa1-invoices.com>\n"+
"Reply-To: collections-support@secure-verify-billing.net\n"+
"Return-Path: <bounce@103.45.67.201.mail-relay-x9.net>\n"+
"To: jsanders@corp-victim.com\n"+
"Subject: INVOICE #88231 OVERDUE - Immediate Action Required\n"+
"Received: from mail-relay-x9.net (103.45.67.201) by mx.corp-victim.com\n"+
"Authentication-Results: mx.corp-victim.com;\n"+
"  spf=fail (sender IP 103.45.67.201 is not authorized to send for paypa1-invoices.com)\n"+

"X-Attachment: invoice_88231.xlsm (macro-enabled)\n",

    { id:1, prompt:"What is the sending domain actually trying to impersonate? (the real, correctly-spelled brand/domain name)", accept:["paypal","paypal-invoices.com","paypal.com"], xp:50, hint:"Look closely at 'paypa1-invoices.com' — what character was swapped?" },
    { id:2, prompt:"What does the SPF result in the Authentication-Results header tell you?", accept:["fail","spf fail","not authorized","ip not authorized"], xp:50, hint:"cat headers.txt and check the spf= result." },

    { id:4, prompt:"What should happen to invoice_88231.xlsm before anyone determines whether it's safe?", accept:["sandbox","detonate in sandbox","sandboxed","analyzed in a sandbox","isolated analysis"], xp:75, hint:"Same principle as general malware analysis — never open a suspicious macro-enabled file directly." },
    { id:5, prompt:"Why doesn't the dmarc=fail result here actually block this email from reaching the inbox?", accept:["action=none","policy is none","dmarc policy set to none","p=none"], xp:100, hint:"Check the action= value next to dmarc= in headers.txt — DMARC failing and DMARC enforcing are two different things." }

forensicsLab: {
  title:"LAB: Preserve the Evidence",
  briefHtml:"<p>A compromised laptop was seized for investigation. Three files: <code>custody_form.txt</code>, <code>acquisition_log.txt</code>, <code>hash_verification.txt</code>. Confirm whether this evidence will actually hold up.</p>",
  files: {
"custody_form.txt":
"Item: Dell Latitop laptop, asset tag CORP-4471\n"+
"14:02 | Seized by: M.Chen (IR analyst) | Location: employee desk, Building 2\n"+
"14:02-16:40 | Transported to: forensic workstation, IR lab | Handler: M.Chen\n"+
"16:40 | Custody form NOT signed at handoff. Laptop left unattended on IR lab bench overnight (16:40-08:00) with lab door unlocked.\n"+
"08:00 | Imaging began | Handler: M.Chen\n",
"acquisition_log.txt":
"08:00 | Write blocker attached to laptop's drive before any access\n"+
"08:04 | RAM capture completed FIRST (4,096 MB captured)\n"+
"08:19 | Full disk image acquisition started\n"+
"09:47 | Full disk image acquisition completed (500GB, dd format)\n",
"hash_verification.txt":
"At acquisition (09:47): SHA-256 = 6f2a9c1e...d834\n"+
"Verification re-hash (09:50, immediately after copy to evidence server): SHA-256 = 6f2a9c1e...d834\n"+
"Verification re-hash (next day, before analysis): SHA-256 = 6f2a9c1e...d834\n"

  objectives:[
    { id:1, prompt:"What did the analyst correctly capture FIRST, before the disk image, and why?", accept:["ram","memory","ram capture","volatile memory"], xp:75, hint:"cat acquisition_log.txt — order of volatility says the most volatile evidence goes first." },
    { id:2, prompt:"What tool was used to ensure the disk imaging process itself couldn't alter the original drive?", accept:["write blocker"], xp:50, hint:"Check the first line of acquisition_log.txt." },
    { id:3, prompt:"What do the three matching hash values in hash_verification.txt prove?", accept:["integrity","image wasnt altered","image unaltered","evidence integrity","not tampered with"], xp:75, hint:"A hash that matches at every checkpoint proves the image is still bit-for-bit identical to what was first acquired." },
    { id:4, prompt:"What is the specific chain-of-custody gap in custody_form.txt that could undermine this evidence later?", accept:["unsigned handoff","laptop left unattended","unlocked room overnight","form not signed","unattended overnight","unsecured overnight"], xp:100, hint:"cat custody_form.txt — look at what happened between 16:40 and 08:00." },
    { id:5, prompt:"Even though the technical image is sound (per the hashes), what could the custody gap alone jeopardize?", accept:["admissibility","credibility","usability in court","legal usability","evidence being thrown out","evidence credibility"], xp:100, hint:"A sound technical image doesn't fix a broken documented chain of custody — think about what a defense attorney or auditor would seize on." }

  title:"LAB: Build the Executive Brief",
  briefHtml:"<p>Leadership wants a 5-minute update on program health. Files: <code>raw_metrics.txt</code> and <code>program_history.txt</code>. Figure out what actually belongs in front of an executive — and what doesn't.</p>",

vulnTypesLab: {
  title:"LAB: Classify the Vulnerability",
  briefHtml:"<p>Four pentest findings just landed with technical descriptions but no vulnerability-class labels. File: <code>pentest_findings.txt</code>. Read each one and name the correct category — the report needs consistent terminology before it goes to the dev team.</p>",
  files: {
"pentest_findings.txt":
"FINDING 1 | Endpoint /profile?id=1042 returns another user's private profile data when the id parameter is changed to any arbitrary value, with no server-side check on whether the requester owns that record.\n\n"+
"FINDING 2 | The comment field on the public blog stores raw HTML/JS input unescaped. Any visitor who later views a post containing a malicious comment has that script execute in their browser automatically.\n\n"+
"FINDING 3 | The internal report-generation service accepts a 'callback_url' parameter and fetches it server-side to POST results. Testing shows it will fetch internal-only URLs (e.g., http://169.254.169.254/latest/meta-data/) that should never be reachable from outside.\n\n"+
"FINDING 4 | The login form accepts unlimited password attempts with no lockout, rate limiting, or CAPTCHA after repeated failures, and password complexity requirements are not enforced.\n"
  },
  objectives:[
    { id:1, prompt:"What vulnerability class is Finding 1?", accept:["broken access control","access control"], xp:75, hint:"The server never checks whether the requester is authorized to view that specific record — a missing authorization check." },
    { id:2, prompt:"What vulnerability class is Finding 2?", accept:["persistent xss","stored xss","persistent cross-site scripting","stored cross-site scripting"], xp:75, hint:"The payload is saved server-side and fires for every later viewer — that's the 'stored/persistent' variant, not the one-shot kind." },
    { id:3, prompt:"What vulnerability class is Finding 3?", accept:["ssrf","server-side request forgery"], xp:100, hint:"The server itself is being tricked into reaching an internal-only resource on the attacker's behalf." },
    { id:4, prompt:"What vulnerability class is Finding 4?", accept:["identification and authentication failures","authentication failures","auth failures","identification and authentication failure"], xp:75, hint:"Missing lockouts and weak password enforcement fall under weaknesses in verifying identity itself." },
    { id:5, prompt:"Which secure coding practice from the controls lesson directly mitigates Finding 3?", accept:["input validation","validate the callback url","input validation/allowlisting","allowlist the url","url validation"], xp:100, hint:"The server needs to validate/restrict which URLs it's willing to fetch before making the request." }
  ]
},
azLab1: {
  title:"LAB: Match the Deployment & Pricing Model",
  briefHtml:"<p>Four companies have described their situation to an Azure consultant (that's you). File: <code>scenarios.txt</code>. For each one, name the deployment model, pricing concept, or compute approach that actually fits — not just the one that sounds the most 'cloud'.</p><p>Use <code>ls</code>, <code>cat</code>, and <code>grep</code> to review the file. Type <code>help</code> in the terminal any time.</p>",
  files: {
"scenarios.txt":
"SCENARIO A | A hospital network must keep all patient records on infrastructure it fully owns and controls for regulatory reasons, but wants the self-service provisioning and automation tooling a cloud platform offers.\n\n"+
"SCENARIO B | A tax-preparation company runs its core systems on-premises year-round, but every April needs far more compute capacity than it owns to handle filing-season traffic, then scales back down.\n\n"+
"SCENARIO C | A three-person startup has no budget for hardware and wants to pay only for the exact compute and storage it consumes each month, with nothing purchased upfront.\n\n"+
"SCENARIO D | An engineering team wants a small piece of code to run only when a customer uploads a photo, automatically scale to zero when nobody is uploading anything, and be billed strictly per execution with zero server management.\n"
  },
  objectives:[

azLab2: {
  title:"LAB: Design the Resource Hierarchy & Region Strategy",
  briefHtml:"<p>Contoso's cloud team sent over their current setup and a new requirement. Files: <code>current_setup.txt</code> and <code>new_requirement.txt</code>. Work out where governance should be applied and which resilience feature actually satisfies the requirement.</p>",
  files: {

azCapstone1: {
  title:"CAPSTONE: Advise the Startup",
  briefHtml:"<p>Nimbus Robotics, a 6-person startup, has sent over its situation ahead of a planning call. File: <code>nimbus_brief.txt</code>. Pull together everything from this domain — deployment model, service type, pricing, and the benefit that matters most — into concrete recommendations.</p>",
  files: {
"nimbus_brief.txt":
"Nimbus Robotics builds a SaaS dashboard for warehouse robots. Current situation:\n\n"+
"- No IT staff, no existing hardware, no capital budget for servers.\n"+
"- Traffic is extremely unpredictable: near zero most of the year, then huge spikes during trade-show weeks when demos go live.\n"+
"- The founding engineer wants to deploy application code only, with zero time spent patching operating systems or managing servers.\n"+
"- The one non-negotiable requirement from their first enterprise customer: 'we need contractual proof of your uptime commitment before we sign.'\n"+

    { id:2, prompt:"Given the founding engineer wants to deploy code with zero OS/server management, which service type fits today's need?", accept:["paas","platform as a service"], xp:75, hint:"The model where the provider manages the OS and runtime, and the customer manages only code and data." },
    { id:3, prompt:"Which cloud benefit category most directly satisfies the enterprise customer's demand for a documented uptime commitment?", accept:["reliability and predictability","predictability","reliability","sla / predictability"], xp:100, hint:"This benefit specifically covers being able to point to a formal, published commitment with defined remedies." },
    { id:4, prompt:"Which cloud benefit category best explains how Nimbus should handle the extreme trade-show traffic spikes without overpaying the rest of the year?", accept:["high availability and scalability","scalability","high availability & scalability"], xp:75, hint:"The ability to add capacity to match demand, then remove it again, is the specific benefit at play here." },
    { id:5, prompt:"When Nimbus eventually builds the future single-tenant enterprise offering mentioned at the end of the brief, which deployment model are they describing?", accept:["private cloud","private"], xp:100, hint:"Single-tenant, dedicated infrastructure for one customer's strict compliance needs — a specific deployment model, not a service type." }
  ]
},
azCapstone2: {
  title:"CAPSTONE: Architect Contoso's Azure Footprint",
  briefHtml:"<p>Contoso Manufacturing is moving its first major workload to Azure. Three files describe the requirements: <code>org_requirements.txt</code>, <code>workload_requirements.txt</code>, and <code>security_requirements.txt</code>. Design the footprint end to end.</p>",
  files: {
"org_requirements.txt":
"Contoso has two business units, each with its own subscription: Contoso-Mfg and Contoso-Corp.\n"+
"A single 'no resources outside North American regions' rule must apply to both subscriptions at once, without being configured twice.\n",
"workload_requirements.txt":
"The workload is a customer order-tracking web application plus its database.\n"+
"The web application team wants to deploy code only, with Microsoft managing the OS/runtime — they have no interest in patching servers.\n"+
"The application must stay online through a single datacenter failure inside its region, with automatic failover.\n"+
"Order history data (blob storage) must survive a full regional disaster, and finance has confirmed the extra redundancy cost is approved.\n",
"security_requirements.txt":
"All access must be based on least privilege, assigned at the narrowest scope that still does the job, not blanket subscription-level Owner access.\n"+
"External auditors from a partner firm need read-only access to specific reports twice a year — Contoso does not want to create and manage permanent employee-style accounts for them.\n"+
"Security leadership wants a single score they can track over time showing overall security posture across the whole environment, with actionable recommendations.\n"
  },
  objectives:[
    { id:1, prompt:"Where should the 'North American regions only' rule be applied so it covers both subscriptions from one place?", accept:["management group","a management group"], xp:75, hint:"One level of the hierarchy sits above multiple subscriptions specifically for shared governance like this." },
    { id:2, prompt:"Which service type should the web application team use, given they want to deploy code only with no OS management?", accept:["paas","platform as a service","azure app service"], xp:75, hint:"Same distinction as always: who manages the OS and runtime determines the service type here." },
    { id:3, prompt:"Which Azure feature satisfies the 'survive a single datacenter failure with automatic failover' requirement?", accept:["availability zones","availability zone"], xp:100, hint:"Datacenter-level failure inside one region — not a whole-region disaster." },
    { id:4, prompt:"Which storage redundancy option satisfies the 'order history must survive a full regional disaster' requirement?", accept:["grs","geo-redundant storage","ra-grs"], xp:100, hint:"Local-only redundancy options don't survive losing the entire region — this one replicates to a paired region." },
    { id:5, prompt:"Which Azure access-control mechanism satisfies the least-privilege, narrowest-scope requirement?", accept:["rbac","role-based access control","azure rbac"], xp:75, hint:"Assigns roles to identities at a chosen scope, rather than blanket access." },
    { id:6, prompt:"Which Azure feature satisfies the temporary, read-only auditor access requirement without creating permanent accounts?", accept:["external identities","b2b","entra b2b","external identities / b2b"], xp:100, hint:"Lets an outside partner sign in with their own existing identity to access specific shared resources, rather than provisioning them a new managed account." }
  ]
},
azCapstone3: {
  title:"CAPSTONE: Govern the Enterprise Landing Zone",
  briefHtml:"<p>Contoso is standing up a governed 'landing zone' for all future Azure workloads. Files: <code>finance_asks.txt</code>, <code>compliance_asks.txt</code>, and <code>ops_asks.txt</code>. Recommend the specific Azure tool for each requirement.</p>",

  objectives:[
    { id:1, prompt:"Which tool satisfies finance's 'model cost before provisioning' ask?", accept:["pricing calculator","azure pricing calculator"], xp:75, hint:"Purpose-built to estimate cost for a hypothetical deployment before anything is actually created." },
    { id:2, prompt:"Which Cost Management feature satisfies finance's automatic notification ask?", accept:["budget alert","cost alert","alerts"], xp:75, hint:"Tied directly to a budget's threshold, firing automatically when forecasted spend crosses it." },
    { id:3, prompt:"Which governance tool satisfies compliance's 'block non-compliant deployments outright' ask?", accept:["azure policy","policy"], xp:100, hint:"The tool that can deny deployment outright, not just audit after the fact." },
    { id:4, prompt:"Which tool satisfies compliance's 'single continuously updated security score with recommendations' ask?", accept:["microsoft defender for cloud","defender for cloud","secure score"], xp:100, hint:"Produces exactly this — a secure score plus actionable hardening recommendations, across the whole environment." },
    { id:5, prompt:"Which practice satisfies operations' 'identical repeatable environments, no silent drift' ask?", accept:["infrastructure as code","iac","arm templates","arm/bicep templates"], xp:100, hint:"Machine-readable definition files that redeploy an identical environment every time, instead of manual one-off configuration." },
    { id:6, prompt:"Which Azure Monitor feature satisfies operations' proactive CPU-threshold notification ask?", accept:["azure monitor alerts","alerts","monitor alerts"], xp:75, hint:"Automatically triggered when a defined condition is met against collected metrics, with no human watching a dashboard." }
  ]
},
awsLab1: {
  title:"LAB: Match the Advantage & Pillar",
  briefHtml:"<p>A cloud consultant (that's you) needs to map four situations to the correct cloud advantage or Well-Architected pillar. File: <code>scenarios.txt</code>. Name the specific concept that fits each one.</p><p>Use <code>ls</code>, <code>cat</code>, and <code>grep</code> to review the file. Type <code>help</code> in the terminal any time.</p>",
  files: {
"scenarios.txt":
"SCENARIO A | A retailer used to spend millions up front building out server rooms years before knowing actual demand. After moving to AWS, they only pay for the compute they use each month.\n\n"+
"SCENARIO B | A gaming company's traffic is nearly impossible to forecast ahead of a new release. On AWS they add and remove server capacity automatically as real demand shifts, instead of guessing months in advance.\n\n"+
"SCENARIO C | An architecture review flags that a critical workload has no redundancy across data centers and no plan for recovering from an infrastructure disruption.\n\n"+

    { id:2, prompt:"Which of the six cloud advantages fits Scenario B?", accept:["stop guessing capacity"], xp:50, hint:"Scaling automatically to match real demand, instead of forecasting months ahead, has a specific name among the six advantages." },
    { id:3, prompt:"Which Well-Architected pillar is the review in Scenario C flagging a gap in?", accept:["reliability"], xp:75, hint:"Recovering from infrastructure disruptions and having redundancy is specifically the reliability pillar's territory." },
    { id:4, prompt:"Which Well-Architected pillar is Scenario D's team working on?", accept:["cost optimization"], xp:75, hint:"Right-sizing to eliminate wasted spend is exactly what this pillar is about." }
  ]
},
awsCapstone1: {

awsLab2: {
  title:"LAB: Fix the IAM Misconfiguration",
  briefHtml:"<p>A junior admin at Northwind Labs set up IAM in a hurry. File: <code>iam_audit.txt</code>. Identify what's wrong with each finding and name the fix.</p>",
  files: {
"iam_audit.txt":
"FINDING 1 | The team has been using the AWS account root user credentials for daily development work for the past six months, with no MFA enabled on the root user.\n\n"+
"FINDING 2 | 40 individual developers each have a hand-crafted IAM policy attached directly to their user, making it slow and error-prone to update permissions when the team's access needs change.\n\n"+
"FINDING 3 | An EC2 application needs to read from an S3 bucket. The previous admin embedded a long-lived IAM user's access key directly in the application's source code to grant that access.\n\n"+
"FINDING 4 | Every developer on the team has been granted full AdministratorAccess so nobody has to file a ticket when they need one more permission.\n"
  },
  objectives:[
    { id:1, prompt:"What two-part fix addresses Finding 1?", accept:["enable mfa and stop using root","mfa and stop using the root user","enable mfa, use iam users instead of root"], xp:75, hint:"The root user needs a second verification factor, and daily work should move off it entirely onto IAM identities." },
    { id:2, prompt:"What IAM construct should replace 40 individually-managed user policies in Finding 2?", accept:["iam groups","groups"], xp:75, hint:"A construct exists specifically to let admins attach one shared policy to many users at once." },
    { id:3, prompt:"What should replace the embedded long-lived access key in Finding 3?", accept:["iam role","an iam role","use an iam role instead"], xp:100, hint:"An EC2 instance needing to call another AWS service should assume a temporary identity, not carry permanent embedded credentials." },
    { id:4, prompt:"What IAM principle is being violated in Finding 4?", accept:["least privilege","principle of least privilege"], xp:75, hint:"Granting broad access by default to avoid ticket friction is the direct opposite of this core IAM principle." }
  ]
},
awsCapstone2: {
  title:"CAPSTONE: Secure the Account",
  briefHtml:"<p>Northwind Labs wants a full security review before their SOC 2 audit. Files: <code>account_state.txt</code> and <code>audit_requirements.txt</code>. Recommend the right AWS tool or concept for each gap.</p>",

    { id:4, prompt:"Which AWS resource satisfies requirement 4?", accept:["aws artifact","artifact"], xp:100, hint:"The self-service portal for AWS's own compliance reports and audit documentation." }

},

   in DEVELOPMENT.md for how the group/leaf nesting works end to end.
============================================================ */
var SECTIONS = [
  { id:'cybersecurity', kind:'leaf', name:'Cybersecurity', tagline:'SOC training ground · CS0-003', status:'live', domains: DOMAINS_CYBERSECURITY,
    ranks: RANKS_CYBERSECURITY, examPool: EXAM_POOL_CYBERSECURITY, examComposition: EXAM_COMPOSITION_CYBERSECURITY,
    examPassPct: EXAM_PASS_PCT_CYBERSECURITY, examXP: EXAM_XP_CYBERSECURITY, examTitle: EXAM_TITLE_CYBERSECURITY,
    examBlueprint: EXAM_BLUEPRINT_CYBERSECURITY, examCertifiedLabel: EXAM_CERTIFIED_LABEL_CYBERSECURITY },
  { id:'cloud', kind:'group', name:'Cloud', tagline:'Pick a cloud platform to train in.', status:'live',
    subsections: [
      { id:'azure', kind:'leaf', name:'Azure', tagline:'Azure fundamentals training ground · AZ-900', status:'live', domains: DOMAINS_AZURE,
        ranks: RANKS_AZURE, examPool: EXAM_POOL_AZURE, examComposition: EXAM_COMPOSITION_AZURE,
        examPassPct: EXAM_PASS_PCT_AZURE, examXP: EXAM_XP_AZURE, examTitle: EXAM_TITLE_AZURE,
        examBlueprint: EXAM_BLUEPRINT_AZURE, examCertifiedLabel: EXAM_CERTIFIED_LABEL_AZURE },
      { id:'aws', kind:'leaf', name:'AWS', tagline:'AWS fundamentals training ground · CLF-C02', status:'live', domains: DOMAINS_AWS,
        ranks: RANKS_AWS, examPool: EXAM_POOL_AWS, examComposition: EXAM_COMPOSITION_AWS,
        examPassPct: EXAM_PASS_PCT_AWS, examXP: EXAM_XP_AWS, examTitle: EXAM_TITLE_AWS,
        examBlueprint: EXAM_BLUEPRINT_AWS, examCertifiedLabel: EXAM_CERTIFIED_LABEL_AWS }
    ]
  },
  { id:'networking', kind:'leaf', name:'Networking', tagline:'Network engineering & defense.', status:'coming-soon', domains: [],
    ranks: RANKS_CYBERSECURITY, examPool: {}, examComposition: [], examPassPct: 80, examXP: 0, examTitle: '', examBlueprint: '', examCertifiedLabel: '' }
];
/* Flat list of every leaf section (a group's subsections are hoisted up into
   this list), used for lookups/state — SECTIONS itself stays a tree for nav
   rendering, since a group has no state/domains of its own to look up. */
var LEAF_SECTIONS = [];
SECTIONS.forEach(function(sec){
  if(sec.kind === 'group') sec.subsections.forEach(function(sub){ LEAF_SECTIONS.push(sub); });
  else LEAF_SECTIONS.push(sec);
});
function sectionById(id){ for(var i=0;i<LEAF_SECTIONS.length;i++){ if(LEAF_SECTIONS[i].id===id) return LEAF_SECTIONS[i]; } return null; }
function groupById(id){ for(var i=0;i<SECTIONS.length;i++){ if(SECTIONS[i].id===id && SECTIONS[i].kind==='group') return SECTIONS[i]; } return null; }
/* Given a leaf section id, returns the group object it's nested under, or null
   if it's a top-level leaf (like cybersecurity/networking). Powers the "Cloud /"
   breadcrumb prefix and the nav's group-expansion logic. */
function parentGroupOf(leafId){
  for(var i=0;i<SECTIONS.length;i++){
    if(SECTIONS[i].kind==='group'){
      for(var j=0;j<SECTIONS[i].subsections.length;j++){ if(SECTIONS[i].subsections[j].id===leafId) return SECTIONS[i]; }
    }
  }
  return null;
}

/* currentSectionId/DOMAINS/state/RANKS/EXAM_* (declared below) are reassigned
   together whenever the active section changes (see setSection()) — every
   existing function that reads these bare globals keeps working unmodified,
   it just transparently operates on whichever section is active. */
var currentSectionId = 'cybersecurity';
var DOMAINS = DOMAINS_CYBERSECURITY;
var RANKS = RANKS_CYBERSECURITY;
var EXAM_POOL = EXAM_POOL_CYBERSECURITY;
var EXAM_COMPOSITION = EXAM_COMPOSITION_CYBERSECURITY;
var EXAM_PASS_PCT = EXAM_PASS_PCT_CYBERSECURITY;
var EXAM_XP = EXAM_XP_CYBERSECURITY;
var EXAM_TITLE = EXAM_TITLE_CYBERSECURITY;
var EXAM_BLUEPRINT = EXAM_BLUEPRINT_CYBERSECURITY;
var EXAM_CERTIFIED_LABEL = EXAM_CERTIFIED_LABEL_CYBERSECURITY;
function numberWord(n){ var words=['zero','one','two','three','four','five','six','seven','eight','nine','ten']; return words[n]!==undefined ? words[n] : String(n); }

function shuffleArr(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* Reorders a question's options (and remaps the correct index) so the answer
   isn't always sitting in the same slot — applied at render/build time so the
   authored data can stay in natural, readable order. */
function shuffleQuestion(item){
  var order = shuffleArr([0,1,2,3].slice(0, item.opts.length));
  return {
    q:item.q,
    opts: order.map(function(i){ return item.opts[i]; }),
    correct: order.indexOf(item.correct),
    explain: item.explain,
    domain: item.domain,
    domainLabel: item.domainLabel
  };
}
function buildExam(){
  var qs = [];
  EXAM_COMPOSITION.forEach(function(c){
    shuffleArr(EXAM_POOL[c.domain]).slice(0, c.count).forEach(function(q){
      qs.push(shuffleQuestion({ q:q.q, opts:q.opts, correct:q.correct, explain:q.explain, domain:c.domain, domainLabel:c.label }));
    });
  });
  return shuffleArr(qs);
}

/* ============================================================
   ROUTER STATE (must exist before any early render call)
============================================================ */
var view = { type:'home' };
function go(v){ if(v.sectionId) setSection(v.sectionId); view = v; render(); window.scrollTo(0,0); }

/* ============================================================
   STATE / PERSISTENCE
============================================================ */
var STORAGE_KEY = 'range_cysa_progress_v1';

function defaultState(){
  return { xp:0, completed:{}, quizScores:{}, labProgress:{}, streak:0, lastVisit:null,
    examPassed:false, examAttempts:0, examBest:null };
}
function normalizeSectionState(raw){
  var d = defaultState();
  raw = raw || {};
  for(var k in d){ if(raw[k] === undefined) raw[k] = d[k]; }
  return raw;
}
/* Pre-sections saves stored one flat state object directly under STORAGE_KEY
   (xp/completed at the top level). That legacy shape becomes the cybersecurity
   section's state on load, since Cybersecurity is the only section that existed
   before Cloud/Networking were added — this keeps existing users' progress. */
function normalizeSectionStates(raw){
  raw = raw || {};
  var legacy = raw.xp !== undefined || raw.completed !== undefined;
  var out = {};
  LEAF_SECTIONS.forEach(function(sec){
    if(legacy) out[sec.id] = sec.id === 'cybersecurity' ? normalizeSectionState(raw) : normalizeSectionState(null);
    else out[sec.id] = normalizeSectionState(raw[sec.id]);
  });
  return out;
}
function loadSectionStates(){
  try{
    var rawStr = localStorage.getItem(STORAGE_KEY);
    if(!rawStr) return normalizeSectionStates(null);
    return normalizeSectionStates(JSON.parse(rawStr));
  }catch(e){ return normalizeSectionStates(null); }
}
var sectionStates = loadSectionStates();
var state = sectionStates[currentSectionId];

function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(sectionStates)); renderChrome(); }

function setSection(id){
  currentSectionId = id;
  var sec = sectionById(id);
  DOMAINS = sec.domains;
  state = sectionStates[id];
  RANKS = sec.ranks;
  EXAM_POOL = sec.examPool;
  EXAM_COMPOSITION = sec.examComposition;
  EXAM_PASS_PCT = sec.examPassPct;
  EXAM_XP = sec.examXP;
  EXAM_TITLE = sec.examTitle;
  EXAM_BLUEPRINT = sec.examBlueprint;
  EXAM_CERTIFIED_LABEL = sec.examCertifiedLabel;
  touchStreak();
}

function dayDiff(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function touchStreak(){
  var today = new Date().toISOString().slice(0,10);
  if(state.lastVisit === today){ /* same day, no change */ }
  else if(!state.lastVisit){ state.streak = 1; state.lastVisit = today; }
  else {
    var diff = dayDiff(state.lastVisit, today);
    if(diff === 1) state.streak += 1; else state.streak = 1;
    state.lastVisit = today;
  }
  saveState();
}
touchStreak();

function getRank(xp, ranks){ ranks = ranks || RANKS; var r = ranks[0]; for(var i=0;i<ranks.length;i++){ if(xp >= ranks[i].min) r = ranks[i]; } return r; }

function awardXP(amount, label){
  state.xp += amount;
  saveState();
  showToast('+' + amount + ' XP', label);
}

function showToast(headline, sub){
  var host = document.getElementById('toast-host');
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<b>' + headline + '</b>' + (sub ? ' &middot; ' + escapeHtml(sub) : '');
  host.appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); }, 300); }, 2600);
}

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function domainById(id){ for(var i=0;i<DOMAINS.length;i++){ if(DOMAINS[i].id===id) return DOMAINS[i]; } return null; }
function nodeById(domain, id){ for(var i=0;i<domain.nodes.length;i++){ if(domain.nodes[i].id===id) return domain.nodes[i]; } return null; }

function domainProgress(domain){
  var total = domain.nodes.length, done = 0;
  domain.nodes.forEach(function(n){ if(state.completed[n.id]) done++; });
  return { done:done, total:total, pct: total ? Math.round(done/total*100) : 0 };
}
function overallProgress(){
  var total=0, done=0;
  DOMAINS.forEach(function(d){ d.nodes.forEach(function(n){ total++; if(state.completed[n.id]) done++; }); });
  return { done:done, total:total, pct: total ? Math.round(done/total*100) : 0 };
}
/* Same as overallProgress() but for an arbitrary section, regardless of which
   section is currently active — used on the Home page, which shows all 3 at once. */
function sectionOverallProgress(sec){
  var total=0, done=0, st=sectionStates[sec.id];
  sec.domains.forEach(function(d){ d.nodes.forEach(function(n){ total++; if(st.completed[n.id]) done++; }); });
  return { done:done, total:total, pct: total ? Math.round(done/total*100) : 0 };
}
function isUnlocked(domain, idx){
  if(domain.status === 'preview') return true;
  if(idx === 0) return true;
  return !!state.completed[domain.nodes[idx-1].id];
}

/* ============================================================
   RENDER: CHROME (sidebar + topbar)
============================================================ */
function renderChrome(){
  var rank = getRank(state.xp);
  var rankLabel = state.examPassed ? EXAM_CERTIFIED_LABEL : rank.name;
  var rankEl = document.getElementById('rank-name');
  rankEl.textContent = rankLabel;
  rankEl.classList.toggle('certified', !!state.examPassed);
  document.getElementById('xp-total').textContent = state.xp;
  document.getElementById('xp-total-2').textContent = state.xp;
  document.getElementById('streak-count').textContent = state.streak;
  document.getElementById('avatar-initials').textContent = state.examPassed ? '✓' : rank.name.split(' ').map(function(w){return w[0];}).slice(0,2).join('');

  var nav = document.getElementById('nav-list');
  var html = '';
  html += '<button class="nav-item ' + (view.type==='home'?'active':'') + '" data-nav="home"><span class="dot"></span><span class="n-title">Home</span></button>';
  /* True only for views that actually put us "inside" a leaf section (as
     opposed to 'home' or 'group', where currentSectionId is stale/irrelevant
     — it's whatever leaf was last active, not the page being shown). Used to
     gate section/group nav-item expansion so a stale currentSectionId can't
     leak an unrelated section's domain list open on the Home or a group page. */
  var isLeafView = view.type==='dashboard'||view.type==='domain'||view.type==='lesson'||view.type==='lab'||view.type==='exam';

  /* Renders the domain list + exam nav-item for one active leaf section,
     at the given indent level (1 = directly under a top-level leaf,
     2 = under a leaf nested inside a group). Shared by both branches below. */
  function appendDomainNav(sec, level){
    var subCls = level===2 ? 'nav-item nav-sub nav-sub2' : 'nav-item nav-sub';
    var barCls = level===2 ? 'nav-mini-bar sub2' : 'nav-mini-bar';
    sec.domains.forEach(function(d){
      var p = domainProgress(d);
      var dcls = subCls;
      if((view.type==='domain'||view.type==='lesson'||view.type==='lab') && view.domainId===d.id) dcls += ' active';
      if(d.status==='live') dcls += ' live';
      if(p.pct===100) dcls += ' done';
      html += '<button class="'+dcls+'" data-nav="domain" data-domain="'+d.id+'">'+
        '<span class="dot"></span><span class="n-title">'+d.code+' &middot; '+d.name+'</span><span class="n-pct">'+p.pct+'%</span></button>'+
        '<div class="'+barCls+'"><i style="width:'+p.pct+'%"></i></div>';
    });
    var examCls = subCls + ' exam-nav';
    if(view.type==='exam') examCls += ' active';
    if(state.examPassed) examCls += ' done';
    html += '<button class="'+examCls+'" data-nav="exam"><span class="dot"></span><span class="n-title">&#127942; Final Exam</span>'+
      (state.examPassed ? '<span class="n-pct">PASS</span>' : '')+'</button>';
  }

  SECTIONS.forEach(function(sec){
    if(sec.kind === 'group'){
      var activeLeafInGroup = isLeafView && parentGroupOf(currentSectionId) === sec;
      var isGroupView = view.type==='group' && view.groupId===sec.id;
      var isActiveGroup = activeLeafInGroup || isGroupView;
      var gcls = 'nav-item';
      if(isActiveGroup) gcls += ' active';
      if(sec.status==='live') gcls += ' live';
      html += '<button class="'+gcls+'" data-nav="group" data-group="'+sec.id+'">'+
        '<span class="dot"></span><span class="n-title">'+sec.name+'</span></button>';
      if(isActiveGroup){
        sec.subsections.forEach(function(sub){
          var subIsActive = isLeafView && currentSectionId === sub.id;
          var subOp = sectionOverallProgress(sub);
          var scls = 'nav-item nav-sub';
          if(subIsActive && view.type==='dashboard') scls += ' active';
          if(sub.status==='live') scls += ' live';
          if(subOp.pct===100) scls += ' done';
          html += '<button class="'+scls+'" data-nav="leaf" data-leaf="'+sub.id+'">'+
            '<span class="dot"></span><span class="n-title">'+sub.name+'</span><span class="n-pct">'+subOp.pct+'%</span></button>';
          if(subIsActive && sub.domains.length) appendDomainNav(sub, 2);
        });
      }
    } else {
      var isActiveSection = isLeafView && currentSectionId===sec.id;
      var cls = 'nav-item';
      if(isActiveSection && view.type==='dashboard') cls += ' active';
      if(sec.status==='live') cls += ' live';
      html += '<button class="'+cls+'" data-nav="section" data-section="'+sec.id+'">'+
        '<span class="dot"></span><span class="n-title">'+sec.name+'</span>'+
        (sec.status==='coming-soon' ? '<span class="n-pct">Soon</span>' : '')+'</button>';
      if(isActiveSection && sec.domains.length) appendDomainNav(sec, 1);
    }
  });
  nav.innerHTML = html;
  nav.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.dataset.nav==='home') go({type:'home'});
      else if(btn.dataset.nav==='group') go({type:'group', groupId:btn.dataset.group});
      else if(btn.dataset.nav==='section') go({type:'dashboard', sectionId:btn.dataset.section});
      else if(btn.dataset.nav==='leaf') go({type:'dashboard', sectionId:btn.dataset.leaf});
      else if(btn.dataset.nav==='exam') go({type:'exam', sectionId:currentSectionId});
      else go({type:'domain', domainId:btn.dataset.domain, sectionId:currentSectionId});
    });
  });

  var crumbEl = document.getElementById('crumb');
  if(view.type==='home') crumbEl.innerHTML = '<b>Home</b>';
  else if(view.type==='group'){
    var grp = groupById(view.groupId);
    crumbEl.innerHTML = 'Home / <b>'+grp.name+'</b>';
  } else {
    var secLabel = sectionById(currentSectionId).name;
    var parentGrp = parentGroupOf(currentSectionId);
    var crumbPrefix = parentGrp ? parentGrp.name+' / ' : '';
    if(view.type==='dashboard') crumbEl.innerHTML = 'Home / '+crumbPrefix+'<b>'+secLabel+'</b>';
    else if(view.type==='domain'){ var d=domainById(view.domainId); crumbEl.innerHTML = 'Home / '+crumbPrefix+secLabel+' / <b>'+d.name+'</b>'; }
    else if(view.type==='lesson' || view.type==='lab'){ var d2=domainById(view.domainId); crumbEl.innerHTML = 'Home / '+crumbPrefix+secLabel+' / '+d2.name+' / <b>'+view.title+'</b>'; }
    else if(view.type==='exam'){ crumbEl.innerHTML = 'Home / '+crumbPrefix+secLabel+' / <b>Final Exam</b>'; }
  }
}

/* ============================================================
   RENDER: DASHBOARD
============================================================ */
function renderDashboard(){
  var sec = sectionById(currentSectionId);
  if(!DOMAINS.length){
    document.getElementById('view').innerHTML =
      '<div class="hero"><div><h1>'+sec.name+'</h1><p>'+sec.tagline+' This track hasn\'t been built out yet — check back soon.</p></div></div>'+
      '<div class="overview-box"><h3 class="uc">Coming soon</h3><p style="margin-bottom:0">There\'s no content here yet. <a href="#" id="home-link">Head back to Home</a> and keep training in Cybersecurity in the meantime.</p></div>';
    document.getElementById('home-link').addEventListener('click', function(e){ e.preventDefault(); go({type:'home'}); });
    return;
  }
  var op = overallProgress();
  var circumference = 2*Math.PI*38;
  var offset = circumference - (op.pct/100)*circumference;
  var html = '';
  html += '<div class="hero"><div><h1>Welcome back, Analyst.</h1><p>Your '+EXAM_BLUEPRINT+' training path across '+numberWord(DOMAINS.length)+' domains. Finish every module, then sit the mixed final exam to prove it stuck.</p></div>'+
    '<div class="ring-wrap"><svg width="92" height="92"><circle class="ring-bg" cx="46" cy="46" r="38"/>'+
    '<circle class="ring-fg" cx="46" cy="46" r="38" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"/></svg>'+
    '<div class="ring-label">'+op.pct+'%</div></div></div>';

  html += '<div class="path">';
  DOMAINS.forEach(function(d){
    var p = domainProgress(d);
    var stateCls = d.status==='preview' ? 'preview' : (p.pct===100 ? 'complete' : 'live');
    html += '<div class="domain-node '+stateCls+'" data-open="'+d.id+'">'+
      '<div class="node-marker">'+ (p.pct===100 ? '&#10003;' : d.code) +'</div>'+
      '<div class="domain-card"><div class="domain-card-top">'+
        '<div><div class="domain-title">'+d.name+'</div><p class="domain-tagline">'+d.tagline+'</p></div>'+
        '<div style="display:flex;gap:6px;flex:none"><span class="badge weight">'+d.weight+'% of exam</span>'+
        (d.status==='preview' ? '<span class="badge preview">Preview</span>' : '')+'</div>'+
      '</div><div class="domain-progress-bar"><i style="width:'+p.pct+'%"></i></div>'+
      '<div style="font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint);margin-top:6px">'+p.done+' / '+p.total+' modules complete</div>'+
      '</div></div>';
  });
  html += '</div>';

  var examUnlocked = op.pct === 100;
  var examQCount = EXAM_COMPOSITION.reduce(function(s,c){ return s+c.count; }, 0);
  html += '<div class="exam-card-wrap"><div class="exam-card'+(examUnlocked?'':' locked')+'" id="exam-card">'+
    '<div><div class="exam-card-title">&#127942; '+EXAM_TITLE+'</div>'+
    '<p class="exam-card-sub">'+examQCount+' questions mixed across '+numberWord(DOMAINS.length)+' domains, weighted to match the real exam. '+EXAM_PASS_PCT+'% to pass.</p>'+
    (examUnlocked
      ? '<div class="exam-card-stat">'+(state.examBest ? 'Best attempt: '+state.examBest.pct+'% ('+state.examAttempts+' attempt'+(state.examAttempts===1?'':'s')+')' + (state.examPassed ? ' — PASSED' : '') : 'Not attempted yet')+'</div>'
      : '<div class="exam-card-stat">&#128274; Complete all '+numberWord(DOMAINS.length)+' domains to unlock (currently '+op.done+'/'+op.total+' modules)</div>')+
    '</div><span class="badge weight">'+EXAM_XP+' XP</span></div></div>';

  document.getElementById('view').innerHTML = html;
  document.querySelectorAll('[data-open]').forEach(function(el){
    el.addEventListener('click', function(){ go({type:'domain', domainId: el.dataset.open, sectionId: currentSectionId}); });
  });
  var examCardEl = document.getElementById('exam-card');
  if(examCardEl){
    examCardEl.addEventListener('click', function(){ if(examUnlocked) go({type:'exam', sectionId: currentSectionId}); });
  }
}

/* ============================================================
   RENDER: HOME (top-level, lists all sections) + GROUP (a group's
   own subsection list, e.g. Cloud -> Azure/AWS)
============================================================ */
/* Renders one card for either a leaf section (own domains/XP/rank) or a
   group (aggregated progress/XP across its subsections, no domains of its
   own) — shared by renderHome() (top-level SECTIONS) and renderGroupPage()
   (a single group's subsections, which are always leaves). */
function renderSectionCard(item){
  if(item.kind === 'group'){
    var doneTotal=0, totalTotal=0, xpTotal=0;
    item.subsections.forEach(function(sub){
      var st = sectionStates[sub.id];
      xpTotal += st.xp;
      sub.domains.forEach(function(d){ d.nodes.forEach(function(n){ totalTotal++; if(st.completed[n.id]) doneTotal++; }); });
    });
    var gpct = totalTotal ? Math.round(doneTotal/totalTotal*100) : 0;
    var gStateCls = gpct===100 ? 'complete' : 'live';
    return '<div class="domain-node '+gStateCls+'" data-open-group="'+item.id+'">'+
      '<div class="node-marker">'+ (gpct===100 ? '&#10003;' : item.name.charAt(0)) +'</div>'+
      '<div class="domain-card"><div class="domain-card-top">'+
        '<div><div class="domain-title">'+item.name+'</div><p class="domain-tagline">'+item.tagline+'</p></div>'+
        '<div style="display:flex;gap:6px;flex:none"><span class="badge weight">'+item.subsections.length+' tracks &middot; '+xpTotal+' XP</span></div>'+
      '</div><div class="domain-progress-bar"><i style="width:'+gpct+'%"></i></div>'+
      '<div style="font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint);margin-top:6px">'+doneTotal+' / '+totalTotal+' modules complete across '+item.subsections.length+' tracks</div>'+
      '</div></div>';
  }
  var st = sectionStates[item.id];
  var rank = getRank(st.xp, item.ranks);
  var op = sectionOverallProgress(item);
  var hasContent = item.domains.length > 0;
  var stateCls = item.status==='coming-soon' ? 'preview' : (hasContent && op.pct===100 ? 'complete' : 'live');
  return '<div class="domain-node '+stateCls+'" data-open-section="'+item.id+'">'+
    '<div class="node-marker">'+ (hasContent && op.pct===100 ? '&#10003;' : item.name.charAt(0)) +'</div>'+
    '<div class="domain-card"><div class="domain-card-top">'+
      '<div><div class="domain-title">'+item.name+'</div><p class="domain-tagline">'+item.tagline+'</p></div>'+

      (item.status==='coming-soon' ? '<span class="badge preview">Coming soon</span>' : '<span class="badge weight">'+rank.name+' &middot; '+st.xp+' XP</span>')+

function mountQuiz(mount, quizRaw, node, domain){
  var quiz = quizRaw.map(shuffleQuestion);
  var picks = new Array(quiz.length).fill(null);
  var submitted = false;

  function draw(){
    var html = '';
    quiz.forEach(function(item, qi){
      html += '<div class="quiz-q"><p class="qtext">'+(qi+1)+'. '+item.q+'</p><div class="quiz-opts">';
      item.opts.forEach(function(opt, oi){
        var cls = 'quiz-opt';
        if(submitted){
          if(oi === item.correct) cls += ' correct';
          else if(picks[qi] === oi) cls += ' wrong';
        } else if(picks[qi]===oi) cls += ' picked';
        html += '<button class="'+cls+'" data-qi="'+qi+'" data-oi="'+oi+'" '+(submitted?'disabled':'')+'>'+opt+'</button>';
      });
      html += '</div><div class="quiz-explain'+(submitted?' show':'')+'">'+item.explain+'</div></div>';
    });
    html += '<div class="quiz-footer">';
    if(!submitted){
      html += '<button class="btn btn-primary" id="quiz-submit">Submit answers</button><span class="quiz-score" id="quiz-hint">Answer all '+quiz.length+' questions first.</span>';
    } else {
      var correctCount = 0;
      picks.forEach(function(p,qi){ if(p===quiz[qi].correct) correctCount++; });
      var pct = Math.round(correctCount/quiz.length*100);
      var passed = pct >= 70;
      html += '<span class="quiz-score">Score: '+correctCount+'/'+quiz.length+' ('+pct+'%) &middot; '+(passed?'<b style="color:#3aa35a">PASSED</b>':'<b style="color:var(--sev-critical)">Try again</b>')+'</span>';
      if(!passed) html += '<button class="btn" id="quiz-retry">Retry quiz</button>';
      else if(!state.completed[node.id]) html += '<span class="quiz-score" id="quiz-award-note">Module complete!</span>';
    }
    html += '</div>';
    mount.innerHTML = html;

    mount.querySelectorAll('.quiz-opt').forEach(function(b){
      b.addEventListener('click', function(){
        if(submitted) return;
        picks[parseInt(b.dataset.qi,10)] = parseInt(b.dataset.oi,10);
        draw();
      });
    });
    var submitBtn = document.getElementById('quiz-submit');
    if(submitBtn){
      submitBtn.addEventListener('click', function(){
        if(picks.indexOf(null) !== -1){ showToast('Hold up', 'Answer every question before submitting.'); return; }
        submitted = true;
        var correctCount = 0;
        picks.forEach(function(p,qi){ if(p===quiz[qi].correct) correctCount++; });
        var pct = Math.round(correctCount/quiz.length*100);
        state.quizScores[node.id] = { score:correctCount, total:quiz.length };
        if(pct >= 70 && !state.completed[node.id]){
          state.completed[node.id] = true;
          saveState();
          awardXP(node.xp, node.title);
        } else {
          saveState();
        }
        draw();
      });
    }
    var retryBtn = document.getElementById('quiz-retry');
    if(retryBtn){
      retryBtn.addEventListener('click', function(){ submitted=false; picks = new Array(quiz.length).fill(null); draw(); });
    }
  }
  draw();
}

function renderLab(domainId, nodeId){
  var d = domainById(domainId), n = nodeById(d, nodeId);
  var lab = LABS[n.labKey];
  var progress = state.labProgress[n.id] || { done:{} };
  state.labProgress[n.id] = progress;

  var html = '<button class="back-link" id="back-btn">&#8592; '+d.name+'</button>';
  html += '<div class="lesson-head"><div><h1>'+lab.title+'</h1></div><span class="badge weight">'+n.xp+' XP</span></div>';
  html += '<div class="lab-layout">';

  html += '<div class="lab-brief">'+lab.briefHtml+'<h3 class="uc" style="margin-top:16px">Objectives</h3><ul class="obj-list" id="obj-list">';
  lab.objectives.forEach(function(o){
    var done = !!progress.done[o.id];
    html += '<li class="obj-item'+(done?' done':'')+'" data-obj="'+o.id+'"><span class="obj-check">'+(done?'&#10003;':'')+'</span><span class="obj-text">'+o.prompt+'</span></li>';
  });
  html += '</ul><div class="answer-row"><select id="obj-select">';
  lab.objectives.forEach(function(o){ html += '<option value="'+o.id+'">#'+o.id+'</option>'; });
  html += '</select><input type="text" id="obj-answer" placeholder="answer for selected #"></div>'+
    '<button class="btn btn-primary btn-block" id="obj-submit" style="margin-top:8px">Submit answer</button>'+
    '<button class="btn btn-block" id="obj-hint-btn" style="margin-top:6px">Hint</button></div>';

  html += '<div class="terminal"><div class="term-head"><span class="term-dot" style="background:#f0485a"></span><span class="term-dot" style="background:#f2a93b"></span><span class="term-dot" style="background:#3ee08a"></span><span class="term-title">analyst@proving-grounds:~'+'</span></div>'+
    '<div class="term-body" id="term-body"></div>'+
    '<div class="term-input-row"><span class="term-prompt">analyst@proving-grounds:~$</span><input class="term-input" id="term-input" autocomplete="off" spellcheck="false"></div></div>';

  html += '</div>';

  document.getElementById('view').innerHTML = html;
  document.getElementById('back-btn').addEventListener('click', function(){ go({type:'domain', domainId:d.id, sectionId:currentSectionId}); });

  var termBody = document.getElementById('term-body');
  function printLine(text, cls){
    var div = document.createElement('div');
    div.className = 'ln' + (cls ? ' '+cls : '');
    div.textContent = text;
    termBody.appendChild(div);
    termBody.scrollTop = termBody.scrollHeight;
  }
  printLine('Connected to lab host. Files available: ' + Object.keys(lab.files).join(', '), 'sys');
  printLine("Type 'help' for commands.", 'sys');

  function tokenize(str){
    var out = [], re = /"([^"]*)"|(\S+)/g, m;
    while((m = re.exec(str))){ out.push(m[1] !== undefined ? m[1] : m[2]); }
    return out;
  }

  function runCommand(raw){
    printLine(raw, 'cmd');
    var tokens = tokenize(raw.trim());
    if(tokens.length === 0) return;
    var cmd = tokens[0];
    if(cmd === 'help'){
      printLine('Commands: ls | cat <file> | grep [-i] "<pattern>" <file> | wc -l <file> | objectives | hint <#> | answer <#> "<text>" | clear', 'sys');
    } else if(cmd === 'clear'){
      termBody.innerHTML = '';
    } else if(cmd === 'ls'){
      printLine(Object.keys(lab.files).join('  '));
    } else if(cmd === 'cat'){
      var f = tokens[1];
      if(!f){ printLine('usage: cat <file>', 'err'); }
      else if(!lab.files[f]){ printLine('cat: '+f+': No such file', 'err'); }
      else { lab.files[f].split('\n').forEach(function(l){ if(l) printLine(l); }); }
    } else if(cmd === 'grep'){
      var idx = 1, ignoreCase = false;
      if(tokens[idx] === '-i'){ ignoreCase = true; idx++; }
      var pattern = tokens[idx]; var file = tokens[idx+1];
      if(!pattern || !file){ printLine('usage: grep [-i] "<pattern>" <file>', 'err'); }
      else if(!lab.files[file]){ printLine('grep: '+file+': No such file', 'err'); }
      else {
        var lines = lab.files[file].split('\n').filter(Boolean);
        var re;
        try{ re = new RegExp(pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), ignoreCase ? 'i':''); }catch(e){ re = null; }
        var hits = lines.filter(function(l){ return re && re.test(l); });
        if(hits.length===0) printLine('(no matches)', 'sys'); else hits.forEach(function(l){ printLine(l, 'ok'); });
      }
    } else if(cmd === 'wc'){
      var flag = tokens[1], file2 = tokens[2];
      if(flag !== '-l' || !file2){ printLine('usage: wc -l <file>', 'err'); }
      else if(!lab.files[file2]){ printLine('wc: '+file2+': No such file', 'err'); }
      else printLine(String(lab.files[file2].split('\n').filter(Boolean).length) + ' ' + file2);
    } else if(cmd === 'objectives'){
      lab.objectives.forEach(function(o){ printLine('#'+o.id+' ['+(progress.done[o.id]?'DONE':'open')+'] '+o.prompt, progress.done[o.id]?'ok':'sys'); });
    } else if(cmd === 'hint'){
      var oid = parseInt(tokens[1],10);
      var obj = lab.objectives.filter(function(o){return o.id===oid;})[0];
      if(!obj){ printLine('usage: hint <#>', 'err'); } else printLine('hint #'+oid+': '+obj.hint, 'sys');
    } else if(cmd === 'answer'){
      var oid2 = parseInt(tokens[1],10);
      var text = tokens.slice(2).join(' ');
      submitAnswer(oid2, text);
    } else if(cmd === 'whoami'){
      printLine('analyst');
    } else {
      printLine(cmd + ': command not found. Type help.', 'err');
    }
  }

  function submitAnswer(oid, text){
    var obj = lab.objectives.filter(function(o){return o.id===oid;})[0];
    if(!obj){ printLine('No such objective #'+oid, 'err'); return; }
    if(!text){ printLine('Provide an answer: answer '+oid+' "<text>"', 'err'); return; }
    var norm = text.trim().toLowerCase();
    var hit = obj.accept.some(function(a){ var an=a.toLowerCase(); return norm===an || norm.indexOf(an)!==-1 || an.indexOf(norm)!==-1; });
    if(hit){
      if(!progress.done[oid]){
        progress.done[oid] = true;
        saveState();
        awardXP(obj.xp, 'Objective #'+oid);
        printLine('Correct — objective #'+oid+' complete.', 'ok');
        refreshObjectivesUI();
        maybeCompleteLab();
      } else {
        printLine('Already completed.', 'sys');
      }
    } else {
      printLine('Not quite. Try `hint '+oid+'` for a nudge.', 'err');
    }
  }

  function refreshObjectivesUI(){
    document.querySelectorAll('#obj-list .obj-item').forEach(function(li){
      var oid = parseInt(li.dataset.obj,10);
      var done = !!progress.done[oid];
      li.classList.toggle('done', done);
      li.querySelector('.obj-check').innerHTML = done ? '&#10003;' : '';
    });
  }
  function maybeCompleteLab(){
    var allDone = lab.objectives.every(function(o){ return progress.done[o.id]; });
    if(allDone && !state.completed[n.id]){
      state.completed[n.id] = true;
      saveState();
      showToast('LAB COMPLETE', lab.title);
    }
  }

  var input = document.getElementById('term-input');
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var v = input.value;
      input.value = '';
      if(v.trim().length) runCommand(v);
    }
  });
  input.focus();

  document.getElementById('obj-submit').addEventListener('click', function(){
    var oid3 = parseInt(document.getElementById('obj-select').value,10);
    var text3 = document.getElementById('obj-answer').value;
    submitAnswer(oid3, text3);
    document.getElementById('obj-answer').value = '';
  });
  document.getElementById('obj-hint-btn').addEventListener('click', function(){
    var oid4 = parseInt(document.getElementById('obj-select').value,10);
    runCommand('hint ' + oid4);
  });
}

function renderExam(){
  var html = '<button class="back-link" id="back-btn">&#8592; Dashboard</button>';

  mountExam(document.getElementById('exam-mount'));

function mountExam(mount){
  var phase = 'intro';
  var examQuestions = [];
  var picks = [];

  function startExam(){
    examQuestions = buildExam();
    picks = new Array(examQuestions.length).fill(null);
    phase = 'active';
    draw();
  }

  function submitExam(){
    if(picks.indexOf(null) !== -1){ showToast('Hold up', 'Answer every question before submitting.'); return; }
    var byDomain = {};
    EXAM_COMPOSITION.forEach(function(c){ byDomain[c.domain] = { label:c.label, correct:0, total:0 }; });
    var correctCount = 0;
    examQuestions.forEach(function(q, qi){
      byDomain[q.domain].total++;
      if(picks[qi] === q.correct){ correctCount++; byDomain[q.domain].correct++; }
    });
    var pct = Math.round(correctCount/examQuestions.length*100);
    var passed = pct >= EXAM_PASS_PCT;
    state.examAttempts += 1;
    if(!state.examBest || pct > state.examBest.pct) state.examBest = { pct:pct, score:correctCount, total:examQuestions.length };
    var newlyPassed = passed && !state.examPassed;
    if(passed) state.examPassed = true;
    saveState();
    if(newlyPassed) awardXP(EXAM_XP, EXAM_TITLE+' — PASSED');
    phase = { name:'results', pct:pct, passed:passed, correctCount:correctCount, byDomain:byDomain };
    draw();
  }

  function draw(){
    if(phase === 'intro'){
      var bestLine = state.examBest
        ? '<p><b>Best attempt:</b> '+state.examBest.score+'/'+state.examBest.total+' ('+state.examBest.pct+'%)'+(state.examPassed ? ' — <span style="color:#3aa35a">PASSED</span>' : '')+' across '+state.examAttempts+' attempt'+(state.examAttempts===1?'':'s')+'.</p>'
        : '';
      var examTotalQ = EXAM_COMPOSITION.reduce(function(s,c){ return s+c.count; }, 0);
      mount.innerHTML =
        '<div class="exam-intro"><p>This exam mixes '+examTotalQ+' questions pulled from '+numberWord(DOMAINS.length)+' domains, weighted roughly like the real '+EXAM_BLUEPRINT+' blueprint:</p>'+
        '<ul>'+EXAM_COMPOSITION.map(function(c){ return '<li>'+c.label+' — '+c.count+' questions</li>'; }).join('')+'</ul>'+
        '<p>No feedback until you submit — just like the real thing. You need <b>'+EXAM_PASS_PCT+'%</b> to pass. You can retake it as many times as you want; each attempt draws a fresh random set.</p>'+
        bestLine+
        '<button class="btn btn-primary" id="exam-start">'+(state.examAttempts ? 'Retake Exam' : 'Begin Exam')+'</button></div>';
      document.getElementById('exam-start').addEventListener('click', startExam);
      return;
    }

    if(phase === 'active'){
      var h = '';
      examQuestions.forEach(function(item, qi){
        h += '<div class="quiz-q"><p class="qtext">'+(qi+1)+'. '+item.q+'</p><div class="quiz-opts">';
        item.opts.forEach(function(opt, oi){
          var cls = 'quiz-opt' + (picks[qi]===oi ? ' picked' : '');
          h += '<button class="'+cls+'" data-qi="'+qi+'" data-oi="'+oi+'">'+opt+'</button>';
        });
        h += '</div></div>';
      });
      h += '<div class="quiz-footer"><button class="btn btn-primary" id="exam-submit">Submit Exam</button>'+
        '<span class="quiz-score" id="exam-progress-note">'+picks.filter(function(p){return p!==null;}).length+' / '+examQuestions.length+' answered</span></div>';
      mount.innerHTML = h;
      mount.querySelectorAll('.quiz-opt').forEach(function(b){
        b.addEventListener('click', function(){
          picks[parseInt(b.dataset.qi,10)] = parseInt(b.dataset.oi,10);
          draw();
        });
      });
      document.getElementById('exam-submit').addEventListener('click', submitExam);
      return;
    }

    // results
    var r = phase;
    var h2 = '<div class="exam-result-banner '+(r.passed?'pass':'fail')+'"><h2>'+(r.passed?'PASSED':'NOT YET — try again')+'</h2>'+
      '<p style="margin:0">'+r.correctCount+' / '+examQuestions.length+' correct ('+r.pct+'%) &middot; needed '+EXAM_PASS_PCT+'% to pass'+(r.passed?' &middot; +'+EXAM_XP+' XP awarded':'')+'</p></div>';

    h2 += '<div class="exam-breakdown-wrap"><table class="exam-breakdown"><thead><tr><th>Domain</th><th>Score</th><th>%</th></tr></thead><tbody>';
    EXAM_COMPOSITION.forEach(function(c){
      var b = r.byDomain[c.domain];
      var bpct = b.total ? Math.round(b.correct/b.total*100) : 0;
      h2 += '<tr><td>'+c.label+'</td><td>'+b.correct+' / '+b.total+'</td><td>'+bpct+'%</td></tr>';
    });
    h2 += '</tbody></table></div>';

    h2 += '<h3 style="font-size:.9rem;color:var(--text-faint)">Review</h3>';
    examQuestions.forEach(function(item, qi){
      h2 += '<div class="quiz-q"><p class="qtext">'+(qi+1)+'. ['+item.domainLabel+'] '+item.q+'</p><div class="quiz-opts">';
      item.opts.forEach(function(opt, oi){
        var cls = 'quiz-opt';
        if(oi === item.correct) cls += ' correct';
        else if(picks[qi] === oi) cls += ' wrong';
        h2 += '<button class="'+cls+'" disabled>'+opt+'</button>';
      });
      h2 += '</div><div class="quiz-explain show">'+item.explain+'</div></div>';
    });
    h2 += '<div class="quiz-footer"><button class="btn btn-primary" id="exam-retake">Take It Again</button></div>';
    mount.innerHTML = h2;
    document.getElementById('exam-retake').addEventListener('click', function(){ phase='intro'; draw(); });
  }

  draw();
}

document.getElementById('btn-export').addEventListener('click', function(){
  var data = JSON.stringify(sectionStates, null, 2);
  var filename = 'proving-grounds-progress.json';
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({ filename:filename, data:data }).then(function(){
      showToast('Saved', filename);
    }).catch(function(err){
      if(err && err.code === 'declined') return;
      fallbackDownload(data, filename);
    });
  } else {
    fallbackDownload(data, filename);
  }
});
function fallbackDownload(data, filename){
  var blob = new Blob([data], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('Downloaded', filename);
}

document.getElementById('btn-import').addEventListener('click', function(){
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      sectionStates = normalizeSectionStates(parsed);
      state = sectionStates[currentSectionId];
      saveState();
      render();
      showToast('Imported', 'Progress restored');
    }catch(err){
      showToast('Import failed', 'File was not valid progress JSON');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('btn-reset').addEventListener('click', function(){
  var secName = sectionById(currentSectionId).name;
  if(!confirm('Reset progress for '+secName+'? This cannot be undone unless you exported a backup.')) return;
  sectionStates[currentSectionId] = defaultState();
  state = sectionStates[currentSectionId];
  touchStreak();
  saveState();
  go({type:'dashboard', sectionId:currentSectionId});
  showToast('Progress reset', secName);
});

/* ============================================================
   INIT
============================================================ */
render();

})();
</script>
